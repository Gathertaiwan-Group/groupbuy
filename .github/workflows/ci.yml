name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # 模組單元測試（node:test，純函式、不連 DB）：各模組 lib/modules/*/tests/*.test.mjs 與 lib/modules/*/*.test.ts
      # Node 22 需 --experimental-strip-types 才能直接載入 .ts
      - name: Unit tests
        run: node --experimental-strip-types --test 'lib/modules/*/tests/*.test.mjs' 'lib/modules/*/*.test.ts'
      # 不帶 Supabase env：頁面不得在 build 階段連 DB
      - run: npm run build

  fresh-db:
    # 全新 DB 一次套完全部 migration（scripts/apply-migrations.mjs 的順序、每檔一個交易；只用 CI 暫時 Postgres，不連正式庫）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/dev/fresh-db-apply.sh

  migrate:
    # 只在 main 的 push 上、且 supabase/migrations/** 有變更時套用；secrets 不存在則各步驟跳過（job 不會失敗）
    # 補H：build 與全新 DB 套用（fresh-db）都通過才套正式庫
    needs: [build, fresh-db]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: supabase-migrations
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF 未設定，略過 migration。"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.present == 'true'
        with:
          fetch-depth: 0
      - name: Detect migration changes
        id: changes
        if: steps.secrets.outputs.present == 'true'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # 首次 push / 強推：以是否存在 migration 檔為準（帳本 groupbuy.schema_migrations 保證冪等）
            if ls supabase/migrations/*.sql >/dev/null 2>&1; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" -- 'supabase/migrations/**' | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: 22
      - name: Apply pending migrations (Management API, 絕不 supabase db push)
        if: steps.changes.outputs.changed == 'true'
        run: node scripts/apply-migrations.mjs
