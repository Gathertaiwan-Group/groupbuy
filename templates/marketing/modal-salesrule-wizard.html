function descrJoin(parts) {
	return parts.filter(function(p) { return p !== '' && p != null; }).join('');
}
var fnDescr = {
	salesOrder: function(w) {
		var minimum = w.field('minimum'), dop = w.field('dollarOrPercentage'), discount = w.field('discount');
		var a = (minimum.opts.prependText || minimum.label || '').trim();
		var o = dop.option();
		return descrJoin([a, minimum.data(), (w.def.unit || {}).minimum || '', ' ', (dop.opts.prependText || dop.label || '').trim(), o ? o.label : '', discount.data(), o ? o.unit : '']);
	},
};
function fnGiftDescr(w) {
	var minimum = w.field('minimum'), discount = w.field('discount');
	return descrJoin([(minimum.label || '').trim(), minimum.data(), (w.def.unit || {}).minimum || '', ' 贈送', discount.data(), '個/件']);
}
var fnGiftDescrItem = fnGiftDescr;
function fnConstraintDescr(w) {
	var minimum = w.field('minimum');
	return descrJoin([(minimum.opts.prependText || minimum.label || '').trim(), minimum.data(), (w.def.unit || {}).minimum || '元']);
}

		def.fields.forEach(function(fd) {
			var $el = wizard.renderField(fd);
			if (!$el) return;
			fd.$el = $el;
			if (fd.opts.appendTo && fd.type !== 'hidden') {
				var sel = fd.opts.appendTo.replace(/^#([^ ]+)/, function(m, id) { return '[id="' + id + '"]'; });
				$form.find(sel).first().append($el);
			} else {
				$form.append($el);
				if (fd.type !== 'hidden') $el.hide();
			}
			fd.$el = wizard.initInput(fd, $el);
		});
		// 初始狀態連動
		['withinPeriod', 'repeatable', 'irregular', 'needMainItem', 'dollarOrPercentage', 'tagTotal'].forEach(function(n) {
			if (callbacks[n]) wizard.input({name:n}).first().each(function() { callbacks[n].call(this); });
		});
		wizard.nextField();
	},
	steppable: function(fd) {
		return fd.type !== 'hidden' && fd.type !== 'button' && fd.type !== 'container' && !(fd.opts.appendTo);
	},
	nextField: function() {
		var list = wizard.fields;
		while (wizard.pointer < list.length) {
			var fd = list[wizard.pointer++];
			if (!wizard.steppable(fd) || !fd.$el) continue;
			fd.$el.show();
			if (fd.name === 'title' && !wizard.input(fd).val() && typeof wizard.def.descr === 'function') {
				try { wizard.input(fd).val(wizard.def.descr.call(wizard.def, wizard)); } catch (e) {}
			}
			var hasNext = fd.$el.find('.wizard-next-field').length > 0;
			if (hasNext && !fd.$el.hasClass('d-none') && wizard.pointer < list.length) {
				fd.$el.find('.wizard-next-field').show();
				break;
			}
			fd.$el.find('.wizard-next-field').hide();
		}
		if (wizard.pointer >= list.length) {
			$footer.find('button[data-action=submit]').show();
		}
		var $last = fd && fd.$el ? fd.$el : null;
		if ($last && $last.length && $last[0].scrollIntoView) {
			try { $last[0].scrollIntoView({block:'nearest'}); } catch (e) {}
		}
	},
	validate: function($scope) {
		var ok = true;
		$scope.find('label.error').remove();
		$scope.find(':input.required').each(function() {
			var $i = $(this);
			if (!$i.is(':visible') || $i.closest('.d-none').length) return;
			if (String($i.val() == null ? '' : $i.val()).trim() === '') {
				ok = false;
				$i.after('<label class="error">需要填寫內容</label>');
			}
		});
		return ok;
	},
	values: function() {
		var out = {};
		function put(path, v) {
			var keys = path.split('.');
			var o = out;
			for (var i = 0; i < keys.length - 1; i++) { o = o[keys[i]] = o[keys[i]] || {}; }
			o[keys[keys.length - 1]] = v;
		}
		wizard.fields.forEach(function(fd) {
			if (fd.type === 'button' || fd.type === 'container' || fd.name === 'continue') return;
			var $in = wizard.input(fd);
			if (!$in.length) return;
			if (fd.type !== 'hidden' && $in.first().closest('.d-none').length) return;
			var v;
			if (fd.type === 'radio') v = $in.filter(':checked').val();
			else if (fd.type === 'checkbox') v = $in.prop('checked') ? 'true' : 'false';
			else if (fd.type === 'select2') { v = $in.val() || []; if (!v.length) return; }
			else v = $in.val();
			if (v === undefined || v === null) return;
			put(fd.opts.submitName || fd.name, v);
		});
		out.category = wizard.def.category || wizard.def.key;
		return out;
	},
	submit: function() {
		if (!wizard.validate($form)) {
			$result.html('');
			return;
		}
		var payload = {groupBuyId: groupBuyId, data: [wizard.values()]};
		var again = wizard.input({name:'continue'}).prop('checked');
		wizard.loading(true);
		$.ajax({
			type: 'POST',
			url: baseUrl + '/ajax/SalesRule/save?groupBuyId=' + encodeURIComponent(groupBuyId),
			data: $.param(payload),
			dataType: 'json',
		}).done(function(json) {
			wizard.loading(false);
			// 推導：成功提示文字（原站未擷取）
			$result.empty().append($('<span class="text-success"></span>').text('新增成功'));
			$footer.find('button[data-action=submit]').hide();
			$footer.find('button[data-action=continue],button[data-action=new]').show();
			if (typeof window.salesRuleTable !== 'undefined' && window.salesRuleTable && window.salesRuleTable.ajax) {
				try { window.salesRuleTable.ajax.reload(null, false); } catch (e) {}
			}
			if (again) wizard.action('continue', true);
		}).fail(function(xhr) {
			wizard.loading(false);
			var msg = (xhr.responseJSON && (xhr.responseJSON.error || xhr.responseJSON.message)) || (xhr.status + ' ' + (xhr.statusText || ''));
			$result.empty().append($('<span class="text-danger"></span>').text(msg));
		});
	},
	action: function(action, keepResult) {
		switch (action) {
		case 'submit':
			wizard.submit();
			break;
		case 'new':
			$result.html('');
			wizard.gotoStep('wizard-step1-all');
			break;
		case 'continue':
			if (!keepResult) $result.html('');
			$modal.animate({scrollTop:0}, 200);
			$footer.find('button[data-action]').hide();
			if (wizard.cardKey) wizard.build(wizard.cardKey);
			if (keepResult) $footer.find('button[data-action=new]').show();
			break;
		}
	},
};

var callbacks = {
	withinPeriod: function() {
		var on = wizard.input({name:'withinPeriod'}).prop('checked');
		['dateStartString', 'dateEndString'].forEach(function(n) {
			wizard.input({name:n}).toggleClass('d-none', !on);
		});
	},
	repeatable: function() {
		var v = wizard.input({name:'repeatable'}).filter(':checked').val();
		wizard.group('maxApplyTimes').toggleClass('d-none', v !== '0');
	},
	irregular: function() {
		var on = wizard.input({name:'irregular'}).prop('checked');
		wizard.group('repeatMinimum').toggleClass('d-none', !on);
		wizard.group('repeatDiscount').toggleClass('d-none', !on);
	},
	needMainItem: function() {
		var on = wizard.input({name:'needMainItem'}).prop('checked');
		['tag1', 'tag1Id', 'tag1Minimum'].forEach(function(n) { wizard.group(n).toggleClass('d-none', !on); });
	},
	tagTotal: function() {
		var raw = String(wizard.input({name:'tagTotal'}).val() || '').trim();
		var n = raw === '' ? 0 : Math.max(1, Math.min(3, parseInt(raw, 10) || 0));
		for (var i = 1; i <= 3; i++) {
			['tag' + i, 'tag' + i + 'Id', 'tag' + i + 'Minimum'].forEach(function(name) { wizard.group(name).toggleClass('d-none', i > n); });
		}
		callbacks.packDiscount();
	},
	packDiscount: function() {
		if (!wizard.def || wizard.def.key !== 'TAG_MATCH_2') return;
		var total = 0;
		for (var i = 1; i <= 3; i++) {
			if (wizard.group('tag' + i + 'Minimum').hasClass('d-none')) continue;
			total += Math.max(0, parseInt(wizard.input({name:'tag' + i + 'Minimum'}).val(), 10) || 0);
		}
		var pack = parseFloat(wizard.input({name:'packDiscount'}).val());
		wizard.input({name:'minimum'}).val(total || '');
		wizard.input({name:'discount'}).val(total > 0 && !isNaN(pack) ? Math.round(pack / total * 100) / 100 : '');
	},
	dollarOrPercentage: function() {
		var o = wizard.field('dollarOrPercentage').option();
		if (!o) return;
		var $d = wizard.input({name:'discount'});
		if (!$d.length || $d.prop('readonly')) return;
		$d.attr('placeholder', o.placeholder || '');
		$d.siblings('.input-group-append').find('.input-group-text').text(o.unit || '');
	},
};

/* ---------- 事件 ---------- */
$root.off('.srWizard');
$root.on('click.srWizard', '.card-wizard', function() {
	wizard.openCard($(this).attr('data-type'));
});
$root.on('click.srWizard', '.breadcrumb-wizard .breadcrumb-item', function() {
	var id = $(this).attr('data-step');
	if (id && id !== 'wizard-stepfinal') wizard.gotoStep(id);
});
$root.on('click.srWizard', '.wizard-next-field', function() {
	var $g = $(this).closest('.form-group');
	if (!wizard.validate($g)) return;
	$(this).hide();
	wizard.nextField();
});
$root.on('change.srWizard input.srWizard', ':input', function() {
	$(this).siblings('label.error').remove();
});
$root.on('input.srWizard', 'input[name=packDiscount]', callbacks.packDiscount);
$footer.off('click.srWizard').on('click.srWizard', 'button[data-action]', function(e) {
	e.preventDefault();
	wizard.action($(this).attr('data-action'));
});
$form.on('submit', function(e) { e.preventDefault(); });

wizard.renderCards('all', cards);
$footer.find('button[data-action]').hide();
wizard.gotoStep('wizard-step1-all');
window.salesRuleWizard = wizard;
})();
</script>
