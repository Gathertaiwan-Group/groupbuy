			ssd('PERCENTAGE','折扣數(%)','輸入折數(10=九折,15=八五折)','%'),
			ssd('POINT','會員點數累積','輸入點數','點'),
		],
		price:[
			ssd('DOLLAR','折扣(金額)','輸入折扣金額','$'),
			ssd('SALE_PRICE','新售價','輸入新售價','$'),
			ssd('PERCENTAGE','團購價折扣數(%)','輸入折數(10=九折,15=八五折)','%'),

var previewSalesRule = {
	type1 : function (s) {
		if (typeof s.descr == 'function') {
			var descr = s.descr();
			if (descr.length) {
				descr = '<span class="help-text">' + descr + '</span>';
				descr += '<button type="button" class="btn btn-sm btn-default btn-copy-title p-2 ml-2">貼上</button>';
			}
			$('#title-group .help-block').html(descr);
		}
	},
	typeX : function (s) {
		var minimum = s.field('minimum');
		var dollarOrPercentage = s.field('dollarOrPercentage');
		var discount = s.field('discount');
		var isPercent = wizard.isPercent(dollarOrPercentage.data());
		var descr = isPercent ? (s.descrP || s.descr) : s.descr;
		var html = descr
			.format(
				minimum.label,
				minimum.data(),
				dollarOrPercentage.label,
				dollarOrPercentage.option().label,
				discount.data()
			);
		var maxApplyTimes = s.field('maxApplyTimes').data();
		if (maxApplyTimes == -1) {
			if (isPercent) maxApplyTimes = 1;
			else maxApplyTimes = 10;
		}
		for (var i = 2; i <= 10; i++) {
			var factor = Math.min(i,maxApplyTimes);
			if (i == 4) html += '<br>...';
			if (i < 4 || i == maxApplyTimes || i == 10) {
				html += '<br>' + descr
				.format(
					minimum.label,
					minimum.data()*i,
					dollarOrPercentage.label,
					dollarOrPercentage.option().label,
					discount.data()*factor,
				);
			}
		}
		$('#salesRuleDescr').html(html);
	},
	type2 : function (s) {
		var minimum = s.field('minimum');
		var dollarOrPercentage = s.field('dollarOrPercentage');
		var discount = s.field('discount');
		var isPercent = wizard.isPercent(dollarOrPercentage.data());
		var descr = isPercent ? (s.descrP || s.descr) : s.descr;
		var minimumV = minimum.data();
		var startI = Math.max(1, minimumV-2);
		var maxApplyTimes = s.field('maxApplyTimes').data();
		if (maxApplyTimes == -1) {
			if (isPercent) maxApplyTimes = 1;
			else maxApplyTimes = 10;
		}
		var html = '';
		for (var i = startI; i < startI+10; i++) {
			var factor = Math.min(i,maxApplyTimes);
			var d = 0;
			if (i >= minimumV && i <= maxApplyTimes) {
				d = discount.data();
			}
			html += '<br>' + descr
			.format(
				minimum.label,
				i,
				dollarOrPercentage.label,
				dollarOrPercentage.option().label,
				d,
			);
		}
		$('#salesRuleDescr').html(html);
	}
}
var f = function(name,label,opts,type,required = false) {
	opts = opts || {};
	var ret = {
		name:name,
		type:type,
		label:label,
		opts:opts,
		required:required,
		selector:function(selected = false) {
			var nameEscaped = $.escapeSelector(name);
			var selector = '#wizard-stepfinal :input[name='+nameEscaped+']';
			var input = $(selector);
			if (selected && input.length > 1 && (this.type == 'radio' || this.type == 'select' || this.type == 'checkbox') ) {
				selector = '#wizard-stepfinal :input[name='+nameEscaped+']:checked';
				input = $(selector);
			}
			return input;
		},
		data:function () {
			return this.selector(true).val();
		},
		option:function() {
			if (this.opts.options == null) return null;
			var value = this.data();
			return this.opts.options.find(o=>o.name == value);
		},
		appendTo:function(selector) {
			var body = '';
			var placeholder = this.opts.placeholder || '';
			var inputGroupClassName = this.opts.groupClassName || '';
			var formGroupClassName = this.opts.formGroupClassName || '';
			var inputClassName = this.opts.inputClassName || '';
			var fieldInfo = this.opts.fieldInfo || '';
			var defaultValue = this.opts.defaultValue || '';
			var nextField = (this.opts.ignoreNextField) ? '' :
				`<div class="col-md-2 text-right text-md-center pt-2 p-md-0">
					<button type="button" class="btn btn-sm btn-primary m-0 p-2 wizard-next-field">
						下一步
					</button>
				</div>`;
			if (typeof fieldInfo == 'function') fieldInfo = fieldInfo();
			fieldInfo = '<div class="help-block text-primary small mt-1">'+(fieldInfo || '')+'</div>';
			var prependText = '';
			var appendText = '';
			if (this.opts.prependText) {
				prependText = '<div class="input-group-prepend"><span class="input-group-text">'+this.opts.prependText+'</span></div>';
			}
			if (this.opts.appendText) {
				appendText = '<div class="input-group-append"><span class="input-group-text">'+this.opts.appendText+'</span></div>';
			}
			switch (this.type) {
			case 'radio': case 'checkbox':
				if (this.opts.options) {
					var _this = this;
					body = '<div class="input-group-prepend">'+prependText+'<div class="btn-group btn-group-toggle" data-toggle="buttons">';
					this.opts.options.forEach(function(o,i) {
						body += `<label class="btn btn-sm btn-input-check m-0 p-2 {0}">
							<input type="{1}" name="{2}" value="{3}" {4}>{5}
						</label>`
						.format(
							(i == 0) ? 'active' : '',
							_this.type,
							_this.name,
							o.name,
							(i == 0) ? 'checked' : '',
							o.label
						);
					});
					body += '</div></div>';
				} else {
					body = `<div class="custom-control custom-switch {0}">
						<input type="checkbox" class="custom-control-input" name="{1}" value="1" id="{2}">
						<label class="custom-control-label" for="{3}">{4}</label>
					</div>`
					.format(
						inputClassName,
						this.name,
						this.name,
						this.name,
						placeholder,
					);
				}
				break;
			case 'hidden':
				body = `<input type="hidden" id="{0}" name="{1}" value="{2}" placeholder="{3}" class="form-control {4}" autocomplete="off">`
				.format(
					this.name,
					this.name,
					defaultValue,
					placeholder,
					inputClassName,
				);
				break;
			case 'text': case 'date':
				body = `<input type="text" id="{0}" name="{1}" value="{2}" placeholder="{3}" class="form-control {4}" autocomplete="off">`
				.format(
					this.name,
					this.name,
					defaultValue,
					placeholder,
					inputClassName,
				);
				if (prependText.length || appendText.length) {
					body = `<div class="input-group {0}">{1}{2}{3}</div>`
					.format(
						inputGroupClassName,
						prependText,
						body,
						appendText
					);
				}
				break;
			case 'select2':
				body = `<select id="{0}" name="{1}" class="form-control {2}" multiple="multiple"></select>`
				.format(
					this.name,
					this.name,
					inputClassName,
				);
			}

			if (this.opts.appendTo) {
				$form = $(this.opts.appendTo).append(body);
			} else if (this.type == 'hidden') {
				$form = $(selector).append(body);
			} else if (this.type == 'container') {
				var html = `<div class="" id="{0}-group">
				</div>`
				.format(this.name);
				$form = $(selector).append(html);
			} else {
				var html = `<div class="form-group row {0}" id="{1}-group">
					<label class="col-md-3 text-md-center" for="{2}">{3}</label>
					<div class="col-md-7">
						<div class="input-group">
						{4}
						</div>
						{5}
					</div>
					{6}
				</div>`
				.format(
					formGroupClassName,
					this.name,
					this.name,
					this.label,
					body,
					fieldInfo,
					nextField,
				);
				if (this.opts.after) {
					$form = $(this.opts.after).after(html);
				} else {
					$form = $(selector).append(html);
				}
			}

			var $input = this.selector();
			var $formGroup = $input.closest('.form-group');
			if (this.opts.callback) {
				$input.on('change', this.opts.callback);
			} else if (callbacks[this.name]) {
				$input.on('change', callbacks[this.name]);
			}

			switch (this.type) {
			case 'select2':
				$input.select2({
					width: '100%',
					inputClass:'input-large',
					closeOnSelect : false,
					dropdownAutoWidth:true,
					placeholder:placeholder,
					language:'zh-TW',
					ajax: {
						delay:350,
						url: this.opts.lookup,
						dataType: 'json'
					}
				});
				$formGroup.find(".select2-search.select2-search--inline").prepend("<i class='fa-light fa-search mr-1'></i>");
				$input.on("select2:unselect", function(e) {
					var $this = $(this);
					var option = $this.find('option[value='+e.params.data.id+']');
					var selected = option.prop('selected');
					if (selected) {
						option.prop('selected', false);
						$this.data('select2').trigger('unselect', e.params);
						$this.trigger('change');
					}
					//$input.parent().find('input.select2-search__field').prop('placeholder', placeholder);
				});
				break;
			case 'date':
				var dateFormat = this.opts.dateFormat || 'YYYY-MM-DD';
				initDatetimePicker($input, dateFormat, 'days');
				break;
			}
			return $formGroup;
		},
		trigger:function(evt) {
			this.selector(true).trigger(evt);
		}
	};
	return ret;
};

var sr = function(name, opts) {
	var ret = opts;
	ret.name = name;
	if (!ret.category) {
		ret.category = name;
	}
	ret.field = function(name) {
		return this.fields.find(o=>o.name == name);
	};
	ret.buildForm = function(selector) {
		$(selector).html('');
		this.fields.forEach(f => f.appendTo(selector));
		this.fields.forEach(f => f.trigger('change'));
		ret.formGroup = $(selector).find('.form-group')[0];
		//@TEST
		ret.nextField(true);
		$('#wizard-stepfinal .preview').hide();
		$('button[data-action]').hide();
		$('#wizard-stepfinal')
			.off('click')
			.on('click', '.wizard-next-field', function() {
				console.log('click');
				$(this).hide();
				ret.nextField();
			});
	};
	ret.nextField = function(hasNextField = false) {
		$(ret.formGroup).nextAll('.form-group').each((i,f) => {
			var $formGroup = $(f);
			if ($formGroup.hasClass('d-none')) return;

			if (hasNextField) {
				$formGroup.hide();
			} else {
				$formGroup.show().animateCss('fadeIn ');
			}
			if (!hasNextField) {
				hasNextField = $formGroup.find('.wizard-next-field').length > 0;
				if (hasNextField) {
					ret.formGroup = f;
				}
			}
		});
		if (!hasNextField) {
			$('#wizard-stepfinal .preview').show().animateCss('fadeIn ');
			$('button[data-action="submit"]').show().animateCss('fadeIn ');
		}
	}

	var copyMap = function(full, sub) {
		var ret = {};
		if (!full && !sub) {
			ret = {};
		} else if (!sub) {
			ret = full;
		} else {
			//ret = full;
			for (var n in full) {
				ret[n] = full[n];
			}
			for (var n in sub) {
				ret[n] = sub[n];
			}
		}
		return ret;
	}

	if (ret.mode && ret.mode == 'f') {
		ret.fields = ret.fields.flatMap(f => {
			var df = defaultFields.find(f1 => f1.name == f.name);
			f.type = f.type || df.type;
			f.label = f.label || df.label;
			f.required = f.required || df.required;
			// f.opts = f.opts || df.opts || {};
			f.opts = copyMap(df.opts, f.opts);
			return f;
		});
	} else {
		ret.fields = defaultFields
			.filter(e => {
				return e.required || opts.fields.find(e2 => e2.name == e.name);
			})
			.flatMap(f => {
				var df = opts.fields.find(f1 => f1.name == f.name);
				if (!df) return f;
				df.type = df.type || f.type;
				df.label = df.label || f.label;
				df.required = df.required || f.required;
				// df.opts = df.opts || f.opts || {};
				df.opts = copyMap(f.opts, df.opts);
				return df;
			});
	}

	ret.fields.push(f('category','',{defaultValue:ret.category},'hidden'));

	return ret;
}

			$('#giftTagRule-group').show();
		} else {
			$('#giftTagRule-group').hide();
		}
	},
	repeatable : function () {
		if (!$(this).prop('checked')) return;
		var v = $(this).val();
		if (v == 0) {
			$('input[name=maxApplyTimes]').closest('.input-group').removeClass('d-none');
			$('input[name=maxApplyTimes]').val('1').change();
		} else {
			$('input[name=maxApplyTimes]').closest('.input-group').addClass('d-none');
			$('input[name=maxApplyTimes]').val(v).change();
		}

		var checked = $(this).prop('checked');
		if (checked) {
			$('#tag1-group').removeClass('d-none');
			$('#tag1Id-group').removeClass('d-none');
			$('#tag1Minimum-group').removeClass('d-none');
		} else {
			$('#tag1-group').addClass('d-none');
			$('#tag1Id-group').addClass('d-none');
			$('#tag1Minimum-group').addClass('d-none');
			$(':input[name=tag1]').val(null).change();
			$(':input[name=tag1Id]').val(null).change();
		}
	},
	tagTotal : function() {
		var v = parseInt($(this).val());
		if (isNaN(v)) return;
		v = Math.max(1,v);
		v = Math.min(6,v);
		for (var i = 1; i < 7; i++) {
			if (i <= v) {
				$(':input[name^=tag'+i+']').closest('.form-group').removeClass('d-none');
			} else {
				$(':input[name^=tag'+i+']').closest('.form-group').addClass('d-none');
			}
		}
	},
	packDiscount : function() {
		if (!$(':input[name^=tag][name$=Minimum]').length) return;
		var v = parseInt($(':input[name=packDiscount]').val());
		if (isNaN(v)) {
			$(':input[name=packDiscount]').val('');
			v = 0;
		}
		var round = function(value, decimals) {
			return Number(Math.floor(value+'e'+decimals)+'e-'+decimals);
		}
		var total = $(':input[name^=tag][name$=Minimum]').toArray().flatMap(o=>parseInt($(o).val()) || 0).reduce((a,b)=>a+b) || 1;
		$(':input[name=discount]').val(round(v/total,2));
	},
	level : function() {
		var v = parseInt($(this).val());
		if (isNaN(v)) return;
		var option = wizard.s.field('dollarOrPercentage').option();
		v = Math.max(1,v);
		v = Math.min(6,v);

		$('div[id^=discount][id$=group]').filter((i,s)=>s.id != 'discount-group').remove();
		$('div[id^=minimum][id$=group]').filter((i,s)=>s.id != 'minimum-group').remove();

			f('discount'+i,' ',{after:after,placeholder:option.placeholder,prependText:option.label,appendText:option.unit,groupClassName:'mb-2'},'text')

			f('minimum'+i,' ',{after:after,placeholder:'輸入滿額',prependText:'下個滿額'},'text')
			.appendTo().hide();
		}
	},
}

var _fnGiftDescr = function(prefix = '訂單', xthis) {
	var minimum = xthis.field('minimum');
	var dollarOrPercentage = xthis.field('dollarOrPercentage');
	var discount = xthis.field('discount');
	var maxApplyTimes = xthis.field('maxApplyTimes').data();
	var isPercent = wizard.isPercent(dollarOrPercentage.data());
	var a = $(':input[name^=tag]')
		.toArray()
		.filter(o=>$(o).val() && $(o).prop('name').match('\\d$'))
		.flatMap(o=>{
			var n = $(o).prop('name');
			var minimum = xthis.field(n+'Minimum');
			if (minimum == null) {
				minimum = xthis.field('minimum');
			}
			return xthis.field(n).data() + '任選' + minimum.data() + xthis.unit.minimum;
		}).join('搭配')
	if (!a.length) {
		a = prefix+((maxApplyTimes == -1 || maxApplyTimes > 1) && !isPercent ? '每':'')+'滿' + minimum.data() + xthis.unit.minimum;
	}
	return a
		+ '可享' + dollarOrPercentage.option().label + discount.data() + dollarOrPercentage.option().unit
		+ ((maxApplyTimes > 1) ? '最多'+maxApplyTimes+'次' : '');
}

	loading:function(loading = true) {
		if (loading) {
			btnStartLoading($('button[data-action="submit"]'));
		} else {
			btnStopLoading($('button[data-action="submit"]'));
		}
	},
	registerCallbacks : function () {
		this.registerInputCallback();
		this.registerCopyTitleCallback();
		this.registerButtons();
	},
	registerButtons : function () {
		var _this = this;
		$('button[data-action]').on('click', function() {
			var action = $(this).data('action');
			switch(action) {
			case 'submit':
				_this.loading(true);
				var validator = $('#wizard-stepfinal-form').validate();
				if (validator.valid()) {
					_this.submit();
				} else {
					_this.loading(false);
					var msg = '有'+validator.numberOfInvalids()+'個欄位有問題';
					$('.submit-result').attr('class', 'submit-result text-danger').html(msg);
				}
				break;
			case 'new':
				_this.goStep('wizard-step1-all');
				break;
			case 'continue':
				$('.submit-result').html('');
				$(".modal-body-wizard").animate({scrollTop:0},200);
				$('button[data-action]').hide();
				$('button[data-action="submit"]').show().animateCss('fadeIn ');
				//$('select[name^=tag').val('').change();
				{{!-- 原站選擇器少了 ]（jQuery 會丟語法錯誤），此處補上 --}}
				$('input[name=minimum]').val('');
				break;
			}
		});
	},
	registerInputCallback : function () {
		var _this = this;
		$('#wizard-stepfinal').on('change', ':input', function() {
			var s = _this.s;
			if (s.preview) {
				s.preview(s);
			} else {
				previewSalesRule.type1(s);
			}
		})
	},
	registerCopyTitleCallback : function() {
		$(this.formSelectorName).on('click', '.btn-copy-title', function() {
			var parent = $(this).parent().parent();
			parent.find('input').val(parent.find('.help-text').html());
		});
	},
	init : function(groupBuyId) {
		console.log('w.init');
		var _this = this;
		if (_this.inited) return;
		_this.init = true;
		_this.groupBuyId = groupBuyId;
		_this.stepsHtml(_this.steps, 1, 'all');
		$('.wizard-step').hide();
		$('.wizard-step1').show();
		$(' .card.card-wizard').click(function(){
			var type = $(this).data('type');
			var step = $(this).data('step') + 1;
			var id = 'wizard-step{0}-{1}'.format(step,type);
			if (salesRules.r(type) != null) {
				id = 'wizard-stepfinal';
				_this.buildForm(type);
			}
			_this.goStep(id);
			var title = $(this).find('.card-header').text() || $(this).find('.card-body').text();
			$('.breadcrumb-wizard').append(
				`<li class="breadcrumb-item" data-step="{0}">{1}</li>`
				.format(id, title)
			);
		});
		$('.breadcrumb-wizard').on('click', '.breadcrumb-item', function() {
			var step = $(this).data('step');
			_this.goStep(step);
		});
		$('.modal-footer-wizard').hide();
		_this.registerCallbacks();
	},
	submit:function() {
		var _this = this;
		var data = {};
		$(this.formSelectorName).serializeArray().forEach(obj => {
			var name = obj.name;
			// hack for salesRuleSettings;
			if (name == 'repeatMinimum' || name == 'repeatDiscount') {
				name = 'salesRuleSettings.' + name;
			}
			if (obj.value == '') return;
			if (name.indexOf('.') > 0) {
				var arr = name.split('.');
				if (data[arr[0]] == null) {
					data[arr[0]] = {};
				}
				data[arr[0]][arr[1]] = obj.value;
			} else if (data[name] != null) {
				if (typeof data[name] != 'object') {
					// in case there are other forms with the same input
					data[name] = $('#wizard-stepfinal-form :input[name="'+name+'"]').val();;
				}
			} else {
				data[name] = obj.value;
			}
		});
		var dataArray = [data];
		console.log('da=%o', dataArray);
		var url = GBF.baseUrl + '/ajax/SalesRule/save';
		$.post(url, {
			data:dataArray,
			groupBuyId:this.groupBuyId
		})
		.done(function(data, textStatus, jqXHR) {
			var json = data.data;
			$('.submit-result').attr('class', 'submit-result text-success').html('成功新增');
			salesRuleTable.ajax.reload();

			$('button[data-action="new"]').show().animateCss('fadeIn ');
			$('button[data-action="continue"]').show().animateCss('fadeIn ');
			$('button[data-action="submit"]').hide().animateCss('fadeOut ');
		})
		.fail(function(jqXHR, textStatus, errorThrown) {
			var json = jqXHR.responseJSON;
			var msg = (json != null && json.error != null) ? json.error : textStatus;
			$('.submit-result').attr('class', 'submit-result text-danger').html(msg);
		})
		.always(function(jqXHR, textStatus, errorThrown) {
			_this.loading(false);
		});
	},
	data:function(name) {
		var selector = '#wizard-stepfinal :input[name='+name+']';
		var input = $(selector);
		var type = input.prop('type');
		if (type == 'radio' || type == 'select' || type == 'checkbox') {
			selector = '#wizard-stepfinal :input[name='+name+']:checked';
			input = $(selector);
		}
		return input.val();
	},
	stepsHtml: function(steps, step, type) {
		if (steps == null) return;
		var _this = this;
		var html = `<div class="wizard-step wizard-step{0}" id="wizard-step{1}-{2}">
			<div class="row">`
		.format(step, step, type);
		steps.forEach(function(obj,i) {
			if (obj.type == 'DESCR') {
				html += `<div class="col-12 my-4"><h4>{0}</h4></div>`
				.format(obj.descr);
			} else {
				html += `<div class="col-6 mb-4"><div class="card card-wizard" data-type="{0}" data-step="{1}">
					<div class="card-header">{2}</div>
					<div class="card-body">{3}</div>
				</div></div>`
				.format(obj.type, obj.step, obj.title, obj.descr);
			}
		});
		html += '</div></div>';
		$('.wizard-body').append(html);
		steps.forEach(function(obj,i) {
			_this.stepsHtml(obj.steps, obj.step+1, obj.type);
		});
	},
	currentStep : function() {
		return $('.breadcrumb-wizard .breadcrumb-item:last-child').data('step');
	},
	goStep : function(step) {
		var _this = this;
		console.log('gostep');
		if (step == _this.currentStep()) return;

		$('.wizard-step').hide();
		$('#'+step).show().animateCss('slideInRight faster');
		$('.breadcrumb-wizard .breadcrumb-item').each(function(idx, obj) {
			var s = $(obj).data('step');
			if (s > step) $(obj).remove();
		});
		if (step == 'wizard-stepfinal') {
			$('.modal-footer-wizard').show();
		} else {
			$('.modal-footer-wizard').hide();
		}
	},
	buildForm : function(type) {
		var s = salesRules.r(type);
		this.s = s;
		s.buildForm('#wizard-stepfinal-form');
	},
	buildFormDollarOrPercentage : function(opts) {
		var html = '';
		opts.forEach(function(obj,i) {
			var active = (i == 0) ? 'active' : '';
			var checked = (i == 0) ? 'checked' : '';
			html += `
			<label class="btn btn-sm btn-input-check m-0 p-2 {0}">
				<input type="radio" name="dollarOrPercentage" value="{1}" {2}>{3}
			</label>`
			.format(active, obj.name, checked, obj.label)
		});
		$('#dollarOrPercentage-group').html(html);
		$('input[name=dollarOrPercentage]').change();
	}
};

	$('#myModal').data('bs.modal')._config.keyboard = false;
	$('#myModal').data('bs.modal')._config.backdrop = 'static';
	console.log('wizard init');
	wizard.init({{groupBuyId}});
