<script type="text/javascript" class="init">
	var table; // gbis table
	var editor; // use a global for the submit and return data rendering in the examples
	var salesRuleEditor;
	var groupBuyCouponTable;
	var salesRuleTable;
	$.extend( true, $.fn.dataTable.defaults, {
		"searching": false,
		"pageLength":20,
	} );

	$(document).ready(function() {


var groupBuyCouponTableName = '#groupBuyCouponTable';
groupBuyCouponEditor = new $.fn.dataTable.Editor( {
	ajax: {
		create: {
			type: 'POST',
			url: '{{baseUrl}}/ajax/GroupBuyCoupon/save.do?groupBuyId={{groupBuyId}}'
		},
		edit: {
			type: 'POST',
			url: '{{baseUrl}}/ajax/GroupBuyCoupon/update.do?groupBuyId={{groupBuyId}}&groupBuyCouponId=_id_'
		},
		remove: {
			type: 'POST',
			url: '{{baseUrl}}/ajax/GroupBuyCoupon/delete.do?groupBuyId={{groupBuyId}}&groupBuyCouponId=_id_'
		}
	},
	table: groupBuyCouponTableName,
	idSrc: 'groupBuyCouponId',
	fields: [
		{
			label:'',
			name:'useTemplate',
			type:'radio',
			def:'1',
			options:[
				{label:'使用優惠卷樣板快速設定', value:'1'},
				{label:'不使用優惠卷樣板', value:'0'},
			]
		},
		DataTableConfig.field_select('優惠卷樣板','couponTemplateId', null, '請選擇(必填)'),
		DataTableConfig.field_select('優待卷類型','category',null, '請選擇(必填)'),
		DataTableConfig.field_input('標題','title'),
		DataTableConfig.field_input('最小單位(金額/件數)','minimum', '0'),
		DataTableConfig.field_select('折扣方式','dollarOrPercentage'),
		DataTableConfig.field_input('折扣(金額/折數)','discount', '0'),
		DataTableConfig.field_input('折抵金額上限','couponSettings.maxDiscount'),
		DataTableConfig.field_checkbox_bool('可合併計算','combinable'),
		//DataTableConfig.field_input('優先順序','priority','1'),
		DataTableConfig.field_select('優惠條件','salesRuleId', null, '請選擇(必填)'),
		DataTableConfig.field_checkbox_bool('會員限定','couponSettings.customerOnly',0,'僅登入會員能使用/獲取該折扣碼'),
		DataTableConfig.field_select2_f('優惠條件會員身份','couponSettings.royaltyProgramId[]','','','需符合會員身份才能享有優惠。無設定時，不限制會員身份。','','{{baseUrl}}/ajax/RoyaltyProgram/lookup', true),
		DataTableConfig.field_input('獲取數量','couponSettings.redeemNumber','1','','','當會員使用該折扣碼時，可獲得該折扣碼的數量，最少(預設)為1。若數量為3則該會員能使用同一個折扣碼3次。'),
		DataTableConfig.field_input('相同折扣碼可被重複使用結帳次數(-1代表無限制)','availableQuota','-1','','輸入 -1 → 表示沒有限制，大家都可以一直用。輸入 2 → 表示這組折扣碼只能被用 2 次，之後就不能再用了。'),
		DataTableConfig.field_checkbox_bool('可跨團使用','applyToAllGroupBuy',0,'該折扣碼可用於不同表單內。預設未勾取時，僅限定於該表單內使用'),
		DataTableConfig.field_checkbox_bool('新增為樣板','createTemplate',0,'將此折扣碼設定保存至樣板方便日後新增同類型使用'),
	],
	formOptions:DataTableConfig.formOptions,
	i18n:DataTableConfig.i18n,
} );

groupBuyCouponTable = $(groupBuyCouponTableName).DataTable( {
	dom: 'lBfrtip',
	serverSide:true,
	processing:true,
	scrollX: true,
	lengthMenu: [10, 25, 50],
	ajax: {
		url:'{{baseUrl}}/ajax/GroupBuyCoupon/list.do?groupBuyId={{groupBuyId}}',
		type: "POST",
		data: function ( d ) {
			d.status = $('#groupBuyCouponStatus').val();
			return d;
		}
	},
	language:DataTableConfig.i18n,
	"searching": true,
	columns:[
		DataTableConfig.data_select_checkbox,
		DataTableConfig.data_edit_control,
		DataTableConfig.data_input('dateCreatedString'),
		{ data: 'title',
			render: function ( data, type, row ) {
				var html = '<br>';
				var extra = '';
				html += '<span class="badge badge-default m-1">優惠卷總數量'+row.couponTotal+'</span>';
				html += '<span class="badge badge-default m-1">已使用優惠卷數量'+row.couponUsedTotal+'</span>';
				html += '<span class="badge badge-default m-1">剩餘優惠卷數量'+row.couponAvailableTotal+'</span>';
				if (row.availableQuota == -1) {
					extra += '<span class="badge badge-info m-1">無限使用</span>';
				}
				if (row.status == 'DISABLED')
					extra += '<span class="badge badge-danger">停用中</span>';
				if (extra.length) {
					extra = '<br>' + extra;
				}
				html += extra;
				return data + html;
			}
		},
		{ data: 'category',
			render: function ( data, type, row ) {
				return renderOption(groupBuyCouponTable, row.category, 'category');
			}
		},
		{ data: 'null',
			render: function ( data, type, row ) {
				var html = '';

				html += '<button class="btn btn-default text-nowrap" data-action="generate">產生優惠卷</button>'

				html += '<button class="btn btn-default text-nowrap" data-action="view">查看優惠卷</button>'
				return html;
			}
		},
	],
	"order": [[ 2, "desc" ]],
	select: DataTableConfig.selectOptionsOS,
	keys: DataTableConfig.keysInlineTab,
	buttons: [

		{ extend: 'create', editor: groupBuyCouponEditor },
		{ extend: 'edit',	editor: groupBuyCouponEditor },
		{ extend: 'remove',	editor: groupBuyCouponEditor, className:'btn-danger' },
		DataTableConfig.actionButton({
				text:'啟用',
				confirm:'啟用',
				url:'{{baseUrl}}/ajax/GroupBuyCoupon/setActive',
			}),
		DataTableConfig.actionButton({
			text:'停用',
			confirm:'停用',
			url:'{{baseUrl}}/ajax/GroupBuyCoupon/setDisabled',
		}),

	],
	initComplete: function () {
		DataTableConfig.initFooterSearch(this, [3,4],[16,0]);
	},
} );

function format ( d ) {
	var id = d.groupBuyCouponId;
	return ''
		+ '<div class="card card-detail">'
		+ '<div class="card-body">'
		+ '<table class="table table-striped">'
		+ '<tr class="">'
		+ '<td>優惠卷總數量</td><td>已使用優惠卷數量</td><td>剩餘優惠卷數量</td>'
		+ '</tr>'
		+ '<tr><td>'+d.couponTotal+'</td>'+ '<td>'+d.couponUsedTotal+'</td>'+ '<td>'+d.couponAvailableTotal+'</td></tr>'
		+ '</table>'
		+ '</div>'
		+ '<div class="card-footer"><div class="btn-toolbar btn-group">'

		+ '<a class="btn btn-default" href="javascript: void(0)" data-toggle="modal" data-target="#myModal" onclick="openFormF(\'/backend/GroupBuyCoupon/generateCoupon.do\', \'groupBuyCouponId='+id+'\')">產生優惠卷</a>'

		+ '<a class="btn btn-default" href="/backend/Coupon/list.do?groupBuyCouponId='+id+'">查看優惠卷</a>'
		+ '</div></div>'
		+ '</div>'
		;
};

DataTableHelper.initEditorOnCallback(groupBuyCouponTable,groupBuyCouponEditor);
//DataTableHelper.injectInline(groupBuyCouponTable, groupBuyCouponEditor);
//DataTableHelper.inlineModePlugin(groupBuyCouponTable);
injectOpenEditor(groupBuyCouponTableName, groupBuyCouponEditor);
DataTableHelper.injectXhrForJsonDefault(groupBuyCouponTable, {
	salesRuleId:''
});

injectDetailsControl(groupBuyCouponTableName, groupBuyCouponTable, format);
var couponMeta = {
	MINIMUM_PRICE_MEET:{
		minimum:{
			label:'訂單滿(金)額'
		}
	},
	MINIMUM_PIECE_MEET:{
		minimum:{
			label:'訂單滿件數'
		}
	},

	DISCOUNT_FOR_EVERY_MINIMUM_PURCHASE:{
		minimum:{
			label:'訂單每滿(金)額'
		}
	},
	FREE_SHIPPING:{
		minimum:{
			label:'訂單滿(金)額'
		}
	},
	FREE_SHIPPING_X:{
		minimum:{
			label:'訂單滿(金)額'
		}
	},
	SALES_RULE:{
		minimum:{
			label:''
		}
	},
	POINT:{
		minimum:{
			label:''
		},
		discount:{
			label:'獲得點數'
		}
	},
	POINT_RANDOM:{
		minimum:{
			label:'獲得點數範圍（最少至）'
		},
		discount:{
			label:'獲得點數範圍（最多至）'
		}
	},
}
groupBuyCouponEditor
	.on( 'open', function (e,mode,action) {
		var isCreate = (action == 'create');

		if (isCreate) {
			DataTableHelper.showHideAllColumns(groupBuyCouponEditor, false);
			groupBuyCouponEditor.show('useTemplate');
			groupBuyCouponEditor.enable('category');
			groupBuyCouponEditor.enable('dollarOrPercentage');
			groupBuyCouponEditor.enable('discount');
			groupBuyCouponEditor.enable('minimum');
			groupBuyCouponEditor.enable('availableQuota');
			groupBuyCouponEditor.enable('combinable');
			groupBuyCouponEditor.enable('salesRuleId');
			//groupBuyCouponEditor.enable('couponSettings.customerOnly');
			//groupBuyCouponEditor.enable('couponSettings.redeemNumber');
			groupBuyCouponEditor.enable('couponSettings.maxDiscount');
		} else {
			DataTableHelper.showHideAllColumns(groupBuyCouponEditor, true);
			groupBuyCouponEditor.hide('useTemplate', true);
			groupBuyCouponEditor.hide('couponTemplateId', true);
			groupBuyCouponEditor.disable('category');
			//var d = groupBuyCouponTable.rows( { selected: true } ).data()[0];
			//if (d && d.couponTotal > 0) {
				groupBuyCouponEditor.disable('dollarOrPercentage');
				groupBuyCouponEditor.disable('discount');
				groupBuyCouponEditor.disable('minimum');
				groupBuyCouponEditor.disable('availableQuota');
				groupBuyCouponEditor.disable('combinable');
				//groupBuyCouponEditor.disable('salesRuleId');
				//groupBuyCouponEditor.disable('couponSettings.customerOnly');
				//groupBuyCouponEditor.disable('couponSettings.redeemNumber');
				groupBuyCouponEditor.disable('couponSettings.maxDiscount');
			//}
		}
	})
	.dependent('useTemplate', function(val, data, callback) {
		if (data.row) return {};
		var show = hide = [];
		if (val == '1') {
			hide = ['category', 'createTemplate'];
			show = ['couponTemplateId'];
		} else {
			//show = Object.keys(data.values);
			hide = ['useTemplate', 'couponTemplateId'];
			//show = show.filter(function(el) {return hide.indexOf(el) < 0});
			show = ['category'];
		}

		return {
			show:show,
			hide:hide,
		}
	})
	.dependent('couponTemplateId', function(val, data, callback) {
		if (val == '' && data.values.useTemplate) {
			var hide = [
				'title',
				'category',
				//'priority',
				'availableQuota',
				'dollarOrPercentage',
				'discount',
				'minimum',
				'applyToAllGroupBuy',
				'salesRuleId',
			];
			return {
				hide:hide
			};
		} else if (data.row) {
			// update
			return {
				hide:['couponTemplateId'],
			};
		} else if (val) {
			loadCouponTemplate(val, callback);
		} else {
			return {};
		}
	})
	.dependent('category', function(val, data, callback) {
		if (!data.values.couponTemplateId
				&& data.values.useTemplate == '1'
				&& !data.row
				) {
			return {};
		}
		var show = [
			'title',
			'category',
			//'priority',
			'availableQuota',
			'dollarOrPercentage',
			'discount',
			'minimum',
			'applyToAllGroupBuy',
			'salesRuleId',
			'couponSettings.customerOnly',
			'couponSettings.maxDiscount',
		];

		var hide = [
			'dollarOrPercentage',
			'discount',
			'minimum',
			'applyToAllGroupBuy',
			'salesRuleId',
		];

		switch (val) {
		case 'SALES_RULE':
			hide = hide.filter(function(el) {return el != 'salesRuleId'});
			break;
		case 'FREE_SHIPPING':
			hide = hide.filter(function(el) {return el != 'applyToAllGroupBuy' && el != 'minimum'});
			break;
		case 'FREE_SHIPPING_X':
			hide = hide.filter(function(el) {return el != 'applyToAllGroupBuy'});
			break;
		case 'POINT':
			hide = [
				'dollarOrPercentage',
				'minimum',
				'applyToAllGroupBuy',
				'salesRuleId',
				'couponSettings.maxDiscount',
			];
			break;
		case 'POINT_RANDOM':
			hide = [
				'dollarOrPercentage',
				'applyToAllGroupBuy',
				'salesRuleId',
				'couponSettings.maxDiscount',
			];
			break;
		default:
			hide = ['salesRuleId'];
			break;
		};

		show = show.filter(function(el) {return hide.indexOf(el) < 0});

		var descr = groupBuyCouponTable
			.ajax
			.json()
			.options['category'].filter(o=>o.value == val);
		if (descr.length) {
			this.field('category').fieldInfo(descr[0].descr)
		}

		if (!this.label) {
			this.label = {
				discount : this.field('discount').label(),
				minimum : this.field('minimum').label()
			};
		}

		var lbDiscount = this.label.discount;
		var lbMinimum = this.label.minimum;

		if (couponMeta[val].discount) {
			lbDiscount = couponMeta[val].discount.label;
		}

		if (couponMeta[val].minimum) {
			lbMinimum = couponMeta[val].minimum.label;
		}

		this.field('discount').label(lbDiscount);
		this.field('minimum').label(lbMinimum);

		return {
			show:show,
			hide:hide,
		};
	})
	.dependent('couponSettings.customerOnly', function(val, data, callback) {
		//if (data.row) return {};
		var show = hide = [];
		if (val == '1') {
			show = ['couponSettings.customerOnly','couponSettings.redeemNumber', 'couponSettings.royaltyProgramId[]'];
		} else {
			hide = ['couponSettings.redeemNumber', 'couponSettings.royaltyProgramId[]'];
		}

		return {
			show:show,
			hide:hide,
		}
	})
	.on( 'preSubmit', function ( e, data, action ) {
		if ( action == 'remove' ) return;
		var fields = [
			'title',
		];
		for (var i = 0; i < fields.length; i++) {
			var field = this.field(fields[i]);
			if (!field.val()) {
				field.error('必填欄位');
			}
		}
		if (this.inError()) return false;
	})

var showHideColumns = function() {
	v = $('#DTE_Field_category').val();

	if (v == 'SALES_RULE') {
		DataTableHelper.showHideAllColumns(groupBuyCouponEditor, true);
		groupBuyCouponEditor.hide('dollarOrPercentage');
		groupBuyCouponEditor.hide('discount');
		groupBuyCouponEditor.hide('minimum');
		groupBuyCouponEditor.hide('applyToAllGroupBuy');
		groupBuyCouponEditor.hide('couponSettings.maxDiscount');

		groupBuyCouponEditor.set('dollarOrPercentage','0');
		groupBuyCouponEditor.set('discount','0');
		groupBuyCouponEditor.set('minimum','0');
		groupBuyCouponEditor.set('applyToAllGroupBuy','');
		groupBuyCouponEditor.set('couponSettings.maxDiscount','');
	} else if (v == 'FREE_SHIPPING' || v == 'FREE_SHIPPING_X') {
		DataTableHelper.showHideAllColumns(groupBuyCouponEditor, true);
		groupBuyCouponEditor.hide('dollarOrPercentage');
		groupBuyCouponEditor.hide('discount');
		groupBuyCouponEditor.hide('minimum');
		groupBuyCouponEditor.hide('applyToAllGroupBuy');
		groupBuyCouponEditor.hide('salesRuleId');
		groupBuyCouponEditor.hide('couponSettings.maxDiscount');

		groupBuyCouponEditor.set('dollarOrPercentage','0');
		groupBuyCouponEditor.set('discount','0');
		groupBuyCouponEditor.set('minimum','0');
		groupBuyCouponEditor.set('applyToAllGroupBuy','');
		groupBuyCouponEditor.set('couponSettings.maxDiscount','');
	} else {
		groupBuyCouponEditor.show();
		groupBuyCouponEditor.hide('salesRuleId', false);
		groupBuyCouponEditor.set('salesRuleId','');
	}
	if (groupBuyCouponEditor.mode() == 'create') {

	} else {
		groupBuyCouponEditor.hide('couponTemplateId', false);
	}
}
var loadCouponTemplate = function(couponTemplateId, callback) {
	btnStartLoading($('.DTE_Form_Buttons button'));
	jQuery.get(
		'{{baseUrl}}/ajax/CouponTemplate/get.do',
		{
			'couponTemplateId':couponTemplateId
		},
		function(data) {
			data = data.data;
			// $('#DTE_Field_category').val(data.category);
			// $('#DTE_Field_dollarOrPercentage').val(data.dollarOrPercentage);
			// $('#DTE_Field_discount').val(data.discount);
			// $('#DTE_Field_minimum').val(data.minimum);
			// $('#DTE_Field_availableQuota').val(data.availableQuota);
			//$('#DTE_Field_priority').val(data.priority);
			btnStopLoading($('.DTE_Form_Buttons button'));
			//showHideColumns();
			if (!data.couponSettings) {
				data.couponSettings = {};
			}
			var json = {
				values:{
					'title':data.title,
					'category':data.category,
					'dollarOrPercentage':data.dollarOrPercentage,
					'discount':data.discount,
					'minimum':data.minimum,
					'availableQuota':data.availableQuota,
					'couponSettings.customerOnly':data.couponSettings.customerOnly,
					'couponSettings.redeemNumber':data.couponSettings.redeemNumber,
					'couponSettings.royaltyProgramId[]':data.couponSettings.royaltyProgramId,
					'couponSettings.maxDiscount':data.couponSettings.maxDiscount,
				},
			};
			callback(json);
		}
	).fail(function(data) {
		json = data.responseJSON;
		$('.DTE_Form_Error').html(json.error);
		btnStopLoading($('.DTE_Form_Buttons button'));
	});
}

$(groupBuyCouponTableName +' tbody').on('click', 'button', function () {
	var tr = $(this).closest('tr');
	var row = groupBuyCouponTable.row( tr );
	var id = row.data().groupBuyCouponId;
	var action = $(this).attr('data-action');
	if (action == null) return;

	switch (action) {
	case 'generate':
		openFormF('/backend/GroupBuyCoupon/wizardGenCoupon.do', 'groupBuyCouponId='+id);
		break;
	case 'view':
		window.open( '/backend/Coupon/list.do?groupBuyCouponId=' + id, '_blank');
		break;
	}
});

$('#groupBuy-coupon .filters').on('change', function() {
	groupBuyCouponTable.clear().ajax.reload();
});

	$('#groupBuyCouponStatus').on('change', function() {

	});
}
	} ); // end ready
</script>
