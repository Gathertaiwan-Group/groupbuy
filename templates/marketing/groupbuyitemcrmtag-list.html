<!--#head-->
{{> core/partials/dte-style.html}}
<script type="text/javascript" class="init">

	var groupBuyItemCrmTagTable;
	$(document).ready(function() {
		var groupBuyId = '{{groupBuyId}}';
		var tableName = '#groupBuyItemCrmTagTable';
		editor = new $.fn.dataTable.Editor( {
			ajax: {
				create: {
					type: 'POST',
					url:  '{{baseUrl}}/ajax/GroupBuyItemCrmTag/save.do?groupBuyId=' + groupBuyId
				},
				edit: {
					type: 'POST',
					url:  '{{baseUrl}}/ajax/GroupBuyItemCrmTag/update.do?groupBuyItemCrmTagId=_id_&groupBuyId=' + groupBuyId
				},
				remove: {
					type: 'POST',
					url:  '{{baseUrl}}/ajax/GroupBuyItemCrmTag/delete.do?groupBuyItemCrmTagId=_id_&groupBuyId=' + groupBuyId
				}
			},
			table: tableName,
			idSrc: 'groupBuyItemCrmTagId',
			fields: [
					DataTableConfig.field_input('標籤','tag'),
					//DataTableConfig.field_input('???Item.weight???','weight'),
			],
			//template: '#custom_rp_form',
			formOptions:DataTableConfig.formOptions,
			i18n:DataTableConfig.i18n,
		} );

		var table = $(tableName).DataTable( {
			dom: 'lBrtip',
			serverSide:true,
			processing:true,
			scrollX:true,
			"lengthMenu": [10, 25, 50, 100, 250],
			ajax: {
				url:'{{baseUrl}}/ajax/GroupBuyItemCrmTag/list.do?groupBuyId=' + groupBuyId,
				type: "POST",
			},
			language:DataTableConfig.i18n,
			columns:[
				DataTableConfig.data_select_checkbox,
				DataTableConfig.data_input('tag', true),
				//DataTableConfig.data_input('weight'),
				{
					sortable:false,
					render: function ( data, type, row ) {
						var html = ''
							+ '<button class="btn btn-default text-nowrap mt-0" data-action="showItems">商品</button>'
							;
						return html;
					}
				}
			],
			keys: DataTableConfig.keysInlineTab,
			"order": [[ 1, "asc" ]],
			select: DataTableConfig.selectOptionsOS,
			buttons: [
				{ extend: 'create', editor: editor },
				{ extend: 'edit',   editor: editor },
				{ extend: 'remove', editor: editor, className:'btn-danger' },
			],
			initComplete: function () {
				DataTableConfig.initFooterSearch(this, [],[]);
			},
			drawCallback: function (settings) {
				$(".dataTables_scrollBody").floatingScroll();
			}
		} );

		DataTableHelper.initEditorOnCallback(table,editor);
		DataTableHelper.inlineModePlugin(table);
		DataTableHelper.injectInline(table,editor);
		groupBuyItemCrmTagTable = table;

		$(tableName +' tbody').on('click', 'button', function (e) {
			var td = $(this).closest('td');
			var tr = $(this).closest('tr');
			var row = table.row( tr );
			var data = row.data();
			var action = $(this).attr('data-action');
			if (action == null) return;
			var $btn = $(this);
			$btn.addClass('disabled');
			setTimeout(function () {
				$btn.removeClass('disabled');
			}, 1000);
			switch (action) {
			case 'showItems':
				showItems(data.groupBuyItemCrmTagId);
				break;
			}
		});

		var showItems = function(groupBuyItemCrmTagId) {
			var href = '/backend/ItemCrmTag/list?groupBuyId='+groupBuyId+'&groupBuyItemCrmTagId=' + groupBuyItemCrmTagId;
			window.open(href, '_blank');
		}
	} ); // end ready
</script>

<div class="card-header">商品銷售標籤</div>

				<th>標籤</th>
				<th></th>
			</tr>
		</thead>
		<tfoot>
			<tr>
				<th></th>

				<th></th>

</div>
