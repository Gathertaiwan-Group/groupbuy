{{!-- 團購關鍵字標籤 /backend/GroupBuySysTagRef/list：原站 spec/html/groupbuysystagref-list.html；缺段已依原站頁面原始碼補齊 --}}
<!--#head-->
{{> core/partials/dte-style.html}}
<script type="text/javascript" class="init">

	$(document).ready(function () {
		var tableName = '#rpTable';

		// 建立 DataTables Editor 實例
		var editor = new $.fn.dataTable.Editor({
			ajax: {
				create: {
					type: 'POST',
					url: '{{baseUrl}}/ajax/GroupBuySysTagRef/save.do'
				},
				edit: {
					type: 'POST',
					url: '{{baseUrl}}/ajax/GroupBuySysTagRef/update.do?groupBuySysTagRefId=_id_'
				},
				remove: {
					type: 'POST',
					url: '{{baseUrl}}/ajax/GroupBuySysTagRef/delete.do?groupBuySysTagRefId=_id_'
				}
			},
			table: tableName,
			idSrc: 'groupBuySysTagRefId',
			fields: [
				DataTableConfig.field_input('???GroupBuySysTag.tag???', 'tag')
			],
			formOptions: DataTableConfig.formOptions,
			i18n: DataTableConfig.i18n,
		});

		// 初始化 DataTables
		var table = $(tableName).DataTable({
			dom: 'lBrtip',
			serverSide: true,
			processing: true,
			scrollX: true,
			"lengthMenu": [10, 25, 50, 100, 250],
			ajax: {
				url: '{{baseUrl}}/ajax/GroupBuySysTagRef/list.do',
				type: "POST",
			},
			language: DataTableConfig.i18n,
			columns: [
				DataTableConfig.data_select_checkbox,
				DataTableConfig.data_input('tag'),
				{
					data: "groupBuyCount",
					render: function (data, type, row, meta) {
						if (type === 'display') {
							return '<a href="javascript:void(0)" class="view-associated-gbs text-primary" data-tag="' + row.tag + '"><i class="fa fa-link mr-1"></i>' + data + ' 筆表單</a>';
						}
						return data;
					}
				},
			],
			keys: DataTableConfig.keysInlineTab,
			"order": [[1, "asc"]],
			select: DataTableConfig.selectOptionsOS,
			buttons: [
				{ extend: 'create', editor: editor },
				{ extend: 'edit', editor: editor },
				{ extend: 'remove', editor: editor, className: 'btn-danger' },
				{
					text: '批次標注標籤',
					className: 'btn-info batch-tagging-btn',
					action: function (e, dt, node, config) {
						showBatchTaggingModal();
					}
				}
			],
			initComplete: function () {
				DataTableConfig.initFooterSearch(this, [1], [16]);
			},
			drawCallback: function (settings) {
				$(".dataTables_scrollBody").floatingScroll();
			}
		});

		// 點擊關聯按鈕事件
		$(tableName).on('click', '.view-associated-gbs', function (e) {
			e.preventDefault();
			var tag = $(this).data('tag');
			$('#modalTagName').text(tag);

			// 呼叫 API 取得關聯的團購列表
			$.ajax({
				url: '{{baseUrl}}/ajax/GroupBuySysTagRef/getAssociatedGroupBuys.do',
				type: 'POST',
				data: { tag: tag },
				success: function (res) {
					var tbody = $('#associatedGroupBuysList');
					tbody.empty();
					if (res && res.data && res.data.length > 0) {
						res.data.forEach(function (item) {
							var tr = $('<tr>');
							tr.append($('<td>').text(item.title));
							var removeBtn = $('<button>').addClass('btn btn-sm btn-outline-danger remove-tag-assoc')
								.attr('data-tag', tag)
								.attr('data-gbid', item.gbId)
								.text('解除關聯');
							tr.append($('<td class="text-center">').append(removeBtn));
							tbody.append(tr);
						});
					} else {
						tbody.append('<tr><td colspan="2" class="text-center text-muted">無關聯團購</td></tr>');
					}
					$('#associatedGroupBuysModal').modal('show');
				},
				error: function () {
					alert('無法讀取關聯清單，請稍後再試。');
				}
			});
		});

		// 點擊解除關聯事件
		$('#associatedGroupBuysList').on('click', '.remove-tag-assoc', function () {
			var btn = $(this);
			var tag = btn.data('tag');
			var gbId = btn.data('gbid');
			if (confirm('確定要解除此標籤與該團購之關聯嗎？')) {
				$.ajax({
					url: '{{baseUrl}}/ajax/GroupBuySysTagRef/removeTag.do',
					type: 'POST',
					data: { tag: tag, groupBuyId: gbId },
					success: function (res) {
						if (res.code === 200) {
							btn.closest('tr').remove();
							table.ajax.reload(null, false); // Reload Table in background
						} else {
							alert('解除失敗：' + (res.message || '未知錯誤'));
						}
					},
					error: function () {
						alert('系統錯誤，無法解除關聯。');
					}
				});
			}
		});

		var batchTagify;
		var batchKeywordTagify;

		function initBatchTagify() {
			var input = document.getElementById('batchTagName');
			if (input && typeof Tagify !== 'undefined') {
				batchTagify = new Tagify(input, {
					dropdown: {
						enabled: 0,
						closeOnSelect: false
					}
				});
			}

			var keywordInput = document.getElementById('batchKeyword');
			if (keywordInput && typeof Tagify !== 'undefined') {
				batchKeywordTagify = new Tagify(keywordInput, {
					dropdown: {
						enabled: 0,
						closeOnSelect: false
					}
				});
			}
		}

		initBatchTagify();

		function showBatchTaggingModal() {
			if (batchTagify) {
				batchTagify.removeAllTags();

				var selectedRows = table.rows({ selected: true }).data();
				var tagsToAdd = [];
				if (selectedRows && selectedRows.length > 0) {
					for (var i = 0; i < selectedRows.length; i++) {
						if (selectedRows[i].tag) {
							tagsToAdd.push(selectedRows[i].tag);
						}
					}
				}

				if (tagsToAdd.length > 0) {
					batchTagify.addTags(tagsToAdd);
				}
			} else {
				$('#batchTagName').val('');
			}

			if (batchKeywordTagify) {
				batchKeywordTagify.removeAllTags();
			} else {
				$('#batchKeyword').val('');
			}
			$('#batchPreviewArea').hide();
			$('#batchPreviewList').empty();
			$('#btnConfirmBatchAdd').prop('disabled', true);
			$('#batchTaggingModal').modal('show');
		}

		$('#btnPreviewBatch').on('click', function () {
			var keywordsJson = $('#batchKeyword').val();
			var keywordsToSend = [];
			if (keywordsJson) {
				try {
					var parsedKeywords = JSON.parse(keywordsJson);
					keywordsToSend = parsedKeywords.map(function(t) { return t.value; });
				} catch (e) {
					keywordsToSend = keywordsJson.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
				}
			}

			if (keywordsToSend.length === 0) {
				alert('請輸入關鍵字');
				return;
			}

			$.ajax({
				url: '{{baseUrl}}/ajax/GroupBuySysTagRef/previewBatchTagging.do',
				type: 'POST',
				data: { keyword: keywordsToSend.join(',') },
				success: function (res) {
					if (res && res.data) {
						var totalCount = res.data.totalCount;
						var list = res.data.recentGroupBuys;

						$('#batchPreviewCount').text(totalCount);
						var $ul = $('#batchPreviewList');
						$ul.empty();
						batchGroupBuyIds = [];

						if (list && list.length > 0) {
							list.forEach(function (item) {
								$ul.append('<li class="list-group-item">' + item.title + '</li>');
								batchGroupBuyIds.push(item.groupBuyId);
							});
							if (totalCount > list.length) {
								$ul.append('<li class="list-group-item text-muted">...（僅列出前 ' + list.length + ' 筆）</li>');
							}
							$('#btnConfirmBatchAdd').prop('disabled', false);
						} else {
							$ul.append('<li class="list-group-item text-danger">找不到任何符合關鍵字的近期團購表單</li>');
							$('#btnConfirmBatchAdd').prop('disabled', true);
						}
						$('#batchPreviewArea').show();
					}
				},
				error: function () {
					alert('預覽失敗，請稍後再試。');
				}
			});
		});

		$('#btnConfirmBatchAdd').on('click', function () {
			var tagsJson = $('#batchTagName').val();
			var keywordsJson = $('#batchKeyword').val();

			var tagsToSend = [];
			if (tagsJson) {
				try {
					var parsedTags = JSON.parse(tagsJson);
					tagsToSend = parsedTags.map(function(t) { return t.value; });
				} catch (e) {
					tagsToSend = tagsJson.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
				}
			}

			var keywordsToSend = [];
			if (keywordsJson) {
				try {
					var parsedKeywords = JSON.parse(keywordsJson);
					keywordsToSend = parsedKeywords.map(function(t) { return t.value; });
				} catch (e) {
					keywordsToSend = keywordsJson.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
				}
			}

			if (tagsToSend.length === 0) {
				alert('請輸入標籤名稱');
				return;
			}
			if (keywordsToSend.length === 0) {
				alert('請輸入關鍵字');
				return;
			}

			if (confirm('確定要將標籤對「' + tagsToSend.join(',') + '」批次加入搜尋結果中的所有近期團購表單嗎？')) {
				$.ajax({
					url: '{{baseUrl}}/ajax/GroupBuySysTagRef/addBatchTagging.do',
					type: 'POST',
					data: {
						tag: tagsToSend.join(','),
						keyword: keywordsToSend.join(',')
					},
					success: function (res) {
						if (res.data !== undefined) {
							if (res.data > 0) {
								alert('已成功新增 ' + (res.data) + ' 筆標籤關聯');
								$('#batchTaggingModal').modal('hide');
								table.ajax.reload();
							} else {
								alert('新增失敗：0筆新增，沒有符合的結果');
							}
						} else {
							alert('新增失敗：' + (res.error || '未知錯誤'));
						}
					},
					error: function () {
						alert('系統錯誤，無法執行批次新增。');
					}
				});
			}
		});

		DataTableHelper.initEditorOnCallback(table, editor);
		// 啟用 inline edit 機制 (如有需要)
		DataTableHelper.inlineModePlugin(table);
		DataTableHelper.injectInline(table, editor);
		DataTableHelper.initEditConfirmation(editor);

	}); // end ready
</script>
<!--#body--><div class="container-fluid ">
	<div class="card mt-4">
		<div class="card-header">團購關鍵字標籤</div>
		<div class="card-body">
			<div class="blue-grey lighten-5 small p-2">
				<p>＊此處可瀏覽與管理該團購帳號下曾經建立過的所有「系統標籤」</p>
				<p>＊若某個標籤已不再被任何團購表單使用，將會由系統自動進行回收刪除</p>
			</div>
		</div>
		<div class="card-body">
			<table id="rpTable" class="table table-striped display nowrap" width="100%">
				<thead>
					<tr>
						<th></th>
						<th>標籤</th>
						<th>關聯表單數量</th>
					</tr>
				</thead>
				<tfoot>
					<tr>
						<th></th>
						<th>標籤</th>
						<th>關聯表單數量</th>
					</tr>
				</tfoot>
			</table>
		</div>
	</div>

	<!-- 關聯群組模態框 -->
	<div class="modal fade" id="associatedGroupBuysModal" tabindex="-1" role="dialog" aria-hidden="true">
		<div class="modal-dialog modal-lg" role="document">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">標籤：「<span id="modalTagName"></span>」關聯之團購</h5>
					<button type="button" class="close" data-dismiss="modal" aria-label="Close">
						<span aria-hidden="true">&times;</span>
					</button>
				</div>
				<div class="modal-body">
					<table class="table table-bordered table-sm">
						<thead>
							<tr>
								<th>團購名稱</th>
								<th width="100px" class="text-center">操作</th>
							</tr>
						</thead>
						<tbody id="associatedGroupBuysList">
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</div>

	<!-- 批次標注標籤模態框 -->
	<div class="modal fade" id="batchTaggingModal" tabindex="-1" role="dialog" aria-hidden="true">
		<div class="modal-dialog modal-md" role="document">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">批次標注標籤</h5>
					<button type="button" class="close" data-dismiss="modal" aria-label="Close">
						<span aria-hidden="true">&times;</span>
					</button>
				</div>
				<div class="modal-body">
					<div class="form-group">
						<label for="batchTagName">標籤名稱</label>
						<input type="text" id="batchTagName" class="form-control" placeholder="請輸入標籤名稱">
					</div>
					<div class="form-group">
						<label for="batchKeyword">團購關鍵字 (可多關鍵字，查詢結團時間最近90天內團購標題包含所有關鍵字的表單)</label>
						<div class="input-group">
							<input type="text" id="batchKeyword" class="form-control" placeholder="請輸入關鍵字">
							<div class="input-group-append">
								<button class="btn btn-outline-secondary" type="button" id="btnPreviewBatch">預覽</button>
							</div>
						</div>
					</div>
					<div id="batchPreviewArea" style="display:none;" class="mt-3">
						<div class="alert alert-info">
							找到 <span id="batchPreviewCount" class="font-weight-bold">0</span> 筆符合的團購表單，以下為部分預覽資訊
						</div>
						<ul id="batchPreviewList" class="list-group list-group-flush small" style="max-height: 200px; overflow-y: auto;">
						</ul>
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
					<button type="button" class="btn btn-primary" id="btnConfirmBatchAdd" disabled>確認新增</button>
				</div>
			</div>
		</div>
	</div>
</div>
