<!--#head-->
<style>
.btn-action {padding:2px !important;margin:0px 2px !important;white-space:nowrap;}
</style>
<!--#body--><div class="container-fluid ">
        <!-- Loading State -->
        <div id="loadingState" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2">載入商品資訊中...</p>
        </div>

        <!-- No Items State -->
        <div id="noItemsState" class="not-found-container" style="display: none;">
            <div class="alert alert-warning mb-0">
                <h5><i class="bi bi-info-circle-fill"></i> 無預購商品資訊</h5>
                <p class="mb-0">此團購目前尚無可轉現貨的預購商品。</p>
            </div>
        </div>

        <!-- Error State -->
        <div id="errorState" class="not-found-container" style="display: none;">
            <div class="alert alert-danger mb-2">
                <h5><i class="bi bi-exclamation-triangle-fill"></i> 發生錯誤</h5>
                <p id="errorMessage" class="mb-0">無法取得商品資訊，請稍後再試或聯絡系統管理員。</p>
                <div class="mt-3">
                    <button id="returnToListButton" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left"></i> 重新載入
                    </button>
                </div>
            </div>
        </div>

        <!-- Success Message -->
        <div id="successMessage" class="alert alert-success mb-4" style="display: none;">
            <h5><i class="bi bi-check-circle-fill"></i> 操作成功</h5>
            <p id="successMessageText" class="mb-0"></p>
        </div>

        <!-- Items Container -->
        <div id="itemsContainer" class="order-items-container" style="display: none;">
            <div class="card mb-4">
                <div class="card-header bg-light">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">預購商品列表</h5>
                        <button id="refreshButton" class="btn btn-outline-secondary btn-sm">
                            <i class="fas fa-sync-alt"></i> 重新整理
                        </button>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>商品名稱</th>
                                    <th width="100">預購數量</th>
                                    <th width="100">庫存數量</th>
                                    <th width="100">暫存數量</th>
                                    <th width="140">狀態</th>
                                    <th width="180">操作</th>
                                </tr>
                            </thead>
                            <tbody id="itemsList">
                                <!-- Items will be inserted here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Single Item Order Details Container -->
        <div id="itemDetailsContainer" style="display: none;">
            <div class="card mb-4">
			<div class="card-header bg-light">
			    <div class="d-flex justify-content-between align-items-center">
			        <h5 class="mb-0" id="itemDetailsTitle">商品訂單明細</h5>
			        <div class="d-flex align-items-center">
			            <div class="form-inline mr-2">
			                <label class="mr-2">訂單排序依據:</label>
			                <select class="form-control form-control-sm mr-2" id="orderDetailsSortSelect">
			                    <option value="DATE_PAID">付款日期</option>
			                    <option value="ORDER_ITEM_TOTAL">訂單商品數量</option>
			                    <option value="ORDER_AMOUNT">訂單金額</option>
			                </select>
			                <button id="applyFilterButton" class="btn btn-sm btn-outline-primary">
			                    <i class="fas fa-filter"></i> 套用篩選
			                </button>
			            </div>
			            <button id="bulkConvertButton" class="btn btn-sm btn-outline-success">
			                <i class="fas fa-exchange-alt"></i> 全部轉換
			            </button>
			            <button id="backToItemsButton" class="btn btn-sm btn-outline-secondary ml-2">
			                <i class="fas fa-arrow-left"></i> 返回商品列表
			            </button>
			        </div>
			    </div>
			</div>
                <div class="card-body p-0"><p class="text-danger small">＊＊＊按下轉換即自動執行，不會再提醒確認。</p></div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th width="140">訂單編號</th>
                                    <th>付款日期</th>
                                    <th>訂單金額</th>
                                    <th width="100">數量</th>
                                    <th width="140">操作</th>
                                </tr>
                            </thead>
                            <tbody id="orderItemsList">
                                <!-- Order items will be inserted here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

		<!-- Rename existing modal to convertOrderItemModal -->
		<div class="modal fade" id="convertOrderItemModal" tabindex="-1" role="dialog" aria-labelledby="convertOrderItemModalLabel" aria-hidden="true">
		    <div class="modal-dialog" role="document">
		        <div class="modal-content">
		            <div class="modal-header">
		                <h5 class="modal-title" id="convertOrderItemModalLabel">確認轉換</h5>
		                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
		                    <span aria-hidden="true">&times;</span>
		                </button>
		            </div>
		            <div class="modal-body">
		                <p id="convertOrderItemMessage">您確定要將此預購商品轉換為現貨嗎？</p>
		            </div>
		            <div class="modal-footer">
		                <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
		                <button type="button" class="btn btn-primary" id="confirmConvertOrderItemButton">確認轉換</button>
		            </div>
		        </div>
		    </div>
		</div>

		<!-- Add new convertItemModal with additional fields -->
		<div class="modal fade" id="convertItemModal" tabindex="-1" role="dialog" aria-labelledby="convertItemModalLabel" aria-hidden="true">
		    <div class="modal-dialog" role="document">
		        <div class="modal-content">
		            <div class="modal-header">
		                <h5 class="modal-title" id="convertItemModalLabel">商品轉換設定</h5>
		                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
		                    <span aria-hidden="true">&times;</span>
		                </button>
		            </div>
		            <div class="modal-body">
		                <p id="convertItemTitle"></p>
		                <div class="form-group">
		                    <label for="convertAmount">轉換數量:</label>
		                    <input type="number" class="form-control" id="convertAmount" min="1">
		                    <small id="convertAmountHelp" class="form-text text-muted">可轉換數量上限: <span id="maxConvertAmount">0</span></small>
		                </div>
		                <div class="form-group">
		                    <label for="orderBySelect">訂單優先順序依據:</label>
		                    <select class="form-control" id="orderBySelect">
		                        <option value="DATE_PAID">付款日期</option>
		                        <option value="ORDER_ITEM_TOTAL">訂單商品數量</option>
			                    <option value="ORDER_AMOUNT">訂單金額</option>
		                    </select>
		                </div>
		            </div>
		            <div class="modal-footer">
		                <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
		                <button type="button" class="btn btn-primary" id="confirmConvertItemButton">確認轉換</button>
		            </div>
		        </div>
		    </div>
		</div>

        <!-- Add Stock Modal -->
        <div class="modal fade" id="addStockModal" tabindex="-1" role="dialog" aria-labelledby="addStockModalLabel" aria-hidden="true">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="addStockModalLabel">增加庫存</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <p id="addStockItemTitle"></p>
                        <div class="form-group">
                            <label for="stockAmount">請輸入要增加的庫存數量:</label>
                            <input type="number" class="form-control" id="stockAmount" value="1" min="1">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                        <button type="button" class="btn btn-primary" id="confirmAddStockButton">確認增加</button>
                    </div>
                </div>
            </div>
        </div>

</div>
<!--#foot-->
<script src="/scripts/preorderToStock.js"></script>
        <script>
        $(document).ready(function() {
            // 從URL獲取團購ID
            const groupBuyId = {{json groupBuyId}}

            if (!groupBuyId) {
                showError('缺少團購ID參數');
                return;
            }

            // 顯示團購ID
            $('#groupBuyIdDisplay').text('團購ID: ' + groupBuyId);

            // 初始化預購轉現貨管理器
            PreorderToStockManager.init({
                baseUrl: GBF.baseUrl,
                groupBuyId: groupBuyId
            });
        });
    </script>
