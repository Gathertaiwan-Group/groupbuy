<style>
form[name=SalesOrderForm] label[for] {
    height:100% !important;
    margin-bottom:0;
    }
</style>
	<div class="modal-header">
		<h5>拆單<span id="rr_uuid"></span>&raquo;</h5>
		<button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
	</div>
	<div class="modal-body">
<form name="SalesOrderForm" method="post" action="{{baseUrl}}/ajax/SalesOrder/moveOrderItems.do" class="form-horizontal" id="MoveOrderItemsForm"><input type="hidden" name="salesOrderId" value="{{salesOrderId}}" id="salesOrderId"><div class="card">
	<div class="card-header">
	<div class="row">
	<div class="col-9">訂單商品</div>
	<div class="col-3">數量</div>
	</div>
	</div>
	<div class="card-body">
	<div id="order_item_container">
	<span class="glyphicon glyphicon-refresh glyphicon-refresh-animate"></span>
	</div>
	</div>
	</div>

	<div class="card mt-4">
		<div class="card-header">
		<p>勾選所要拆單的商品</p>
		<p>數量預設為該商品所有數量，可調整數量部分搬移</p>
		<p>請輸入所要轉換至的訂單號碼(保持空白將拆分至新訂單)</p>
		</div>
		<div class="card-body toUuid-section">
			<div class="input-group">
			<input type="text" name="toUuid" class="form-control" placeholder="訂單編號">
			<div class="input-group-append">
				<a href="javascript: void(0)" id="btnVerifySalesOrder" class="input-group-text md-addon" onclick="btnVerifySalesOrder()">檢查訂單</a>
			</div>
			</div>
			<div class="help" id="salesOrderInfo"></div>
			<div class="help text-danger" id="btnVerifySalesOrder_help"></div>
		</div>
		<div class="card-body">
		<input type="checkbox" name="status" value="INQUIRED_RETURN" id="status" class="form-check-input">
		<label for="status" class="h-100">退貨申請中<br><span class="small">會將新訂單階段設為「退貨中」，狀態設為「退貨申請中」<br>
		待收到貨品檢核完整後，再將新訂單取消釋放庫存</span></label>
		</div>
		<div class="card-body">
		<input type="checkbox" name="uniqueAddress" value="1" id="uniqueAddress" class="form-check-input">
		<label for="uniqueAddress" class="h-100">訂單地址不共用<br><span class="small">共用代表當修改其中一張訂單地址，另一張訂單會自動更新地址</span></label>
		</div>
	</div>
</form></div> <!-- modal-body -->

	<div class="progress">
		<div class="progress-bar" role="progressbar"></div>
	</div>
	<div class="modal-footer">
		<button class="btn btn-default" data-dismiss="modal">關閉</button>
		<input id="submitButton" name="submitButton" type="submit" class="btn btn-primary" value="送出" />
	</div>

<script>

var addOrderItemsToForm = function(items) {
	for (idx in items) {
		addOrderItemToForm(items[idx]);
	}
}

var addOrderItemToForm = function(item, i) {
	var namePrefix = 'orderItems['+i+'].';
	var tag = item.backOrder ? ' <span class="badge badge-success">預購</span>' : '';
	var html = '<div class="row"><div class="col-9">'
			+ '<input type="checkbox" class="form-check-input" name="'+namePrefix+'orderItemId" value="'+item.orderItemId+'" id="orderItemId'+item.orderItemId+'">'
			+ '<label for="orderItemId'+item.orderItemId+'">'+tag+ item.title +'</label>'
			+ '</div>'
			+ '<div class="col-3"><input type="text" class="form-control form-control-sm" name="'+namePrefix+'total" value="'+item.total+'"></div>'
			+ '<div class="col-12 small help text-danger"></div>'
			+ '<hr class="w-100"></div>'
			;

	$('#order_item_container').append(html);
}

var btnVerifySalesOrder = function() {
	var $btn = $('#btnVerifySalesOrder');
	var toUuid = $('input[name=toUuid]').val();
	btnStartLoading($btn);
	$('#btnVerifySalesOrder_help').html('');
	jQuery.get(
			'{{baseUrl}}/ajax/SalesOrder/get.do',
			{
				'uuid':toUuid,
			},
			function(data) {
				so = data.data;
				$('#salesOrderInfo').html(so.uuid + ":" + so.customerFirstname);
				$('#salesOrderInfo').addClass('pt-4');
				btnStopLoading($btn);
			}
			).fail(function(data) {
				json = data.responseJSON;
				btnStopLoading($btn);
				$('#btnVerifySalesOrder_help').html(json.error);
			});
}

var fullReload = function(so) {
	$('#order_item_container').html('');
	$('#rr_uuid').html(so.uuid);
	so.sortedOrderItems.forEach(function(c,i) {
		addOrderItemToForm(c,i);
		});
}

var success = function(json) {
	modalShowSuccess($('#myModal'), json.error);
	loadData({{salesOrderId}});
	table.ajax.reload( null, false );
}

var loadData = function(salesOrderId) {
	jQuery.get(
			'{{baseUrl}}/ajax/SalesOrder/get.do',
			{
				'salesOrderId':salesOrderId
			},
			function(data) {
				fullReload(data.data);
			}
			).fail(function(data) {
				json = data.responseJSON;
				modalShowDanger($('#myModal'), json.error);
			});
}

$(document).ready(function() {

	$ ('#MoveOrderItemsForm').on('keydown', function(e) {
		if (e.keyCode == 13) {
			e.preventDefault();
			return false;
		}
	});

	loadData({{salesOrderId}});
	initAjaxForm('MoveOrderItemsForm', success);
	$('.modal-footer .btn[type=submit]').on('click', function() {
		$('#MoveOrderItemsForm').submit();
	});
});

$('#status').on('change', function() {
	var $this = $(this);
	if ($this.is(':checked')) {
		$('input[name=toUuid]').val('');
		$('.toUuid-section').hide();
	} else {
		$('.toUuid-section').show();
	}
});
</script>
