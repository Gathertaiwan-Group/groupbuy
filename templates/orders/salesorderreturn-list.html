							DataTableConfig.data_input('firstname'),
							DataTableConfig.data_input('telephone'),
							DataTableConfig.data_select('relation'),
							DataTableConfig.data_select('state'),

							{
								data: null,

								orderable: false,
								render: function (data, type, row) {
									var html = '';
									//	html += '<button class="btn btn-default text-nowrap" data-action="item">商品</button>';
									if (row.state == 'CANCELED' || row.state == 'COMPLETE') {

									} else if (row.relation == 'RETURN') {

											case 'INQUIRED_RETURN':

												html += '<button class="btn btn-warning text-nowrap" data-action="returned_nosale">完成退貨(不可銷售)</button>'
												html += '<button class="btn btn-danger text-nowrap" data-action="cancel_return">取消退貨</button>'
												break;
											case 'PICKUP_RETURN':
												html += '<button class="btn btn-default text-nowrap" data-action="verifyReturn">退貨檢核中</button>'
												html += '<button class="btn btn-warning text-nowrap" data-action="returned">完成退貨(可銷售)</button>'
												html += '<button class="btn btn-warning text-nowrap" data-action="returned_nosale">完成退貨(不可銷售)</button>'
												html += '<button class="btn btn-danger text-nowrap" data-action="cancel_return">取消退貨</button>'
												break;
											case 'VERIFY_RETURN':
												html += '<button class="btn btn-warning text-nowrap" data-action="returned">完成退貨(可銷售)</button>'
												html += '<button class="btn btn-warning text-nowrap" data-action="returned_nosale">完成退貨(不可銷售)</button>'
										}
									} else if (row.relation == 'REPLACE') {
										if (row.status != 'REPLACED') {
											html += '<button class="btn btn-warning text-nowrap" data-action="replaced">完成換貨</button>'
											html += '<button class="btn btn-danger text-nowrap" data-action="cancel_replace">取消換貨</button>'
										}
									} else if (row.relation == 'RESHIPMENT') {
										if (row.status != ' RESHIPMENTED') {
											html += '<button class="btn btn-warning text-nowrap" data-action="reshipmented">完成補寄</button>'
										}
									}

								}
							},
						],
						keys: DataTableConfig.keysInlineTab,
						"order": [[1, "desc"]],
						select: DataTableConfig.selectOptionsOS,
						buttons: [
							//	{ extend: 'create', editor: editor },
							//	{ extend: 'edit', editor: editor },
							//	{ extend: 'remove', editor: editor, className:'btn-danger' },
							DataTableConfig.actionButton({
								text: '完成退貨(可銷售)',
								confirm: '完成退貨將會將主訂單階段改為「已完成」，退換貨訂單狀態改「退貨完成」，階段改「已完成」，確定要執行嗎？',

							DataTableConfig.actionButton({
								text: '完成退貨(不可銷售)',
								confirm: '完成退貨將會將主訂單階段改為「已完成」，退換貨訂單狀態改「退貨完成」，階段改「已完成」，確定要執行嗎？',
								url: '/ajax/SalesOrderReturn/action?action=returned_nosale',
							}),

								{

								text: '匯出報表',
								action: function ( e, dt, node, config ) {

								text: '匯出貨運清單',

									shippingExport.show();

					//DataTableHelper.initEditorOnCallback(table,editor);

					$(tableName + ' tbody').on('click', 'button', function (e) {
						e.stopPropagation();

						var row = table.row(tr);
						var id = row.data().salesOrderId;
						var action = $(this).attr('data-action');
						if (action == null) return;

						var msg = '';

						switch (action) {
							case 'pickupReturn':
								msg = '訂單狀態將改為「退貨取件中」，確定要執行嗎？'
								break;
							case 'verifyReturn':
								msg = '訂單狀態將改為「退貨檢核中」，確定要執行嗎？'
								break;
							case 'returned':
							case 'returned_nosale':
								msg = '完成退貨將會將主訂單階段改為「已完成」，退換貨訂單狀態改「退貨完成」，階段改「已完成」，確定要執行嗎？';
								break;
							case 'replaced':
								msg = '完成換貨將會將主訂單階段改為「已完成」，退換貨訂單狀態改「換貨完成」，階段改「已完成」，換貨商品將移回主訂單，確定要執行嗎？';
								break;
							case 'reshipmented':
								msg = '完成補寄將會將主訂單階段改為「已完成」，補寄貨訂單狀態改「補寄完成」，階段改「已完成」，補寄商品將移回主訂單，確定要執行嗎？';
								break;
							case 'cancel_return':
							case 'cancel_replace':

								break;
						};

				var erpTitles = [
		'ERP報表1',
'ERP報表2',
'ERP報表3',
'ERP報表4',
'ERP報表5',
'ERP報表6',

				];

				var appendExtra = function (d) {
					d.hideDone = $('#hideDone').prop("checked");
					d.days = $('#days').val();
					d.dateCreatedBegin = $('#dateCreatedBegin').val();
					d.dateCreatedEnd = $('#dateCreatedEnd').val();
					d.relation = $('#relation').val();
					d.status = $('#status').val();
					d.state = $('#state').val();
					return d;
				}

				var fileDownload = function (action, query) {
					var table = salesOrderReturnTable;
					var $form = $('#queryForm');
					var dd = joinIds('salesOrderId', table);
					$form.find('[name=salesOrderIds]').val(dd.substring('salesOrderId='.length));
					$form.find('[name=batchAction]').val(action);
					$form.find('[name=query]').val(query);

					var $btn = $('.DTE_Action_Create .btn.btn-primary');
					btnStartLoading($btn);

					const form = document.getElementById('queryForm');
					const myFormData = new FormData(form);
					const formDataObj = Object.fromEntries(myFormData.entries());
					// data string
					//const data = JSON.stringify(Object.fromEntries(myFormData));

					$.fileDownload($form.prop('action'), {
						httpMethod: "POST",
						data: formDataObj
					})
					.done(function () {
						btnStopLoading($btn);
						if (action == 'EXPORT_SHIPPING_CSV')
							table.clear().ajax.reload();
					})
					.fail(function () {
						alert('下載失敗');
						btnStopLoading($btn);
					});
				}

				var exportFile = {
					show: function () {
						var table = salesOrderReturnTable;
						var count = table.rows({ selected: true }).count();
						if (count > 0) {
							this.totalRecords = count;
						} else {
							this.totalRecords = table.page.info().recordsDisplay;
						}
						this.maxPageSize = Math.min(4000, this.totalRecords);
						var cEditor = this.editor();
						cEditor
							.title('匯出報表')
							.message('總數量為：' + this.totalRecords)
							.buttons({ label: '匯出', className: 'btn-primary', action: function () { this.submit(); } })
							.create(false);
						cEditor
							.set('iDisplayLength', this.maxPageSize)
							.open();
					},
					editor: function () {
						if (this._editor != null) return this._editor;
						var table = salesOrderReturnTable;
						var _this = this;
						this._editor = new $.fn.dataTable.Editor({
							fields: [
								{
									label: '選擇匯出報表',
									name: 'action',
									type: 'radio',
									def: 'EXPORT_CSV',
									options: [
										{ label: '匯出csv', value: 'EXPORT_CSV' },
										//{label:'匯出訂單商品數量', value:'EXPORT_ORDER_ITEM'},
										{ label: erpTitles[0], value: 'EXPORT_ERP' },
										{ label: erpTitles[1], value: 'EXPORT_ERP2' },
										{ label: erpTitles[2], value: 'EXPORT_ERP3' },
										{ label: erpTitles[3], value: 'EXPORT_ERP4' },
										{ label: erpTitles[4], value: 'EXPORT_ERP5' },
										{ label: erpTitles[5], value: 'EXPORT_ERP6' },
									]
								},
								DataTableConfig.field_input('匯出數量', 'iDisplayLength', this.maxPageSize, '', '', '單次匯出上限為4000筆'),
								DataTableConfig.field_select('第幾頁', 'pageNumber', '', '選擇頁數'),
							],
							formOptions: DataTableConfig.formOptions,
							i18n: DataTableConfig.i18n,
						})
							.dependent('action', function (val, data, callback) {
								if (val == 'EXPORT_ORDER_ITEM') {
									return {
										hide: ['iDisplayLength', 'pageNumber']
									}
								} else {
									return {
										show: ['iDisplayLength', 'pageNumber']
									};
								}
								return {
									values: {
										'pageNumber': '1',
									},
									options: {
										'pageNumber': options
									}
								};
							})
							.dependent('iDisplayLength', function (val, data, callback) {
								var pageSize = parseInt(val);
								if (isNaN(pageSize) || pageSize == 0) pageSize = _this.maxPageSize;
								else if (pageSize > _this.maxPageSize) pageSize = _this.maxPageSize;

								var pages = (_this.totalRecords + pageSize - 1) / pageSize;
								pages = Math.floor(pages);
								pages = Math.min(100, pages);
								var options = [];
								for (var i = 1; i <= pages; i++) {
									options.push({ label: i, value: i });
								}
								return {
									values: {
										'pageNumber': '1',
									},
									options: {
										'pageNumber': options
									}
								};
							})
							.on('preSubmit', function (e, o, action) {
								var pageNumber = o.data[0].pageNumber;
								var iDisplayLength = o.data[0].iDisplayLength;
								var iDisplayStart = (pageNumber - 1) * iDisplayLength;

								var d = appendExtra(table.settings().ajax.params());
								d.iDisplayStart = iDisplayStart;
								d.iDisplayLength = iDisplayLength;
								var j = JSON.stringify(d);
								//queryFormAppend(o.data[0].action, j);
								fileDownload(o.data[0].action, j);
								return false;
							})
							.on('open', function (e, mode, action) {
								$('.DTE').closest('.modal-dialog').removeClass('modal-dialog-scrollable');
								$('.DTE_Form_Content').find('input:radio').each(function (i, obj) { $(obj).addClass('form-check-input') });
							});

						return this._editor;
					}
				};
				var shippingExport = {
					show: function () {
						var cEditor = this.editor();
						cEditor
							.title('匯出貨運清單')
							.message('不會匯出準備出貨中訂單，匯出後會將訂單狀態改成準備出貨中。<br>一次最多匯出500筆')
							.buttons({ label: '下載', className: 'btn-primary', action: function () { this.submit(); } })
							.create(false);
						cEditor.open();
					},
					editor: function () {
						if (this._editor != null) return this._editor;
						this._editor = new $.fn.dataTable.Editor({
								fields: [],
								formOptions: DataTableConfig.formOptions,
								i18n: DataTableConfig.i18n,
							})
							.on('preSubmit', function (e, o, action) {
								var d = {};
								d.iDisplayStart = 0;
								d.iDisplayLength = 500;
								var j = JSON.stringify(d);

								fileDownload('EXPORT_SHIPPING_CSV', j);
								return false;
							})
							.on('open', function (e, mode, action) {
								$('.DTE').closest('.modal-dialog').removeClass('modal-dialog-scrollable');
							});
						return this._editor;
					}
				};
			</script>

					<script>
						var updateFilterEnable = function () {
							var days = $('#days').val();
							if (days == -1) {
								var dateCreatedBegin = $('#dateCreatedBegin').val();
								var dateCreatedEnd = $('#dateCreatedEnd').val();
								var a = moment(dateCreatedBegin);
								var b = moment(dateCreatedEnd);
								days = b.diff(a, 'days');
							}
						}

						$(document).ready(function () {
							$('#days').on('change', function () {
								var val = $(this).val();
								if (val == -1) {
									$('#dateCreatedBegin').show();
								} else {
									$('#dateCreatedBegin').hide();
									$('#dateCreatedEnd').hide();
									$('#dateCreatedBegin').val('');
									$('#dateCreatedEnd').val('');
								}
							});

							var shouldReloadDateCreated = function (date, obj) {
								if ($('#dateCreatedBegin').val() != ''
									&& $('#dateCreatedEnd').val() != '') {
									table.clear().ajax.reload();
								}
							}

							initDatetimePicker('#dateCreatedBegin', 'YYYY-MM-DD', 'months', function (date, obj) {
								var now = moment(date, 'YYYY-MM-DD');
								var maxDate = now.add('61', 'days').format('YYYY-MM-DD');
								if ($('#dateCreatedEnd').data("DateTimePicker") != null) {
									$('#dateCreatedEnd').data("DateTimePicker").destroy()
								}
								initDatetimePicker('#dateCreatedEnd', 'YYYY-MM-DD', 'months');
								$('#dateCreatedEnd').data("DateTimePicker").minDate(date);
								$('#dateCreatedEnd').data("DateTimePicker").maxDate(maxDate);
								$('#dateCreatedEnd').data("DateTimePicker").defaultDate('');
								$('#dateCreatedEnd').show();
							});

							$('[data-type=dateCreated]').on("dp.hide", function () {
								if ($('#dateCreatedBegin').val() != ''
									&& $('#dateCreatedEnd').val() != '') {
									updateFilterEnable();
									salesOrderReturnTable.clear().ajax.reload();
								}
							});

							// Handle tab switching for order type filter
							$('#orderTypeTabs a[data-toggle="tab"]').on('shown.bs.tab', function (e) {
								var relation = $(e.target).data('relation');
								var status = $(e.target).data('status');
								var state = $(e.target).data('state');
								var tabId = $(e.target).attr('id');

								$('#relation').val(relation);
								$('#status').val(status);
								$('#state').val(state);

								// Show/hide shipping export button based on active tab
								var shippingBtn = salesOrderReturnTable.button('shippingExport:name');
								if (tabId === 'replace-apply-tab') {
									shippingBtn.enable();
									$(shippingBtn.node()).show();
								} else {
									shippingBtn.disable();
									$(shippingBtn.node()).hide();
								}

								salesOrderReturnTable.clear().ajax.reload();
							});
						});
					</script>
				</div>
