<!--#head-->
{{> core/partials/dte-style.html}}
<script type="text/javascript" class="init">
{{!-- 推導：標題、訂單編號、顧客資料來自前台公開表單（「我想問問題」），自組 HTML 時一律跳脫，避免 stored XSS。 --}}
var convEscape = function (v) {
	return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
};

	$(document).ready(function() {

		var tableName = '#conversationTable';
		{{!-- 推導：列按鈕（已回覆／已結案）沿用 Editor 的刪除確認框送到 action 端點（helpdesk.ts 只收 action=remove），以 batchAction 指定要改成的狀態。 --}}
		var pendingStatus = null;
		var editor = new $.fn.dataTable.Editor( {
			ajax: {
				create: {
					type: 'POST',
					url:  '{{baseUrl}}/ajax/helpdesk/Conversation/save.do?'
				},
				edit: {
					type: 'POST',
					url:  '{{baseUrl}}/ajax/helpdesk/Conversation/update.do?conversationId=_id_'
				},
				remove: {
					type: 'POST',
					url:  '{{baseUrl}}/ajax/helpdesk/Conversation/action.do?conversationId=_id_',
					data: function (d) {
						d.batchAction = pendingStatus || '';
						return d;
					}
				}
			},
			table: tableName,
			idSrc: 'conversationId',
			fields: [
					DataTableConfig.field_select('對話狀態','status'),
			],
			//template: '#custom_rp_form',
			formOptions:DataTableConfig.formOptions,
			i18n:DataTableConfig.i18n,
		} );

		{{!-- 推導：列表查詢。dom／lengthMenu 同本模組其他列表；status 取目前勾選的狀態 radio（helpdesk.ts 讀 dt.extra.status）。 --}}
		var table = $(tableName).DataTable( {
			dom: 'lBrtip',
			serverSide: true,
			processing: true,
			scrollX: true,
			"lengthMenu": [10, 25, 50, 100, 250],
			ajax: {
				url: '{{baseUrl}}/ajax/helpdesk/Conversation/list.do',
				type: 'POST',
				data: function (d) {
					d.status = $('input[name=status]:checked').val();
					return d;
				}
			},
			language:DataTableConfig.i18n,
			columns:[
				DataTableConfig.data_select_checkbox,
				DataTableConfig.data_input('dateModifiedString'),
				{
					data:'merchantUserId',
					orderable:false,
					render: function ( data, type, row ) {
						{{!-- 推導：第一行訂單編號（沒有時以標題代替），有訂單編號時標題放第二行；另標示顧客名稱、訊息數與滿意度星等（helpdesk.ts 提供 messageCount、rating）。全部跳脫。 --}}
						if (type !== 'display') return data;
						var html = '';
						if (row.merchantUserId) {
							html += convEscape(row.merchantUserId);
							if (row.title) html += '<br><span class="small text-muted">' + convEscape(row.title) + '</span>';
						} else {
							html += convEscape(row.title);
						}
						if (row.name) html += '<br><span class="badge badge-default">' + convEscape(row.name) + '</span>';
						if (row.messageCount > 0) html += ' <span class="badge badge-info">' + parseInt(row.messageCount, 10) + ' 則訊息</span>';
						var rating = parseInt(row.rating, 10) || 0;
						if (rating > 0) {
							html += ' <span class="text-warning text-nowrap">';
							for (var i = 0; i < Math.min(rating, 5); i++) html += '<i class="fa-solid fa-star"></i>';
							html += '</span>';
						}
						return html;
					}
				},
				DataTableConfig.data_select('status'),
				{
					data: null,
					'class': 'inline-disabled',
					orderable: false,
					render: function ( data, type, row ) {
						{{!-- 推導：「檢視」連到 toUrl（helpdesk.ts：302 轉對話明細頁），新分頁開啟；等待回覆中才有「已回覆」，未結案才有「已結案」（同對話明細頁的按鈕）。 --}}
						var url = '/backend/helpdesk/Conversation/toUrl?uuid=' + encodeURIComponent(row.uuid);
						var html = '<a class="btn btn-default btn-sm px-2" target="_blank" href="' + url + '">檢視</a>'

						if (row.status == 'WAITING_FOR_REPLY') {
							html += '<button class="btn btn-secondary text-nowrap" data-action="replied">已回覆</button>';
						}
						if (row.status != 'CLOSED') {
							html += '<button class="btn btn-warning text-nowrap" data-action="closed">已結案</button>';
						}
						return html;
					}
				}
			],
			keys: DataTableConfig.keysInlineTab,
			"order": [[ 1, "desc" ]],
			columnDefs: [
				{ width: '20%', targets: 0 },
				{ orderable: false, targets: [0,2,3] }
			],
			select: DataTableConfig.selectOptionsOS,
			buttons: [
				{ extend: 'edit', editor: editor }
			],
			initComplete: function () {
				DataTableConfig.initFooterSearch(this, [2],[16]);
			},
			drawCallback: function (settings) {
				$(".dataTables_scrollBody").floatingScroll();
			}
		} );

		//DataTableHelper.initEditorOnCallback(table,editor);
		//DataTableHelper.inlineModePlugin(table);
		//DataTableHelper.injectInline(table,editor);

		{{!-- 推導：列按鈕的確認框與送出；狀態變更後重新整理狀態統計。 --}}
		var confirmStatus = function (tr, batchAction, title, message, btnClass) {
			pendingStatus = batchAction;
			editor.remove(tr, {
				title: title,
				message: message,
				buttons: [
					{ text: '確定', className: 'btn ' + btnClass, action: function () { this.submit(); } },
					{ text: '關閉', className: 'btn btn-default', action: function () { this.close(); } }
				]
			});
		};
		$(tableName + ' tbody').on('click', 'button', function () {
			var tr = $(this).closest('tr');
			var action = $(this).attr('data-action');
			if (action == null || table.row(tr).data() == null) return;
			switch (action) {
			case 'replied':
				confirmStatus(tr, 'replied', '已回覆', '確定要將此對話設為「已回覆」嗎？', 'btn-secondary');
				break;
			case 'closed':
				confirmStatus(tr, 'closed', '已結案', '確定要將此對話結案嗎？', 'btn-warning');
				break;
			}
		});
		editor.on('submitSuccess', function () {
			showStatus();
		});
		editor.on('closed', function () {
			pendingStatus = null;
		});

		$(document).on('change', '.filters', function() {
			table.clear().ajax.reload();
		});

		function showStatus() {
			$.ajax({
				type:'GET',
				url:GBF.baseUrl + '/ajax/helpdesk/Conversation/status',
				data:{

				},
				{{!-- 原站：#statusCard 內一個 list-group，「尚未回覆數量」＋藍色徽章（helpdesk.ts 回 data.waitingForReply） --}}
				success: function (json) {
					var d = (json && json.data) || {};
					var n = parseInt(d.waitingForReply, 10) || 0;
					$('#statusCard .card-body').html('<ul class="list-group"><li class="list-group-item d-flex justify-content-between align-items-center">尚未回覆數量<span class="badge badge-primary badge-pill">' + n + '</span></li></ul>');
				}
			});
		}
		showStatus();
	} ); // end ready
</script>
<!--#body--><div class="container-fluid ">
<div id="statusCard" class="card mt-4">
	<div class="card-body p-0"></div>
</div>
<div class="card mt-4">
<div class="card-header">客服對話</div>
<div class='card-footer pb-0'>
		<input type="radio" name="status" id="status_WAITING_FOR_REPLY" class="filters form-check-input" value="WAITING_FOR_REPLY"  checked ><label for="status_WAITING_FOR_REPLY" class="form-check-label pl-4 mr-2">等待回覆中</label>
<input type="radio" name="status" id="status_REPLIED" class="filters form-check-input" value="REPLIED" ><label for="status_REPLIED" class="form-check-label pl-4 mr-2">已回覆</label>
<input type="radio" name="status" id="status_CLOSED" class="filters form-check-input" value="CLOSED" ><label for="status_CLOSED" class="form-check-label pl-4 mr-2">已結案</label>
</div>
<div class="card-body">
	<table id="conversationTable" class="table table-striped display nowrap" width="100%">
		<thead>
			<tr>
				<th></th>
				<th>最後更新日期</th>
				<th>訂單編號</th>
				<th>對話狀態</th>
				<th></th>
			</tr>
		</thead>
		<tfoot>
			<tr>
				<th></th>
				<th>最後更新日期</th>
				<th>訂單編號</th>
				<th>對話狀態</th>
				<th></th>
			</tr>
		</tfoot>
	</table>
</div>
</div>
</div>
