<div class="modal-header">
    <h5>預購轉現貨</h5>
    <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
</div>
<div class="modal-body">
    <div class="modal-message"></div>

    <div class="container mt-2">
        <!-- Loading State -->
        <div id="loadingState" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2">載入訂單商品資訊中...</p>
        </div>

        <!-- No Items State -->
        <div id="noItemsState" class="not-found-container" style="display: none;">
            <div class="alert alert-warning mb-0">
                <h5><i class="bi bi-info-circle-fill"></i> 無預購商品資訊</h5>
                <p class="mb-0">此訂單目前尚無可轉現貨的預購商品。</p>
            </div>
        </div>

        <!-- Error State -->
        <div id="errorState" class="not-found-container" style="display: none;">
            <div class="alert alert-danger mb-2">
                <h5><i class="bi bi-exclamation-triangle-fill"></i> 發生錯誤</h5>
                <p id="errorMessage" class="mb-0">無法取得訂單商品資訊，請稍後再試或聯絡系統管理員。</p>
                <div class="mt-3">
                    <button id="returnToListButton" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left"></i> 返回商品列表
                    </button>
                </div>
            </div>
        </div>

		<!-- Success Message -->
		<div id="successMessage" class="alert alert-success mb-4" style="display: none;">
		    <h5><i class="bi bi-check-circle-fill"></i> 操作成功</h5>
		    <p id="successMessageText" class="mb-0"></p>
		    <div class="mt-3">
		        <button id="backToListButton" class="btn btn-outline-success">
		            <i class="fas fa-list"></i> 返回商品列表
		        </button>
		    </div>
		</div>

        <!-- Order Items Container -->
        <div id="orderItemsContainer" class="order-items-container" style="display: none;">
            <div class="order-info-header">
                <h5 class="mb-3">訂單預購商品資訊</h5>
            </div>

            <div class="card">
                <div class="card-header bg-light">
                    <div class="form-check">
                        <input type="checkbox" id="selectAllItems" class="form-check-input">
                        <label class="form-check-label" for="selectAllItems">全選</label>
                    </div>
                </div>
                <div class="card-body">
                    <div id="orderItemsList">
                        <!-- Order items will be inserted here -->
                    </div>
                </div>
                <div class="card-footer d-flex justify-content-end">
                    <button id="convertToStockButton" class="btn btn-primary">
                        <i class="fas fa-exchange-alt"></i> 轉為現貨
                    </button>
                </div>
            </div>
        </div>

        <!-- Confirmation Section (Initially Hidden) -->
        <div id="confirmationSection" class="mt-3" style="display: none;">
            <div class="card mb-3">
                <div class="card-header bg-light">
                    <h5 class="mb-0">確認轉為現貨</h5>
                </div>
                <div class="card-body">
                    <p>您確定要將選中的預購商品轉為現貨嗎？</p>
                    <div id="selectedItemsSummary"></div>
                </div>
                <div class="card-footer d-flex justify-content-end">
                    <button type="button" id="cancelConversion" class="btn btn-secondary me-2">取消</button>
                    <button type="button" id="confirmConversion" class="btn btn-primary">確認轉換</button>
                </div>
            </div>
        </div>

    </div> <!-- container -->
</div> <!-- modal-body -->

<script>
$(document).ready(function() {
    // 從頁面獲取訂單ID
    const orderId = {{json salesOrderId}};

    // 初始化預購轉現貨管理器
    PreorderToStockManager.init({
        baseUrl: GBF.baseUrl,
        orderId: orderId
    });
});
</script>
