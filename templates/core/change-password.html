<div class="ajaxContainer">
<script>
$(document).ready(function() {
	var adpwdEditor = new $.fn.dataTable.Editor( {
		ajax: {
			create: {
				type: 'POST',
				url:  '{{baseUrl}}/ajax/AdminUser/changePassword'
			},
		},
		idSrc: 'adminUserId',
		fields: [
			{
				type:'password',
				label:'舊密碼',
				name:'oldPassword',
				attr:{required:true}
			},
			{
				type:'password',
				label:'密碼',
				name:'password',
				attr:{required:true}
			},
			{
				type:'password',
				label:'確認密碼',
				name:'confirmPassword',
				attr:{required:true}
			},
		],
		formOptions:DataTableConfig.formOptions,
	})
	.on('preSubmit', function(e, o, action) {
		var ret = true;
		$.each(['oldPassword', 'password', 'confirmPassword'], function(i, name) {
			var field = adpwdEditor.field(name);
			if (!field.val()) {
				field.error('必填');
				ret = false;
			}
		});
		if (ret && adpwdEditor.field('password').val() != adpwdEditor.field('confirmPassword').val()) {
			adpwdEditor.field('confirmPassword').error('確認密碼與密碼不一致');
			ret = false;
		}
		return ret;
	})
	.on('submitSuccess', function() {
		displayAlertSuccess('密碼已更新');
	})
	.on('close', function( e, type ){
		console.log('close');
		$('.ajaxContainer').remove();
	});

	adpwdEditor.title('修改密碼')
	.buttons({label:'更新', className:'btn-primary', action: function () {this.submit();}})
	.create()
});
</script>
</div>
