{{!-- 登入日誌 /backend/AdminUser/loginLog（推導頁：原站「系統設定 > 登入日誌」本帳號無權限、未擷取；spec/SPEC.md §9 #1）。
     資料：admin_login_attempts（本帳號下管理員的登入／修改密碼紀錄，保存 90 天；不存在的帳號無法歸屬租戶，不列出）。 --}}
<!--#head-->
<script type="text/javascript" class="init">
	$(document).ready(function() {
		var table = $('#loginLogTable').DataTable( {
			dom: 'lBrtip',
			serverSide: true,
			processing: true,
			scrollX: true,
			"lengthMenu": [25, 50, 100, 250],
			ajax: {
				url: '{{baseUrl}}/ajax/AdminUser/loginLog.do',
				type: 'POST',
				data: function(d) { d.result = $('#result').val(); }
			},
			language: DataTableConfig.i18n,
			columns: [
				DataTableConfig.data_input('dateCreatedString'),
				DataTableConfig.data_input('account'),
				{ data: 'resultString', render: function(d, t, row) {
					var s = $('<div>').text(d).html();
					return row.success ? '<span class="text-success">' + s + '</span>' : '<span class="text-danger">' + s + '</span>';
				} },
				DataTableConfig.data_input('ip'),
				DataTableConfig.data_input('userAgent'),
			],
			order: [[ 0, 'desc' ]],
			select: false,
			buttons: [ 'excel' ],
			initComplete: function () {
				DataTableConfig.initFooterSearch(this, [1, 3, 4], [16, 16, 24]);
			},
			drawCallback: function() { $(".dataTables_scrollBody").floatingScroll(); }
		} );
		$('#result').on('change', function() { table.ajax.reload(); });
	} ); // end ready
</script>
<!--#body--><div class="container-fluid ">
	<div class="card mt-4">
<div class="card-header">登入日誌 <a class="btn btn-sm btn-outline-secondary float-right m-0" href="/backend/AdminUser/list"><i class="fa-light fa-users-gear"></i> 管理員帳號</a></div>
<div class="card-body">
	<div class="form-inline">
		<label class="mr-2" for="result">結果</label>
		<select id="result" class="browser-default custom-select custom-select-sm" style="width:auto">
			<option value="">全部</option>
			<option value="success">成功</option>
			<option value="fail">失敗</option>
		</select>
		<span class="small text-muted ml-3">紀錄保存 90 天；同帳號 15 分鐘內失敗 5 次會暫停登入。</span>
	</div>
</div>
<div class="card-body">
	<table id="loginLogTable" class="table table-striped display nowrap" width="100%">

		</thead>

</div>
