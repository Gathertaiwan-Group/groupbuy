<script>
function switchAdminUser(username) {
	$.post(
    		{{json baseUrl}} + "/ajax/AdminUser/switchAdmin",
    		{
    			username:username
    		},
    		function(json) {
    			if (json != null && json.code != null && json.code != 200) {
    				displayAlertWarning(json.error);
    				return;
    			}
    			window.location.reload();
    		}
    	).fail(function(jqXHR) {
    		var json = jqXHR.responseJSON;
    		displayAlertWarning(json != null ? json.error : '切換失敗');
    	});
}
</script>
