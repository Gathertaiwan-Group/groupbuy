{{!-- 推導：原站 changePassword.do 片段未擷取（需登入會員）。外觀比照「我想問問題」彈窗，送出比照登入彈窗（ias_v5 initAjaxForm）。 --}}
<!--Header-->
<div class="modal-header light-blue darken-3 white-text">
	<h5 class="title">
		<i class="fa-light fa-lock mr-1"></i>修改密碼</h5>
	<button type="button" class="close waves-effect waves-light"
		data-dismiss="modal" aria-label="Close">
		<span aria-hidden="true"><i class="fa-light fa-xmark"></i></span>
	</button>
</div>
<!--Body-->
<div class="modal-body mb-0">
{{#if customer}}<form name="CustomerForm" method="post" action="{{gbfBaseUrl}}/ajax/web/Customer/changePassword.do" class="form-horizontal" id="changePasswordForm">
	<div class="md-form form-sm">
		<i class="fa-light fa-lock prefix"></i>
		<input type="password" name="oldPassword" maxlength="10" minLength="6" id="changePassword.oldPassword" class="form-control" autocomplete="current-password" required>
		<label for="changePassword.oldPassword">目前密碼</label>
	</div>
	<div class="md-form form-sm">
		<i class="fa-light fa-lock prefix"></i>
		<input type="password" name="password" maxlength="10" minLength="6" id="changePassword.password" class="form-control" autocomplete="new-password" required>
		<label for="changePassword.password">新密碼(6-10碼)</label>
	</div>
	<div class="md-form form-sm">
		<i class="fa-light fa-lock prefix"></i>
		<input type="password" name="confirmPassword" maxlength="10" minLength="6" id="changePassword.confirmPassword" class="form-control" autocomplete="new-password" required>
		<label for="changePassword.confirmPassword">確認新密碼</label>
	</div>
	<div id="modal-message"></div>
	<div class="text-center mt-1-half">
		<button class="btn btn-default mb-2" data-dismiss="modal">關閉<i class="fa-light fa-xmark ml-1"></i></button>
		<input id="submitButton" name="submitButton" type="submit" class="btn btn-info mb-2" value="送出" />
	</div>
</form>
<script>
$(document).ready(function() {
	$('#changePasswordForm').validate();
	initAjaxForm('changePasswordForm');
});
</script>{{else}}<p class="text-center my-3">請先登入會員</p>
<div class="text-center"><a class="btn btn-info" href="javascript: void(0)" onClick="openForm('{{gbfBaseUrl}}/ajax/web/Customer/showLoginForm')">登入/註冊</a></div>{{/if}}
</div>
