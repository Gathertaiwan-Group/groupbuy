{{!-- 開團清單（render=SHOWCASE；推導：原站帳號沒有此樣式的團購，版面未擷取）：同租戶進行中／即將開始的團購卡片 --}}
<div class="container py-4" id="groupbuy-showcase"><div class="row">{{#each showcase}}<div class="col-12 col-sm-6 col-lg-4 mb-4"><div class="card h-100"><a href="{{href}}"><img class="card-img-top" src="{{image}}" alt="{{title}}" style="aspect-ratio:16/9;object-fit:cover"></a><div class="card-body"><span class="badge {{badgeClass}} mb-2">{{badge}}</span><h5 class="card-title h6"><a href="{{href}}">{{title}}</a></h5><p class="card-text small text-muted mb-0">{{period}}</p></div><div class="card-footer bg-transparent border-0 pt-0"><a class="btn btn-sm btn-primary mx-0" href="{{href}}">前往團購</a></div></div></div>{{else}}<div class="col-12 text-center text-muted py-5">目前沒有進行中的團購</div>{{/each}}</div></div>
