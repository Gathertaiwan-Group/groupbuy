{{!-- 導覽列上方選單（navMenuStyle 樣式1 Mega）：有子節點＝mega-dropdown（子孫節點攤平成連結）；沒有子節點＝連結。
     href 後面多一個 " 是原站 JSP 的輸出（照抄）。 --}}
<ul class="nav navbar-nav nav-flex-icons main-web-menu mr-auto d-md-flex d-none smooth-scroll">{{#each topMenu}}{{#if links.length}}<li class="nav-item dropdown mega-dropdown"><a class="nav-link " data-toggle="dropdown">{{title}}</a><div class="dropdown-menu mega-menu v-2 row z-depth-0 " id=""><div class="container"><div class="card"><div class="row mx-md-4 mx-1 h-100"><div class="col-md-6 sub-menu my-xl-5 mt-5 mb-4"><h6 class="sub-title text-uppercase font-weight-bold blue-text">{{title}}</h6><div class="d-xxl-none side-nav-bg"></div><ul class="collapsible collapsible-accordion caret-style pl-0">{{#each links}}<li><a class="waves-effect " href="{{href}}"><span>{{title}}</span></a></li>{{/each}}</ul></div></div><!-- /.row --></div><!-- /.card --></div><!-- /.container --></div><!-- /.dropdown-menu mega-menu --></li>{{else}}<li class="nav-item"><a class="nav-link " href="{{href}}"">{{title}}</a></li>{{/if}}{{/each}}</ul>
