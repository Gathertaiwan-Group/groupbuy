<div class="col-6 col-md-4 col-lg-3 mb-4"><div class="card gb-shop-card h-100"><a href="{{href}}"><img class="card-img-top lazyload" data-src="{{image}}" src="{{image}}" alt="{{title}}"></a><div class="card-body p-2 d-flex flex-column"><a class="item-title-link small mb-1" href="{{href}}">{{title}}</a><div class="mt-auto"><span class="gb-shop-price text-danger">{{priceText}}</span>{{#if retailPriceText}}<small class="text-muted ml-1"><del>{{retailPriceText}}</del></small>{{/if}}</div>{{#if soldOut}}<span class="badge badge-secondary mt-1 align-self-start">已售完</span>{{else}}{{#if hasVariants}}<a class="btn btn-sm btn-outline-primary mt-2 mx-0" href="{{href}}">選擇規格</a>{{else}}<a href="#" class="btn btn-sm btn-outline-primary mt-2 mx-0 js-add-shopping-cart" data-gbis-id="{{groupBuyItemSetId}}" data-item-id="{{itemId}}"><i class="fa-light fa-cart-plus mr-1"></i>加入購物袋</a>{{/if}}{{/if}}</div></div></div>
