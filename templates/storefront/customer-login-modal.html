</div>

使用臉書快速登入</div>
</div>

</div><!-- panel-body -->
</div> <!-- panel -->
</form><script>
$(document).ready(function() {
	
	$('#loginForm').validate();
	initAjaxForm('loginForm', function(json) {
		$(document).trigger('gbf_did_login', json);
	}, function(json) {
		if (json.code == 483) {
			$('#ajax_activate_alert').html(json.error);
			$('a[href*=ajax_activate_email]').tab('show');
			$('#ajax_activateForm input[name=uuid]').val(json.data);
		} else if (json.code == 484) {
			$('#ajax_activate_alert').html(json.error);
			$('a[href*=ajax_activate_sms]').tab('show');
			$('#ajax_activateForm input[name=uuid]').val(json.data);
		} else {
			$modal = $('#loginForm').closest('.modal');
			if (!$modal.length) {
				$modal = $('#loginForm');
			}
			modalShowDanger($modal, json.error);
		}
	});
});
</script></div>

<div class="tab-pane" id="ajax_activate_email" role="tabpanel"><form name="CustomerForm" method="post" action="{{gbfBaseUrl}}/ajax/web/Customer/activate.do" class="form-horizontal" id="ajax_activateForm"><input type="hidden" name="uuid" value="" id="ajax_activate_uuid"><input type="hidden" name="activateToken" value="" id="ajax_activateToken"><input type="hidden" name="authorizing" value="">
<input type="hidden" name="isWeb" value="">
<div class="panel">
<div class="panel-body text-center">
<div class="alert alert-info">
<div id="ajax_activate_alert"></div>
<div class="text-center">
<input type="text" size="1" maxlength="1" class="form-input-digit" digit="1">
<input type="text" size="1" maxlength="1" class="form-input-digit" digit="2">
<input type="text" size="1" maxlength="1" class="form-input-digit" digit="3">
<input type="text" size="1" maxlength="1" class="form-input-digit" digit="4">
<input type="text" size="1" maxlength="1" class="form-input-digit" digit="5">
<input type="text" size="1" maxlength="1" class="form-input-digit" digit="6">
<p id="activateTokenDescr">請輸入6碼驗證碼</p>
</div>
</div>
<button type="button" class="btn btn-info btn-md btn-md-strong" id="btn_ajax_resend_activate">寄送帳號認證信</button>
<div class="alert alert-warning d-none" id="ajax_activate_result">
</div>
</div>
<!-- card-body -->
</div>
<!-- card -->
</form><script>

$(document).ready(function() {
	initAjaxForm('ajax_activateForm', function(json) {
		$('.form-input-digit').prop('disabled',false);
		toastr.success(json.error);
		$(document).trigger('gbf_did_login', json);
	}, function(json) {
		$modal = $('#ajax_activateForm').closest('.modal');
		modalShowDanger($modal, json.error);
		$('.form-input-digit').val('');
		$('.form-input-digit').prop('disabled',false);
		$('#activateTokenDescr').html('請輸入6碼驗證碼');
	});
});

$('.form-input-digit').keyup(function(e){
	var keyCode = e.keyCode;
	var c = String.fromCharCode(keyCode);
	var isWordCharacter = c.match(/\w/);

	var $this = $(this);
	var digit = parseInt($this.attr('digit'));
	if (keyCode == 8 || keyCode == 37) {
		digit = Math.max(1, digit-1);
	} else if (keyCode == 39 || isWordCharacter) {
		digit = Math.min(6, digit+1);
	}

	$('.form-input-digit[digit='+digit+']').focus();
	
	var activateToken = '';
	$('.form-input-digit').each(function(){
		activateToken += $(this).val();
	});
	if (activateToken.length == 6) {
		$('.form-input-digit').prop('disabled',true);
		$('#activateTokenDescr').html('送出驗證中');
		$('#ajax_activateForm input[name=activateToken]').val(activateToken);
		$('#ajax_activateForm').submit();
	}
});

$('#btn_ajax_resend_activate').on('click', function() {
	$btn = $(this);
	btnCountdown($btn);
	inquireActivateToken();
});
var inquireActivateToken = function() {
	var ajaxurl = (typeof baseUrl == 'undefined')	? '..' : baseUrl;
	ajaxurl = ajaxurl + '/ajax/web/Customer/sendActivateEmail.do';
	jQuery.post(
		ajaxurl,
		{
			'uuid':$('#ajax_activateForm input[name=uuid]').val(),
		},
		function(data) {
			$('#ajax_activate_result').removeClass('d-none');
			$('#ajax_activate_result').html(data.error);
		}
	).fail(function(data) {
		json = data.responseJSON;
		$modal = $('#ajax_activateForm').closest('.modal');
		modalShowDanger($modal, json.error);
	});
};
</script></div>
