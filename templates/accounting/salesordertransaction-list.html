<script type="text/javascript" class="init">
$.EPST = function(groupBuyId, table) {
	this.groupBuyId = groupBuyId;
	this.table = table;
	this.resultCellIndex = 7;
}

$.EPST.prototype = {
	verify : function(node) {
		var _this = this;
		var ids = joinIds('salesOrderId', _this.table, false);
		_this.table.rows().deselect();
		this.$button = $(node);
		this.salesOrderIds = ids.split(',');
		this.index = 0;
		btnStartLoading(this.$button);
		_this._verify();
		/*
		this.salesOrderIds.forEach(function(id) {
			_this._verify(id);
		});
		*/
	},
	_verify : function() {
		if (this.index >= this.salesOrderIds.length) {
			btnStopLoading(this.$button);
			return;
		}
		var id = this.salesOrderIds[this.index++];
		var _this = this;
		var _id = '#' + id;
		var rowIndex = this.table.row(_id).index();
		var result = {};
		result.status = 'loading';
		stTable.cell(rowIndex, this.resultCellIndex).data(result);
		var ajaxurl = GBF.baseUrl + '/ajax/SalesOrderTransaction/verify';
		$.ajax({
			type:'POST',
			url:ajaxurl,
			data:{
				merp:$('#merp_select').val(),
				salesOrderId:id
			},
			async:true,
		})
		.done(function(json) {
			var data = json.data;
			if (data == null || data.length == 0) {
				result.status = 'success';
			} else {
				result = data[0];
				if (result.error != null || result.amount == null || result.amount == 0) {
					result.status = 'error';
				} else {
					result.status = 'success';
				}
			}
			stTable.cell(rowIndex, _this.resultCellIndex).data(result);
		})
		.fail(function(jqXHR, textStatus, errorThrown) {
			var json = jqXHR.responseJSON;
			result.status = 'error';
			result.error = json ? json.error : textStatus;
			stTable.cell(rowIndex, _this.resultCellIndex).data(result);
		})
		.always(function() {
			setTimeout(function() {
				console.log('xx');
				_this._verify();
			}, 100);
		});
	}
}

var epst;
var stTable;
$(document).ready(function() {
	var tableName = '#stTable';
	editor = new $.fn.dataTable.Editor( {
		ajax: {
		},
		table: tableName,
		idSrc: 'webMenuId',
		fields: [
				DataTableConfig.field_select('類別','category'),
		],
		//template: '#custom_rp_form',
		formOptions:{
			main: {
				submit: 'all', //for activate
				submitOnReturn: false,
			}
		},
		i18n:DataTableConfig.i18n,
	} );

	var table = $(tableName).DataTable( {
		dom: 'lBrtip',
		serverSide:true,
		processing:true,
		scrollX:true,
		rowId: 'salesOrderId',
		"lengthMenu": [10, 25, 50, 100, 250],
		ajax: {
			url:'{{baseUrl}}/ajax/SalesOrder/list.do',
			type: "POST",
			data: function ( d ) {
				d.groupBuyIds = '';
				if (!d.groupBuyIds) {
					d.groupBuyId = {{json groupBuyId}};
				}
				d.month = 100;
				return d;
			},
			//data: {groupBuyId: {{json groupBuyId}} }
		},
		language:DataTableConfig.i18n,
		columns:[
				DataTableConfig.data_select_checkbox,
				DataTableConfig.data_input('uuid'),
				DataTableConfig.data_select('state'),
				DataTableConfig.data_select('status'),
				DataTableConfig.data_input('totalPaid'),
				DataTableConfig.data_select('paymentMethod'),
				DataTableConfig.data_input('creditCardNumber'),
				{
					data:'xxx',
					'class':'inline-disabled',
					orderable:false,
					render: function ( data, type, row ) {
						var html = '';
						if (data == undefined) data = '';
						else {
							var s = '<i class="fa-light fa-check text-success mr-1"></i>';
							var e = '<i class="fa-light fa-xmark text-danger mr-1"></i>';
							var w = '<i class="fa-light fa-exclamation-circle text-warning mr-1"></i>';
							switch (data.status) {
							case 'loading':
								html = '<span>查核中</span><i class="fa-light fa-spinner fa-refresh-animate ml-2"></i>';
								return html;
							case 'success':
								if (data.amount != undefined) html += s + '金流收款金額:<span class="text-success">' + data.amount + '</span><br>';
								if (data.creditCardNumber != undefined) html += s + '補充信用卡號:<span class="text-success">' + data.creditCardNumber + '</span><br>';
								break;
							case 'error':
								if (data.error != null) html += e + '<span class="text-danger">' + data.error + '</span><br>';
								break;
							}
							if (data.merchantOrderId != null && data.merchantOrderId != 0) {
								html += s + '金流訂單號碼:<span class="text-success">' + data.merchantOrderId + '</span><br>';
							}
							var valid = data.amount;
							var shortAmount = 0;
							var refund = 0;
							if (data.refund != null && data.refund != 0) {
								refund = Math.abs(data.refund);
								valid = data.amount - refund;
								html += w + '付款:<span class="text-warning">' + data.amount + '</span> ';
								html += '退款:<span class="text-warning">' + refund + '</span> ';
								html += '有效:<span class="text-warning">' + valid + '</span><br>';
							}
							if (data['short'] != null && data['short'] != 0) {
								shortAmount = data['short'];
								html += w + '交易與訂單差額:<span class="text-warning">' + data['short'] + '</span><br>';
							}
							if (data.payStatus != null) {
								html += w + '交易結果:<span class="text-warning">' + data.payStatus + '</span><br>';
							}
							if (shortAmount != 0) {
								if (data.totalPaid == valid && refund + shortAmount == 0) {
									html += s + '<span class="text-success">差額金額正確</span><br>';
								} else {
									html += e + '<span class="text-danger">檢查是否有差額</span><br>';
								}
							}
						}
						return html;
					}
				},
		],
		keys: DataTableConfig.keysInlineTab,
		"order": [[ 0, "desc" ]],
		select: DataTableConfig.selectOptionsOS,
		buttons: [
			'selectAllTaggle',
			{
				extend: "edit",
				text: '檢核',
				action: function ( e, dt, node, config ) {
					epst.verify(node);
				}
			},
			'excel',
		],
		initComplete: function () {
			DataTableConfig.initFooterSearch(this, [1,2,3,5],[16,0,0,0]);
		},
		drawCallback: function (settings) {
			$(".dataTables_scrollBody").floatingScroll();
		}
	} );
	stTable = table;
	$(tableName +' tbody').on('click', 'button', function (e) {
		e.stopPropagation();
		var tr = $(this).closest('tr');
		var row = table.row( tr );
		var webMenuId = row.data().webMenuId;
		var action = $(this).attr('data-action');
		if (action == null) return;
		{{!-- 推導：原站此段為複製自其他頁的列按鈕處理（本頁列內沒有按鈕），內容未擷取 --}}
	});
	var groupBuyId = {{json groupBuyId}};
	epst = new $.EPST(groupBuyId, stTable);
} ); // end ready
</script>
