{{> core/partials/dte-style.html}}
<script type="text/javascript" class="init">
	{{!-- 推導：原站此段被擷取過濾；預設查詢區間（單一團購 7 天、全部團購 1 天）與表格設定依 spec 已知部分與本系統端點補完 --}}
	function initDateInput(hasTarget) {
		var f = hasTarget ? 7 : 1;
		var today = moment().format('YYYY-MM-DD');
		var fromday = moment().subtract(f, 'days').format('YYYY-MM-DD');
		$("input[name=day]").val(today).attr('max', today);
		$("input[name=fromday]").val(fromday).attr('max', today);
		$("input[name=today]").val(today).attr('max', today);
	}

	var groupBuyDailyStatisticsTable;
	$(document).ready(function() {
		var groupBuyId = '{{#if groupBuyId}}{{groupBuyId}}{{/if}}';
		var sortSetting = [[ 0, "desc" ]];
		$('.input-group-day-period').removeClass('d-none');
		initDateInput(groupBuyId.length > 0);
		var tableName = '#groupBuyDailyStatisticsTable';
		var editor = new $.fn.dataTable.Editor( {
			ajax: {
				create: {
					type: 'POST',
					url:  '{{baseUrl}}/ajax/GroupBuyDailyStatistics/save.do?'
				},
				edit: {
					type: 'POST',
					url:  '{{baseUrl}}/ajax/GroupBuyDailyStatistics/update.do?groupBuyDailyStatisticsId=_id_'
				},
				remove: {
					type: 'POST',
					url:  '{{baseUrl}}/ajax/GroupBuyDailyStatistics/delete.do?groupBuyDailyStatisticsId=_id_'
				}
			},
			table: tableName,
			idSrc: 'groupBuyDailyStatisticsId',
			fields: [
					DataTableConfig.field_datetime('???GroupBuyDailyStatistics.dateStatistics???','dateStatisticsString','YYYY-MM-DD HH:mm'),
					DataTableConfig.field_input('???GroupBuyDailyStatistics.amountSales???','amountSales'),
					DataTableConfig.field_input('???GroupBuyDailyStatistics.countSales???','countSales'),
					DataTableConfig.field_input('???GroupBuyDailyStatistics.groupBuyAccountId???','groupBuyAccountId'),
					DataTableConfig.field_input('???GroupBuyDailyStatistics.groupBuyId???','groupBuyId'),
			],
			//template: '#customForm'
		} );

		var table = $(tableName).DataTable( {
			dom: 'Brtip',
			serverSide: true,
			processing: true,
			scrollX: true,
			pageLength: 100,
			ajax: {
				url: '{{baseUrl}}/ajax/GroupBuyDailyStatistics/list.do',
				type: 'POST',
				data: function(d) {
					d.groupBuyId = groupBuyId;
					d.fromday = $('input[name=fromday]').val();
					d.today = $('input[name=today]').val();
				}
			},
			language:DataTableConfig.i18n,
			columns:[
				DataTableConfig.data_input('dateStatisticsString'),
				{
                    data:'title',
                    render: function ( data, type, row ) {
                    	if (type !== 'display' || groupBuyId.length) return data;
                    	return '<i class="fa-light fa-calendar mr-1" style="cursor:pointer"></i>' + $('<span>').text(data || '').html();
                    }
				},
				DataTableConfig.data_input('amountSales'),
				DataTableConfig.data_input('countSales'),
				DataTableConfig.data_input('amountSalesPaid'),
				DataTableConfig.data_input('countSalesPaid'),
				DataTableConfig.data_input('amountSalesUnpaid'),
				DataTableConfig.data_input('countSalesUnpaid'),
		/* 		{
                    data:'amountSales',
                    render: function ( data, type, row ) {
                    	return data + '('+row.amountSalesPaid+')'
                    }
				},
				{
                    data:'countSales',
                    render: function ( data, type, row ) {
                    	return data + '('+row.countSalesPaid+')'
                    }
				}, */
			],
			keys: DataTableConfig.keysInlineTab,
			"order": sortSetting,
			select: DataTableConfig.selectOptionsOS,
			buttons: [
                {
                    extend: 'excelHtml5',
                    exportOptions: { orthogonal: 'export' }
                },
				//{ extend: 'create', editor: editor },
				//{ extend: 'edit',   editor: editor },
				//{ extend: 'remove', editor: editor, className:'btn-danger' },
			],
			initComplete: function () {
				DataTableConfig.initFooterSearch(this, [],[]);
			},
			drawCallback: function () {
				if ($.fn.floatingScroll)
				$(".dataTables_scrollBody").floatingScroll();
			},
			footerCallback: function () {
				var api = this.api();
				var intVal = function (i) {
					return typeof i === 'string' ? i.replace(/[\$,]/g, '') * 1 : typeof i === 'number' ? i : 0;
				};
				var amountColumn = 2, countColumn = 3;
				var amountTotal = api.column(amountColumn, { page: 'current' }).data().reduce(function (a, b) { return intVal(a) + intVal(b); }, 0);
				var countTotal = api.column(countColumn, { page: 'current' }).data().reduce(function (a, b) { return intVal(a) + intVal(b); }, 0);
				api.column(amountColumn).footer().innerHTML = '總金額 ( ' + amountTotal + ' )';
				api.column(countColumn).footer().innerHTML = '總單數 ( ' + countTotal + ' )';
			}
		} );
		
		//DataTableHelper.initEditorOnCallback(table,editor);
		//DataTableHelper.inlineModePlugin(table);
		//DataTableHelper.injectInline(table,editor);
		groupBuyDailyStatisticsTable = table;
		$("#btn-day-period").click(function() {
			table.ajax.reload();
		});
		$(tableName + ' tbody').on('click', 'i.fa-calendar', function(e) {
			e.stopPropagation();
			var data = table.row($(this).closest('tr')).data();
			window.open('/backend/GroupBuyDailyStatistics/list?groupBuyId=' + data.groupBuyId, '_blank');
		});
		if (!groupBuyId.length) {
			table.column(0).visible(false);
		}
	} ); // end ready
</script>
