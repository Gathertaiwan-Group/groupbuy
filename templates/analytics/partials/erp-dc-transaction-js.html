{{!-- 通路結算紀錄（通路商團購的結算）與通路結算單據的編輯器／表格。
     原站此段大部分被擷取過濾；依 spec 已知的欄位設定、端點與本系統 distribution.ts 的回傳補完（推導）。 --}}
<script type="text/javascript">
var distributionChannelTransactionTable;
var distributionChannelGroupBuyTransactionTable;

var createDistributionChannelGroupBuyTransactionEditor = function(distributionChannelGroupBuyId, distributionChannelId, tableName) {

	var conf = {
		ajax: {
			create: {
				type: 'POST',
				url: GBF.baseUrl + '/ajax/erp/DistributionChannelGroupBuyTransaction/save.do?distributionChannelGroupBuyId='+distributionChannelGroupBuyId
			},
			edit: {
				type: 'POST',
				url:  GBF.baseUrl + '/ajax/erp/DistributionChannelGroupBuyTransaction/update.do?distributionChannelGroupBuyTransactionId=_id_'
			},
			remove: {
				type: 'POST',
				url: GBF.baseUrl + '/ajax/erp/DistributionChannelGroupBuyTransaction/delete.do?distributionChannelGroupBuyTransactionId=_id_'
			}
		},
		idSrc: 'distributionChannelGroupBuyTransactionId',
		fields: [
			DataTableConfig.field_select2('選擇通路結算單據','distributionChannelTransactionId','','選擇', GBF.baseUrl + '/ajax/erp/DistributionChannelTransaction/lookup?distributionChannelId='+distributionChannelId,false,undefined,'將此結算紀錄加入既有通路結算單據。一個通路結算單據裡面可包含有多團結算內容'),
			DataTableConfig.field_checkbox_bool('使用新的通路結算單據','newDCT'),
			DataTableConfig.field_datetime('結算日期','dateTransactionString','YYYY-MM-DD'),
			DataTableConfig.field_checkbox_bool('自動帶出數據資料','getStatistics'),
			//DataTableConfig.field_select('階段','state'),
			//DataTableConfig.field_select('狀態','status'),
			DataTableConfig.field_input('營業額','gmv', 0),
			DataTableConfig.field_input('訂單數量','orderTotal', 0),
			//DataTableConfig.field_input('分潤金額','revenue', 0),
			//DataTableConfig.field_input('稅率(%)','taxRate', 0),
			//DataTableConfig.field_checkbox_bool('依稅率更新稅額及結算金額','updateFee'),
			//DataTableConfig.field_input('稅額','taxFee', 0),
			DataTableConfig.field_input('結算金額','amount', 0),
			DataTableConfig.field_textarea('備註', 'note','', 10),
		],
		//template: '#custom_rp_form',
		formOptions:DataTableConfig.formOptions,
		i18n:DataTableConfig.i18n,
	}
	if (tableName) conf.table = tableName;
	var editor = new $.fn.dataTable.Editor(conf);

	editor.on('open', function(e, mode, action) {
		var isCreate = action === 'create';
		DataTableHelper.showHideAllColumns(editor, true);
		if (isCreate) {
			editor.enable('distributionChannelTransactionId');
			editor.show(['newDCT', 'getStatistics']);
		} else {
			editor.hide(['newDCT', 'getStatistics']);
		}
	});

	var loadStatistics = function(id, callback) {
		btnStartLoading($('.DTE_Form_Buttons button'));
		jQuery.get(
			GBF.baseUrl + '/ajax/erp/DistributionChannelGroupBuy/getStatistics',
			{
				distributionChannelGroupBuyId: id
			},
			function(json) {
				btnStopLoading($('.DTE_Form_Buttons button'));
				var s = (json && json.groupBuyStatistics) || {};
				callback({
					values: {
						gmv: s.paidTotalWithoutShipping || 0,
						orderTotal: s.paidOrders || 0
					}
				});
			}
		).fail(function() {
			btnStopLoading($('.DTE_Form_Buttons button'));
			callback({});
		});
	};

	editor.dependent('getStatistics', function(val, data, callback) {
		if (val == 1) {
			if (data.row && data.row.distributionChannelGroupBuyId) {
				loadStatistics(data.row.distributionChannelGroupBuyId, callback);
			} else {
				loadStatistics(distributionChannelGroupBuyId, callback);
			}
			return;
		}
		return {};
	})
	.dependent('newDCT', function(val, data, callback) {
		if (val == 1) {
			return {
				hide:['distributionChannelTransactionId'],
				values:{
					'distributionChannelTransactionId':''
				}
			};
		}
		return {
			show:['distributionChannelTransactionId']
		};
	});
	return editor;
}

var createDistributionChannelGroupBuyTransactionTable = function(distributionChannelGroupBuyId, distributionChannelTransactionId, tableName, editor) {
	var buttons = [];
	if (distributionChannelGroupBuyId) buttons.push({ extend: 'create', editor: editor });
	buttons.push({ extend: 'edit',   editor: editor });
	buttons.push({ extend: 'remove', editor: editor, className:'btn-danger' });
	buttons.push(dcgbtStatusButton('要求查核', 'REVIEWING'));
	buttons.push(dcgbtStatusButton('駁回', 'DECLINED'));
	buttons.push(dcgbtStatusButton('核可', 'REVIEWED'));

	var table = $(tableName).DataTable( {
		dom: 'lBrtip',
		serverSide:true,
		processing:true,
		scrollX:true,
		"lengthMenu": [10, 25, 50, 100, 250],
		ajax: {
			url:GBF.baseUrl + '/ajax/erp/DistributionChannelGroupBuyTransaction/list.do',
			type: "POST",
			data: {
				distributionChannelGroupBuyId:distributionChannelGroupBuyId,
				distributionChannelTransactionId:distributionChannelTransactionId,
			},
		},
		language:DataTableConfig.i18n,
		columns:[
			DataTableConfig.data_select_checkbox,
			DataTableConfig.data_input('dateTransactionString'),
			DataTableConfig.data_input('groupBuyTitle'),
			{ data: 'status',
				render: function(data, type, row, meta) {
					return renderOption(meta, data, 'status');
				}
			},
			DataTableConfig.data_input('gmv'),
			DataTableConfig.data_input('orderTotal'),
			//DataTableConfig.data_input('revenue'),
			DataTableConfig.data_input('amount'),
		],
		keys: DataTableConfig.keysInlineTab,
		"order": [[ 1, "asc" ]],
		select: DataTableConfig.selectOptionsOS,
		buttons: buttons,
		initComplete: function () {
			DataTableConfig.initFooterSearch(this, [],[]);
		},
		drawCallback: function (settings) {
			if ($.fn.floatingScroll)
			$(".dataTables_scrollBody").floatingScroll();
		}
	} );
	if (!distributionChannelGroupBuyId && !distributionChannelTransactionId) {
		distributionChannelGroupBuyTransactionTable = table;
	}
	return table;
}

function dcgbtStatusButton(text, status) {
	return {
		text: text,
		extend: 'selected',
		action: function(e, dt, node) {
			var $btn = $(node);
			var id = dt.rows({ selected: true }).data().toArray().map(function(r) { return r.distributionChannelGroupBuyTransactionId; }).join(',');
			if (!id) return;
			btnStartLoading($btn);
			$.ajax({
				url: GBF.baseUrl + '/ajax/erp/DistributionChannelGroupBuyTransaction/updateStatus',
				type: 'POST',
				data: {
					'distributionChannelGroupBuyTransactionId':id,
					'status':status
				},
				dataType: 'json',
				success: function(json) {
					dt.ajax.reload( null, false );
					if (typeof distributionChannelTransactionTable !== 'undefined' && distributionChannelTransactionTable) {
						distributionChannelTransactionTable.ajax.reload( null, false );
					}
					btnStopLoading($btn);
				},
				error: function (xhr, ajaxOptions, thrownError) {
					if (xhr.responseJSON) {
						messagebox('',xhr.responseJSON.error, GBFi18n.act_close)
					} else {
						alert(xhr.status + " "+ thrownError);
					}
					btnStopLoading($btn);
				}
			});
		}
	};
}

var createDistributionChannelTransactionEditor = function(distributionChannelId,
		tableName) {
	var conf = {
		ajax: {
			create: {
				type: 'POST',
				url: GBF.baseUrl + '/ajax/erp/DistributionChannelTransaction/save.do?distributionChannelId='+distributionChannelId
			},
			edit: {
				type: 'POST',
				url:  GBF.baseUrl + '/ajax/erp/DistributionChannelTransaction/update.do?distributionChannelTransactionId=_id_'
			},
			remove: {
				type: 'POST',
				url: GBF.baseUrl + '/ajax/erp/DistributionChannelTransaction/delete.do?distributionChannelTransactionId=_id_'
			}
		},
		idSrc: 'distributionChannelTransactionId',
		fields: [
			DataTableConfig.field_select('狀態','status'),
			DataTableConfig.field_datetime('結算日期','dateTransactionString','YYYY-MM-DD'),
			DataTableConfig.field_input('稅率(%)','taxRate'),
			DataTableConfig.field_input('稅額','taxFee'),
			DataTableConfig.field_input('結算金額','amount'),
			DataTableConfig.field_textarea('備註', 'note','', 10),
		],
		//template: '#custom_rp_form',
		formOptions:DataTableConfig.formOptions,
		i18n:DataTableConfig.i18n,
	}
	if (tableName) conf.table = tableName;
	return new $.fn.dataTable.Editor(conf);
}

var createDistributionChannelTransactionTable = function(distributionChannelId,
		distributionChannelTransactionId,
		tableName,
		editor) {
	var tableName = tableName || '#distributionChannelTransactionTable';
	var table = $(tableName).DataTable( {
		dom: 'lBrtip',
		serverSide:true,
		processing:true,
		scrollX:true,
		"lengthMenu": [10, 25, 50, 100, 250],
		ajax: {
			url:GBF.baseUrl + '/ajax/erp/DistributionChannelTransaction/list.do',
			type: "POST",
			data: {
				distributionChannelId:distributionChannelId,
				distributionChannelTransactionId:distributionChannelTransactionId,
			},
		},
		language:DataTableConfig.i18n,
		columns:[
			DataTableConfig.data_details,
			DataTableConfig.data_select_checkbox,
			DataTableConfig.data_input('dateTransactionString'),
			DataTableConfig.data_input('title'),
			DataTableConfig.data_select('status'),
			DataTableConfig.data_input('taxRate'),
			DataTableConfig.data_input('taxFee'),
			DataTableConfig.data_input('amount'),
		],
		keys: DataTableConfig.keysInlineTab,
		"order": [[ 2, "asc" ]],
		select: DataTableConfig.selectOptionsOS,
		buttons: [
			{ extend: 'create', editor: editor },
			{ extend: 'edit',   editor: editor },
			{ extend: 'remove', editor: editor, className:'btn-danger' },
			dctStatusButton('要求查核', 'review'),
			dctStatusButton('駁回', 'decline'),
			dctStatusButton('核可', 'approve'),
		],
		initComplete: function () {
			DataTableConfig.initFooterSearch(this, [],[]);
		}
	} );
	distributionChannelTransactionTable = table;

	// 展開列：此單據包含的各團結算紀錄
	$(tableName + ' tbody').on('click', 'td.details-control', function () {
		var tr = $(this).closest('tr');
		var row = table.row(tr);
		if (row.child.isShown()) {
			row.child.hide();
			tr.removeClass('shown');
			return;
		}
		var id = row.data().distributionChannelTransactionId;
		var childId = 'dct_dcgbt_' + id;
		row.child('<table id="' + childId + '" class="table table-striped display nowrap" width="100%"><thead><tr>'
			+ '<th></th><th>結算日期</th><th>團購</th><th>狀態</th><th>營業額</th><th>訂單數量</th><th>結算金額</th>'
			+ '</tr></thead></table>').show();
		tr.addClass('shown');
		var childEditor = createDistributionChannelGroupBuyTransactionEditor(null, distributionChannelId || row.data().distributionChannelId, '#' + childId);
		createDistributionChannelGroupBuyTransactionTable(null, id, '#' + childId, childEditor);
	});
	return table;
}

function dctStatusButton(text, action) {
	return {
		text: text,
		extend: 'selected',
		action: function(e, dt, node) {
			var $btn = $(node);
			var id = dt.rows({ selected: true }).data().toArray().map(function(r) { return r.distributionChannelTransactionId; }).join(',');
			if (!id) return;
			updateDistributionChannelTransactionStatus(action, id, $btn);
		}
	};
}

function updateDistributionChannelTransactionStatus(action, id, $btn) {
		var status;
		switch (action) {
		case 'review': status = 'REVIEWING'; break;
		case 'decline': status = 'DECLINED'; break;
		case 'approve': status = 'REVIEWED'; break;
		default: return;
		}
		btnStartLoading($btn);
		$.ajax({
			url: GBF.baseUrl + '/ajax/erp/DistributionChannelTransaction/updateStatus',
			type: 'POST',
			data: {
				'distributionChannelTransactionId':id,
				'status':status
			},
			dataType: 'json',
			success: function(json) {
				distributionChannelTransactionTable.ajax.reload( null, false );
				if (typeof distributionChannelGroupBuyTransactionTable !== 'undefined' && distributionChannelGroupBuyTransactionTable) {
					distributionChannelGroupBuyTransactionTable.ajax.reload( null, false );
				}
				btnStopLoading($btn);
			},
			error: function (xhr, ajaxOptions, thrownError) {
				if (xhr.responseJSON) {
					messagebox('',xhr.responseJSON.error, GBFi18n.act_close)
				} else {
					alert(xhr.status + " "+ thrownError);
				}
				btnStopLoading($btn);
			}
		});
}
</script>
