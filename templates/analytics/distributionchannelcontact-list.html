<!--#head-->
{{> core/partials/dte-style.html}}
<script type="text/javascript" class="init">

	$(document).ready(function() {

		var distributionChannelId = {{json distributionChannelId}};
		var tableName = '#distributionChannelContactTable';
		var editor = new $.fn.dataTable.Editor( {
			ajax: {
				create: {
					type: 'POST',
					url:  '{{baseUrl}}/ajax/erp/DistributionChannelContact/save.do?distributionChannelId=' + distributionChannelId
				},
				edit: {
					type: 'POST',
					url:  '{{baseUrl}}/ajax/erp/DistributionChannelContact/update.do?distributionChannelContactId=_id_'
				},
				remove: {
					type: 'POST',
					url:  '{{baseUrl}}/ajax/erp/DistributionChannelContact/delete.do?distributionChannelContactId=_id_'
				}
			},
			table: tableName,
			idSrc: 'distributionChannelContactId',
			fields: [
					DataTableConfig.field_select('聯絡人類型','contactType'),
					DataTableConfig.field_input('姓名','name'),
					DataTableConfig.field_input('職稱','title'),
					DataTableConfig.field_input('電話','telephone'),
					DataTableConfig.field_input('手機','mobile'),
					DataTableConfig.field_input('電子信箱','email'),
					DataTableConfig.field_input('地址','address'),
					DataTableConfig.field_textarea('備註', 'note','', 10),
			],
			formOptions:DataTableConfig.formOptions,
			i18n:DataTableConfig.i18n,
		} );

		var table = $(tableName).DataTable( {
			dom: 'lBrtip',
			serverSide:true,
			processing:true,
			scrollX:true,
			"lengthMenu": [10, 25, 50, 100, 250],
			ajax: {
				url:'{{baseUrl}}/ajax/erp/DistributionChannelContact/list.do',
				type: "POST",
				data: function ( d ) {
					d.distributionChannelId = distributionChannelId;
					return d;
				}
			},
			language:DataTableConfig.i18n,
			columns:[
				DataTableConfig.data_select_checkbox,
				DataTableConfig.data_select('contactType'),
				DataTableConfig.data_input('name'),
				DataTableConfig.data_input('title'),
				DataTableConfig.data_input('telephone'),
				DataTableConfig.data_input('mobile'),
				DataTableConfig.data_input('email'),
				DataTableConfig.data_input('address'),
				DataTableConfig.data_input('note'),
			],
			keys: DataTableConfig.keysInlineTab,
			"order": [[ 1, "asc" ]],
			select: DataTableConfig.selectOptionsOS,
			buttons: [
				{ extend: 'create', editor: editor },
				{ extend: 'edit',   editor: editor },
				{ extend: 'remove', editor: editor, className:'btn-danger' },
			],
			initComplete: function () {
				DataTableConfig.initFooterSearch(this, [],[]);
			},
			drawCallback: function (settings) {
				$(".dataTables_scrollBody").floatingScroll();
			}
		} );

		DataTableHelper.initEditorOnCallback(table,editor);
		DataTableHelper.inlineModePlugin(table);
		DataTableHelper.injectInline(table,editor);

	} ); // end ready
</script>
