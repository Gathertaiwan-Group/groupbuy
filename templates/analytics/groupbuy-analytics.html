<script>

var backgroundColors = [
	 'rgba(255, 99, 132, 0.4)',
	 'rgba(54, 162, 235, 0.4)',
	 'rgba(255, 206, 86, 0.4)',
	 'rgba(75, 192, 192, 0.4)',
	 'rgba(153, 102, 255, 0.4)',
	 'rgba(255, 159, 64, 0.4)',
	'rgba(205, 99, 132, 0.4)',
	'rgba(54, 162, 185, 0.4)',
	'rgba(255, 156, 86, 0.4)',
	'rgba(75, 142, 192, 0.4)',
	'rgba(153, 102, 205, 0.4)',
	'rgba(205, 159, 64, 0.4)',
	];
var borderColors = [
	'rgba(255, 99, 132, 1)',
	'rgba(54, 162, 235, 1)',
	'rgba(255, 206, 86, 1)',
	'rgba(75, 192, 192, 1)',
	'rgba(153, 102, 255, 1)',
	'rgba(255, 159, 64, 1)',
	'rgba(205, 99, 132, 1)',
	'rgba(54, 162, 185, 1)',
	'rgba(255, 156, 86, 1)',
	'rgba(75, 142, 192, 1)',
	'rgba(153, 102, 205, 1)',
	'rgba(205, 159, 64, 1)',
	];

{{!-- 推導：原站此段被擷取過濾；資料轉換、載入與近期摘要依 spec 已知的 createChart 呼叫與本系統端點補完 --}}
var _charts = {};
var _createChart = function(chartId, type, data, showLegend) {
	var myChart = new Chart(
			$(chartId),
			{
				type: type,
				data: data,
				options: {
						responsive: true,
					maintainAspectRatio: false,
					title: {
						display: false,
					},
					legend: {
						display: showLegend,
					},
				}
			});
	window.addEventListener('resize', function () {
		myChart.resize() 
	})
	_charts[chartId] = myChart;
	return myChart;
}

var createChart = function(chartId, type, label, items, unit, colorIndex, showLegend) {
	items = items || [];
	if (_charts[chartId]) {
		_charts[chartId].destroy();
		delete _charts[chartId];
	}
	var labels = items.map(function(item) { return item.label; });
	var values = items.map(function(item) { return Number(item.data) || 0; });
	var dataset = { label: label + (unit ? ' (' + unit + ')' : ''), data: values };
	if (colorIndex < 0) {
		dataset.backgroundColor = items.map(function(item, i) { return backgroundColors[i % backgroundColors.length]; });
		dataset.borderColor = items.map(function(item, i) { return borderColors[i % borderColors.length]; });
	} else {
		dataset.backgroundColor = backgroundColors[colorIndex % backgroundColors.length];
		dataset.borderColor = borderColors[colorIndex % borderColors.length];
	}
	dataset.borderWidth = 1;
	return _createChart(chartId, type, { labels: labels, datasets: [dataset] }, showLegend);
}

var loadDailyReport = function(query) {
	$.ajax({
		url: '{{baseUrl}}/ajax/GroupBuy/getDailyReport.do',
		dataType: 'json',
		data: query
	})
	.done(function (json) {
		var $tbody = $('#dailyReport tbody').empty();
		$.each(json.data || {}, function(date, r) {
			$tbody.append('<tr><td><div class="row">'
				+ '<div class="col-3">' + r.date + '</div>'
				+ '<div class="col-3">' + r.count + '</div>'
				+ '<div class="col-3">' + r.grandTotal + '</div>'
				+ '<div class="col-3">' + r.totalPaid + '</div>'
				+ '</div></td></tr>');
		});
	});
}

var load = function() {
	var query = {
		groupBuyId: {{json groupBuyId}},
		dateCreatedBegin: $('#dateCreatedBegin').val(),
		dateCreatedEnd: $('#dateCreatedEnd').val(),
	};
	$.ajax({
				url: '{{baseUrl}}/ajax/GroupBuy/analytics.do?all=1',
				dataType: 'json',
				data:query
			})
			.done(function (json) {
				createChart('#dailyChart', 'bar', "訂單數", json.data.dailyCounts, '日', 3, true);
				createChart('#distributionChart', 'bar', "訂單數", json.data.distributions, '元', 4, true);
				createChart('#cateTagPortionChart', 'doughnut', "金額", json.data.cateTagPortions, '', -1, false);
				createChart('#itemSetPortionChart', 'doughnut', "金額", json.data.itemSetPortions, '', -1, false);
				createChart('#areaSalesOrderCountPortionChart', 'bar', "訂單數", json.data.areaSalesOrderCountPortions, '', 5, true);
				createChart('#areaSalesOrderAmountPortionChart', 'bar', "金額", json.data.areaSalesOrderAmountPortions, '', 1, true);
			});
	loadDailyReport(query);
}

$(document).ready(function() {
	var end = moment().format('YYYY-MM-DD');
	var begin = moment().subtract(7, 'days').format('YYYY-MM-DD');
	initDatetimePicker('#dateCreatedBegin', 'YYYY-MM-DD', 'days', function(date) {
		var maxDate = moment(date).add(1, 'years');
		$('#dateCreatedEnd').data("DateTimePicker").minDate(date);
		$('#dateCreatedEnd').data("DateTimePicker").maxDate(maxDate);
		//$('#dateCreatedEnd').data("DateTimePicker").defaultDate(begin);
		//$('#dateCreatedEnd').show();
	});
	initDatetimePicker('#dateCreatedEnd', 'YYYY-MM-DD', 'days');
	$('#dateCreatedBegin').data("DateTimePicker").defaultDate(begin);
	$('#dateCreatedEnd').data("DateTimePicker").defaultDate(end);
	
	$('#btn-search').click(function() {
		load();
	});
	load();
});
