<script>

{{!-- 推導：原站 parseErp 開頭、各段結尾與載入流程被擷取過濾；依 spec 已知的列組裝與本系統 getErpSalesReport 回傳補完 --}}
var parseErp = function(erp) {
	var html = '';
	erp = erp || {};
	$('#erpDateShipped').text(erp.dateShipped ? ' ' + erp.dateShipped : '');
	$.each(erp.salesMonths || [], function(i, sum) {
		var datePaid = sum.datePaid;
		var j, k;
		
		for (j in sum.pmAmounts) {
			html += '<tr class="alert-info">'
			html += '<tr class="alert-info">'
				+ '<td class="tableexport-string">' + datePaid + '</td>'
				+ '<td>' + datePaid +' 月各付款方式總營收' + '</td>'
				+ '<td>' + '' + '</td>'
				+ '<td>' + j + '</td>'
				+ '<td>' + '' + '</td>'
				+ '<td>' + (sum.pmAmounts[j].salesAmount + sum.pmAmounts[j].advanceAmount) + '</td>'
				+ '<td>' + sum.pmAmounts[j].salesAmount + '</td>'
				+ '<td>' + sum.pmAmounts[j].advanceAmount + '</td>'
				+ '<td>' + (sum.pmAmounts[j].salesTotal + sum.pmAmounts[j].advanceTotal) + '</td>'
				+ '<td>' + sum.pmAmounts[j].salesTotal + '</td>'
				+ '<td>' + sum.pmAmounts[j].advanceTotal + '</td>'
				+ '</tr>';
		}
		html += '<tr class="alert-warning">'
		+ '<td class="tableexport-string">' + datePaid + '</td>'
		+ '<td>' + datePaid + ' 月總營收' + '</td>'
		+ '<td>' + '' + '</td>'
		+ '<td>' + '' + '</td>'
		+ '<td>' + '' + '</td>'
		+ '<td>' + (sum.salesAmount + sum.advanceAmount) + '</td>'
		+ '<td>' + sum.salesAmount + '</td>'
		+ '<td>' + sum.advanceAmount + '</td>'
		+ '<td>' + (sum.salesTotal + sum.advanceTotal) + '</td>'
		+ '<td>' + sum.salesTotal + '</td>'
		+ '<td>' + sum.advanceTotal + '</td>'
		+ '</tr>';

		for (j in sum.groupBuys) {
			var gb = sum.groupBuys[j];
			for (k in gb.details) {
				var detail = gb.details[k];
				var ds = detail.dateShipped || '';
				html += '<tr>'
					+ '<td class="tableexport-string">' + detail.datePaid + '</td>'
					+ '<td class="tableexport-string">' + detail.title + '</td>'
					+ '<td class="tableexport-string">' + ds + '</td>'
					+ '<td>' + detail.paymentMethod + '</td>'
					+ '<td>' + detail.shippingState + '</td>'
					+ '<td>' + detail.amount + '</td>'
					+ '<td>' + (ds ? detail.amount : '') + '</td>'
					+ '<td>' + (ds ? '' : detail.amount) + '</td>'
					+ '<td>' + detail.orderTotal + '</td>'
					+ '<td>' + (ds ? detail.orderTotal : '') + '</td>'
					+ '<td>' + (ds ? '' : detail.orderTotal) + '</td>'
					+ '</tr>';
			}
			html += '<tr class="alert-success">'
				+ '<td class="tableexport-string">' + datePaid + '</td>'
				+ '<td class="tableexport-string">' + gb.title + '</td>'
				+ '<td>' + '' + '</td>'
				+ '<td>' + '' + '</td>'
				+ '<td>' + '' + '</td>'
				+ '<td>' + '' + '</td>'
				+ '<td>' + gb.salesAmount + '</td>'
				+ '<td>' + gb.advanceAmount + '</td>'
				+ '<td>' + '' + '</td>'
				+ '<td>' + gb.salesTotal + '</td>'
				+ '<td>' + gb.advanceTotal + '</td>'
				+ '</tr>';
		}
	});
	$('#erpTable tbody').html(html);
}

var dailyData = function(mm) {
	var pm = $('input[name=paymentMethod]:checked').serialize();
	$.ajax({
		type:'POST',
		async: true,
		url: '{{baseUrl}}/ajax/GroupBuy/getErpSalesReport?' + pm ,
		dataType: 'json',
		data: {
			yymm:mm,
			featureTagMain:$('#featureTagMain').prop("checked"),
		}
	})
	.done(function (json) {
		parseErp(json.data);
		$('.tableexport-caption').remove();
		$("#erpTable").tableExport({filename:'abc',formats:['xlsx'],position:'top'});
	});
}

$(document).ready(function() {
	{{!-- 推導：預設載入本月、「更新」重新查詢 --}}
	dailyData('');
	$('#btnErpUpdate').click(function() {
		dailyData('');
	});
});
</script>
