<form name="ItemForm" method="post" action="/backend/Item/exportItemSalesReport.do" class="form-horizontal" id="ItemSalesReportForm"><div class="modal-header">
	<h3>團購 &raquo; 匯出銷售商品總表</h3>
	<button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
</div>
<div class="modal-body">
	<div class="modal-message"></div>
	<p>匯出期間內依據商品代號分類的商品報表</p>
	<p>最多匯出跨越兩個月資料</p>
	<div class="form-group row">
		<label class="col-sm-4 control-label" for="dateStart">開始時間</label>
		<div class="col-sm-8">
			<input type="text" id="dateStart" name="dateStart" class="required  form-control" required>
			<script type="text/javascript">
			$(function () {
				$('#dateStart').datetimepicker({format:"YYYY-MM-DD"});
			});
			</script>
		</div>
	</div>
	<div class="form-group row">
		<label class="col-sm-4 control-label" for="dateEnd">結束時間</label>
		<div class="col-sm-8">
			<input type="text" id="dateEnd" name="dateEnd" class="required  form-control" required>
			<script type="text/javascript">
			$(function () {
				$('#dateEnd').datetimepicker({format:"YYYY-MM-DD"});
			});
			</script>
		</div>
	</div>
	<div class="form-group row" id="row-groupBuyId">
		<label class="col-sm-4 control-label" for="state">選擇表單</label>
		<div class="col-sm-8">
		<select id="groupBuyId" class="form-control" name="groupBuyId"></select>
		</div>
	</div>
	<div class="form-group row" id="exportBy">
		<label class="col-sm-4 control-label" for="state">匯出依照</label>
		<div class="col-sm-8">
		<select class="form-control" id="exportBy" name="exportBy">
		<option value="GROUP_BUY">團購日期</option>
		<option value="UUID">訂單日期</option>
		<option value="INVOICE">發票日期</option>
		<option value="SHIPPED">出貨回壓日期</option>
		</select>
		</div>
	</div>

	<div class="form-group row" id="backOrder-group">
		<label class="col-sm-4 control-label" for="backOrder">訂單庫存狀態</label>
		<div class="col-sm-8">
		<select class="form-control" id="backOrder" name="backOrder">
		<option value="">不限</option>
		<option value="0">現貨</option>
		<option value="1">預購</option>
		</select>
		</div>
	</div>

	<div class="form-group row" id="shipped-group">
		<label class="col-sm-4 control-label" for="shipped">已出貨狀態</label>
		<div class="col-sm-8">
		<select class="form-control" id="shipped" name="shipped">
		<option value="">不限</option>
		<option value="0">未出貨</option>
		<option value="1">已出貨</option>
		</select>
		</div>
	</div>

	<div class="form-group row" id="toErpFormat-group">
		<label class=" col-sm-4">ERP格式</label>
		<div class="col-sm-8">
		 <input type="checkbox" name="toErpFormat" id="toErpFormat" value="1" class="form-check-input"/>
		<label class=" form-check-input" for="toErpFormat">ERP格式</label>
		</div>
	</div>

</div> <!-- modal-body -->

<div class="progress">
	<div class="progress-bar" role="progressbar"></div>
</div>
<div class="modal-footer">
	<button class="btn btn-default" data-dismiss="modal">關閉</button>
	<input id="submitButton" name="submitButton" type="submit" class="btn btn-primary" value="送出" />
</div>
</form><script>
var form = 'ItemSalesReportForm';
$('#'+form).validate();
$('#'+form).submit(function(){
	if ($('#'+form).valid()) {
		var $btn = $('#'+form).find('input[type=submit]');
		$btn.val('送出中...')
		{{!-- 推導：一般表單 POST 下載檔案後頁面不換頁，數秒後還原按鈕 --}}
		setTimeout(function() { $btn.val('送出'); }, 3000);
		return true;
	} else {
		return false;
	}
});
$('#groupBuyId').select2ForGroupBuy({
	width:'100%',
	multiple:true
});
</script>
