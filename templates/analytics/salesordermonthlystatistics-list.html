<script type="text/javascript" class="init">

	$(document).ready(function() {
		var tableName = '#statisticsTable';
		var editor = new $.fn.dataTable.Editor( {
			ajax: {
				create: {
					type: 'POST',
					url:  '{{baseUrl}}/ajax/SalesOrderMonthlyStatistics/save.do?'
				},
				edit: {
					type: 'POST',
					url:  '{{baseUrl}}/ajax/SalesOrderMonthlyStatistics/update.do?salesOrderMonthlyStatisticsId=_id_'
				},
				remove: {
					type: 'POST',
					url:  '{{baseUrl}}/ajax/SalesOrderMonthlyStatistics/delete.do?salesOrderMonthlyStatisticsId=_id_'
				}
			},
			table: tableName,
			idSrc: 'salesOrderMonthlyStatisticsId',
			fields: [

			],
			//template: '#custom_rp_form',
			formOptions:DataTableConfig.formOptions,
			i18n:DataTableConfig.i18n,
		} );

		var table = $(tableName).DataTable( {
			dom: 'lBrtip',
			serverSide:true,
			processing:true,
			scrollX:true,
			"lengthMenu": [10, 25, 50, 100, 250],
			ajax: {
				url:'{{baseUrl}}/ajax/SalesOrderMonthlyStatistics/list.do',
				type: "POST",
				data:function ( d ) {
					d.month = $('#month').val();
					d.amountTotalGreater = $('#amountTotalGreater').val();
					d.amountTotalLess = $('#amountTotalLess').val();
					d.amountMaxGreater = $('#amountMaxGreater').val();
					d.amountMaxLess = $('#amountMaxLess').val();
					d.countOrderValidGreater = $('#countOrderValidGreater').val();
					d.countOrderValidLess = $('#countOrderValidLess').val();
					return d;
				}
			},
			language:DataTableConfig.i18n,
			columns:[
				//DataTableConfig.data_select_checkbox,
				DataTableConfig.data_input('name'),
				DataTableConfig.data_input('email'),
				DataTableConfig.data_input('telephone'),
				DataTableConfig.data_input('amountTotal'),
				DataTableConfig.data_input('amountMax'),
				DataTableConfig.data_input('countOrderValid'),
			],
			columnDefs: [
				{ "orderable": false, "targets": [0, 1, 2] }
			],
			keys: DataTableConfig.keysInlineTab,
			"order": [[ 3, "desc" ]],
			select: DataTableConfig.selectOptionsOS,
			buttons: [
				{ extend: 'excel' },
				//{ extend: 'create', editor: editor },
				//{ extend: 'edit',   editor: editor },
				//{ extend: 'remove', editor: editor, className:'btn-danger' },
			],
			initComplete: function () {
				DataTableConfig.initFooterSearch(this, [],[]);
			},
			drawCallback: function (settings) {
				$(".dataTables_scrollBody").floatingScroll();
			}
		} );

		initDatetimePicker('#month', 'YYYYMM', 'months');
		$('#btn-search').click(function() {
			table.clear().ajax.reload();
		});
	} ); // end ready
</script>
