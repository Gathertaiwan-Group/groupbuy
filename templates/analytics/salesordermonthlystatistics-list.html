<!--#head-->
{{> core/partials/dte-style.html}}
<script type="text/javascript" class="init">
	{{!-- 推導：原站此段被擷取過濾；依 spec 後文（Editor ajax 設定、表格 #statisticsTable）補上開頭 --}}
	$(document).ready(function() {
		var tableName = '#statisticsTable';
		var editor = new $.fn.dataTable.Editor( {
			ajax: {
				create: {
					type: 'POST',
					url:  '{{baseUrl}}/ajax/SalesOrderMonthlyStatistics/save.do?'
				},
				edit: {
					type: 'POST',
					url:  '{{baseUrl}}/ajax/SalesOrderMonthlyStatistics/update.do?salesOrderMonthlyStatisticsId=_id_'
				},
				remove: {
					type: 'POST',
					url:  '{{baseUrl}}/ajax/SalesOrderMonthlyStatistics/delete.do?salesOrderMonthlyStatisticsId=_id_'
				}
			},
			table: tableName,
			idSrc: 'salesOrderMonthlyStatisticsId',
			fields: [
				DataTableConfig.field_input('姓名', 'name'),
				DataTableConfig.field_input('電子信箱', 'email'),
				DataTableConfig.field_input('電話', 'telephone'),
				DataTableConfig.field_input('消費總金額', 'amountTotal'),
				DataTableConfig.field_input('單筆最高金額', 'amountMax'),
				DataTableConfig.field_input('訂單數量', 'countOrderValid'),
			]
		} );

		var table = $(tableName).DataTable( {
			dom: 'lBrtip',
			serverSide:true,
			processing:true,
			scrollX:true,
			"lengthMenu": [10, 25, 50, 100, 250],
			ajax: {
				url: '{{baseUrl}}/ajax/SalesOrderMonthlyStatistics/list.do',
				type: 'POST',
				data: function(d) {
					$('#queryForm .filters').each(function() {
						d[this.name] = $(this).val();
					});
				}
			},
			columns: [
				DataTableConfig.data_input('name'),
				DataTableConfig.data_input('email'),
				DataTableConfig.data_input('telephone'),
				DataTableConfig.data_input_number('amountTotal'),
				DataTableConfig.data_input_number('amountMax'),
				DataTableConfig.data_input_number('countOrderValid'),
			],
			keys: DataTableConfig.keysInlineTab,
			//ordering: false,
			"order": [[ 3, "desc" ]],
			columnDefs: [ { orderable: false, targets: [0,1,2] }],
			select: false,
			buttons: [
				'excel',
				//{ extend: 'create', editor: editor },
				//{ extend: 'edit',   editor: editor },
				//{ extend: 'remove', editor: editor, className:'btn-danger' },
			],
			{{!-- 推導：原站此段被擷取過濾；姓名／電子信箱／電話三欄用表尾搜尋 --}}
			initComplete: function () {
				DataTableConfig.initFooterSearch(this, [0, 1, 2], [10, 20, 12]);
			}
		} );

		{{!-- 推導：月份選擇器與查詢按鈕 --}}
		initDatetimePicker('#month', 'YYYY-MM', 'months');
		$('#btn-search').click(function() {
			table.ajax.reload();
		});
		{{!-- 推導：下載＝以同一組篩選送出 #queryForm（csrf.js 會自動補隱藏欄位 _csrf） --}}
		$('.btn-download').click(function() {
			$('#downloadFormat').val($(this).data('format'));
			$('#query').val(table.search() || '');
			$('#queryForm').submit();
		});
		$('#queryForm .filters').on('keypress', function(e) {
			if (e.which == 13) {
				e.preventDefault();
				table.ajax.reload();
			}
		});
	} ); // end ready
</script>
