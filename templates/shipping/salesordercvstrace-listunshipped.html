{{> core/partials/dte-style.html}}{{> shipping/partials/cvs-trace-table.html}}<script type="text/javascript" class="init">
	$(document).ready(function () {
		cvsTracePage.build({
			url: '{{baseUrl}}/ajax/SalesOrderCVSTrace/listUnshipped.do',
			lengthMenu: [100],
			pageLength: 100,
			columns: [
				DataTableConfig.data_select_checkbox,
				DataTableConfig.data_input('dateCreatedString'),
				DataTableConfig.data_input('uuid'),
				DataTableConfig.data_select('salesOrderStatus'),
				DataTableConfig.data_select('paymentMethod')
			],
			columnDefs: [ { orderable: false, targets: [3] } ],
			buttons: [
				DataTableConfig.actionButton({
					text: '設為已完成',
					confirm: '將訂單設為已完成，並不會發送出貨通知信也不會開立發票，是否繼續？',
					url: '{{baseUrl}}/ajax/SalesOrderCVSTrace/markAsComplete'
				}),
				{
					extend: 'selected',
					text: '開立電子發票',
					action: function (e, dt) {
						var ids = $.map(dt.rows({ selected: true }).data().toArray(), function (r) { return r.salesOrderId; });
						openForm('{{baseUrl}}/ajax/Invoice/displayIssueInvoice.do', 'salesOrderIds=' + ids.join(','));
					}
				}
			]
		});
	});
</script>
