<!-- 匯出貨運清單（本站設計）：依 SPEC 7.4——選匯出目的（出貨／回壓訂單）、訂單範圍、發送出貨信、現貨／預購預計出貨日、物流商格式（貨運標籤）。
     原站此彈窗的內容未合法取得，版面與欄位名稱為推導，見 docs/modules/shipping.md。 -->
<style>
#ShippingCSVForm legend { font-size: 1.1rem; font-weight: 500; margin-top: 16px; border: none; }
#ShippingCSVForm .form-group { margin-left: 12px; }
#ShippingCSVForm .purpose-option { border: 1px solid #dee2e6; border-radius: 6px; padding: 10px 14px; margin-bottom: 8px; cursor: pointer; }
#ShippingCSVForm .purpose-option.active { border-color: #4285f4; background: #f3f7ff; }
#exportCountBox .preview-uuid { font-family: monospace; }
</style>
<div class="modal-header">
	<h5>團購 &raquo; 匯出貨運清單</h5>
	<button type="button" class="close" data-dismiss="modal" aria-label="關閉"><span aria-hidden="true">&times;</span></button>
</div>
<form id="ShippingCSVForm" class="form-horizontal" onsubmit="return false;">
<input type="hidden" name="groupBuyId" value="{{groupBuyId}}">
<div class="modal-body">
	<div class="modal-message"></div>
	{{#if groupBuyTitle}}
	<p class="mb-1">匯出團購：<b>{{groupBuyTitle}}</b></p>
	{{else}}
	<p class="mb-1 text-danger">未指定團購：請指定訂單日期區間（最多 {{maxDays}} 天），可匯出多個團購的訂單。</p>
	{{/if}}

	<legend>匯出目的</legend>
	<div class="form-group">
		<label class="purpose-option active d-block" for="purposeShip">
			<input type="radio" class="form-check-input" name="purpose" id="purposeShip" value="SHIP" checked>
			<span class="pl-4"><b>出貨</b>：匯出後會將訂單更新為已出貨，並保存出貨紀錄（可在「匯出紀錄」還原）</span>
		</label>
		<label class="purpose-option d-block" for="purposeExportOnly">
			<input type="radio" class="form-check-input" name="purpose" id="purposeExportOnly" value="EXPORT_ONLY">
			<span class="pl-4"><b>回壓訂單</b>：系統不會對既有訂單做任何更新，只保存匯出紀錄與檔案</span>
		</label>
	</div>

	<legend>訂單範圍</legend>
	<div class="form-group">
		<div class="row mb-2" id="orderFilterRow">
			<label class="col-lg-4">篩選</label>
			<div class="col-lg-8">
				<select class="form-control" name="orderFilter">
					<option value="UNSHIPPED">尚未出貨（含準備出貨中）</option>
					<option value="ALL">所有訂單</option>
				</select>
				<small class="text-muted">「出貨」只會匯出尚未出貨的訂單</small>
			</div>
		</div>
		<div class="row mb-2">
			<label class="col-lg-4">訂單日期</label>
			<div class="col-lg-8 form-inline">
				<input type="date" name="dateBegin" class="form-control"{{#unless groupBuyId}} value="{{monthAgo}}"{{/unless}}>
				<span class="mx-2">~</span>
				<input type="date" name="dateEnd" class="form-control"{{#unless groupBuyId}} value="{{today}}"{{/unless}}>
			</div>
		</div>
		<div class="row mb-2">
			<label class="col-lg-4">配送方式</label>
			<div class="col-lg-8">
				<select class="form-control" name="shippingType">
					<option value="">不限</option>
					{{#each shippingTypes}}<option value="{{value}}">{{label}}</option>{{/each}}
				</select>
			</div>
		</div>
		<div class="row mb-2">
			<label class="col-lg-4">現貨／預購</label>
			<div class="col-lg-8">
				<select class="form-control" name="backOrder">
					{{#each backOrders}}<option value="{{value}}">{{label}}</option>{{/each}}
				</select>
			</div>
		</div>
		<div class="row mb-2">
			<label class="col-lg-4">付款狀態</label>
			<div class="col-lg-8">
				<select class="form-control" name="payStatus">
					<option value="PAID_OR_COD">已付款或貨到付款</option>
					<option value="PAID">已付款</option>
					<option value="UNPAID">未付款</option>
					<option value="ALL">不限</option>
				</select>
			</div>
		</div>
	</div>

	<legend>物流商格式</legend>
	<div class="form-group">
		<div class="row mb-2">
			<label class="col-lg-4">貨運標籤</label>
			<div class="col-lg-8">
				<select class="form-control" name="shippingTag">
					<option value="">不指定（標準格式、所有標籤訂單）</option>
					{{#each shippingTags}}<option value="{{tag}}">{{title}}（{{tag}}）</option>{{/each}}
				</select>
				<small class="text-muted">指定時只匯出此貨運標籤的訂單，並依標籤的匯出格式產生檔案</small>
			</div>
		</div>
		<div class="row mb-2" id="sendShippingEmailRow">
			<label class="col-lg-4">出貨通知</label>
			<div class="col-lg-8">
				<input type="checkbox" class="form-check-input" name="sendShippingEmail" id="sendShippingEmail" value="on">
				<label class="form-check-label" for="sendShippingEmail">發送出貨信</label>
			</div>
		</div>
		<div class="row mb-2">
			<label class="col-lg-4">現貨預計出貨日</label>
			<div class="col-lg-8"><input type="date" name="dateExpectedShipping" class="form-control"></div>
		</div>
		<div class="row mb-2">
			<label class="col-lg-4">預購預計出貨日</label>
			<div class="col-lg-8"><input type="date" name="dateExpectedShippingBackOrder" class="form-control"></div>
		</div>
	</div>

	<legend>匯出設定</legend>
	<div class="form-group">
		<div class="row mb-2">
			<label class="col-lg-4">檔案格式</label>
			<div class="col-lg-8">
				<input type="radio" class="form-check-input" name="fileFormat" id="fileFormatXls" value="XLS" checked>
				<label class="form-check-label mr-4" for="fileFormatXls">Excel</label>
				<input type="radio" class="form-check-input" name="fileFormat" id="fileFormatCsv" value="CSV">
				<label class="form-check-label" for="fileFormatCsv">CSV</label>
			</div>
		</div>
		{{#if multipleGroupBuys}}
		<div class="row mb-2">
			<label class="col-lg-4">出貨紀錄</label>
			<div class="col-lg-8">
				<input type="checkbox" class="form-check-input" name="oneShippingRecord" id="oneShippingRecord" value="on">
				<label class="form-check-label" for="oneShippingRecord">多團彙整成一筆出貨紀錄（預設一團一筆）</label>
			</div>
		</div>
		{{/if}}
		{{#unless groupBuyId}}
		<div class="row mb-2">
			<label class="col-lg-4">出貨紀錄</label>
			<div class="col-lg-8">
				<input type="checkbox" class="form-check-input" name="oneShippingRecord" id="oneShippingRecord" value="on">
				<label class="form-check-label" for="oneShippingRecord">多團彙整成一筆出貨紀錄（預設一團一筆）</label>
			</div>
		</div>
		{{/unless}}
		<div class="row mb-2">
			<label class="col-lg-4">匯出數量</label>
			<div class="col-lg-8 form-inline">
				<input type="number" name="limit" class="form-control" min="1" max="{{maxExport}}" value="{{maxExport}}">
				<small class="text-muted ml-2">單次上限 {{maxExport}} 筆，依訂單日期舊到新</small>
			</div>
		</div>
	</div>
	<div id="exportCountBox" class="alert alert-info mb-0">計算中…</div>
</div>
<div class="modal-footer">
	<span class="help-block text-danger submit-error mr-auto"></span>
	<button type="button" class="btn btn-default" data-dismiss="modal">關閉</button>
	<button type="button" class="btn btn-primary" id="btnExportShipping">匯出</button>
</div>
</form>
<script>
(function () {
	var $form = $('#ShippingCSVForm');
	var esc = function (s) { return $('<div>').text(s == null ? '' : String(s)).html(); };
	var countTimer = null;
	var syncPurpose = function () {
		var ship = $form.find('input[name=purpose]:checked').val() === 'SHIP';
		$form.find('.purpose-option').removeClass('active');
		$form.find('input[name=purpose]:checked').closest('.purpose-option').addClass('active');
		$form.find('select[name=orderFilter]').prop('disabled', ship);
		if (ship) $form.find('select[name=orderFilter]').val('UNSHIPPED');
		$('#sendShippingEmailRow').toggle(ship);
	};
	var refreshCount = function () {
		clearTimeout(countTimer);
		countTimer = setTimeout(function () {
			$('#exportCountBox').removeClass('alert-danger').addClass('alert-info').text('計算中…');
			$.post('{{baseUrl}}/ajax/ShippingCSV/countOrders.do', $form.serialize(), null, 'json').done(function (res) {
				if (res.code && res.code !== 200) {
					$('#exportCountBox').removeClass('alert-info').addClass('alert-danger').text(res.error);
					return;
				}
				var html = '符合條件訂單：<b>' + res.recordsTotal + '</b> 筆（本次匯出 ' + res.exportTotal + ' 筆，' + res.groups + ' 個團購）';
				if (res.data && res.data.length) {
					html += '<div class="small mt-2">' + $.map(res.data, function (o) {
						return '<div><span class="preview-uuid">' + esc(o.uuid) + '</span>　' + esc(o.items) + '</div>';
					}).join('') + '</div>';
				}
				$('#exportCountBox').html(html);
			}).fail(function (xhr) {
				$('#exportCountBox').removeClass('alert-info').addClass('alert-danger').text((xhr.responseJSON && xhr.responseJSON.error) || '計算失敗');
			});
		}, 250);
	};
	var resultHtml = function (res) {
		var recs = (res.data && res.data.records) || [];
		var html = '<div class="alert alert-success">' + res.error + '</div><table class="table table-sm"><thead><tr><th>出貨紀錄</th><th>團購</th><th>訂單數</th><th>下載</th></tr></thead><tbody>';
		$.each(recs, function (i, r) {
			html += '<tr><td>#' + r.shippingRecordId + '</td><td>' + esc(r.groupBuyTitle) + '</td><td>' + r.orderCount + '</td><td>'
				+ '<button type="button" class="btn btn-primary btn-sm my-0" data-download="downloadShippingCsv" data-id="' + r.shippingRecordId + '">貨運清單</button>'
				+ '<button type="button" class="btn btn-default btn-sm my-0" data-download="exportItems" data-id="' + r.shippingRecordId + '">出貨商品</button>'
				+ '<button type="button" class="btn btn-default btn-sm my-0" data-download="exportLabel" data-id="' + r.shippingRecordId + '">地址單</button>'
				+ '<button type="button" class="btn btn-default btn-sm my-0" data-download="EXPORT_ERP" data-id="' + r.shippingRecordId + '">ERP報表1</button>'
				+ '</td></tr>';
		});
		var gbIds = String({{json groupBuyId}} || '');
		html += '</tbody></table><a href="/backend/ShippingRecord/export' + (gbIds && gbIds.indexOf(',') < 0 ? '?groupBuyId=' + encodeURIComponent(gbIds) : '') + '">前往匯出紀錄</a>';
		return html;
	};
	$form.on('change', 'input, select', function () {
		if (this.name === 'purpose') syncPurpose();
		refreshCount();
	});
	$form.on('click', '[data-download]', function () {
		var $f = $('<form method="POST" style="display:none"></form>').attr('action', '/backend/ShippingRecord/downloadFile');
		$f.append($('<input type="hidden" name="action">').val($(this).attr('data-download')));
		$f.append($('<input type="hidden" name="shippingRecordId">').val($(this).attr('data-id')));
		$f.appendTo('body').submit();
		setTimeout(function () { $f.remove(); }, 1000);
	});
	$('#btnExportShipping').on('click', function () {
		var $btn = $('#btnExportShipping');
		var ship = $form.find('input[name=purpose]:checked').val() === 'SHIP';
		if (ship && !confirm('匯出後符合條件的訂單會設為「已出貨」，是否繼續？')) return;
		$('.submit-error').text('');
		btnStartLoading($btn);
		$.post('{{baseUrl}}/ajax/ShippingCSV/exportOrders.do', $form.find(':input').prop('disabled', false).end().serialize(), null, 'json').done(function (res) {
			$form.find('.modal-body').html(resultHtml(res));
			$btn.hide();
			if (window.shippingRecordTable) window.shippingRecordTable.ajax.reload(null, false);
		}).fail(function (xhr) {
			$('.submit-error').text((xhr.responseJSON && xhr.responseJSON.error) || '匯出失敗');
			syncPurpose();
		}).always(function () {
			btnStopLoading($btn);
		});
	});
	syncPurpose();
	refreshCount();
}());
</script>
