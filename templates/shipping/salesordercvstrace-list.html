					{{> core/partials/dte-style.html}}{{> shipping/partials/cvs-trace-table.html}}<script type="text/javascript" class="init">
	$(document).ready(function () {
		var table = cvsTracePage.build({
			url: '{{baseUrl}}/ajax/SalesOrderCVSTrace/list.do',
			extraParams: function (params) {
				params.ignoreNotified = $('#ignoreNotified').is(':checked');
				params.shippingStatus = $('#shippingStatus').val() || 'ARRIVED';
			},
			columns: [
				DataTableConfig.data_select_checkbox,
				DataTableConfig.data_input('dateArrivedString'),
				DataTableConfig.data_input('uuid'),
				DataTableConfig.data_input('trackingNumber'),
				DataTableConfig.data_input('daysSinceArrivedAndNotPicked'),
				DataTableConfig.data_input('daysSinceReturning'),
				DataTableConfig.data_input('dateNotifiedString', '')
			],
			columnDefs: [ { orderable: false, targets: [0, 2, 3, 4, 5, 6] } ],
			buttons: [
				{
					extend: 'edit',
					text: '發送簡訊',
					action: function (e, dt) {
						smsManager.prepareSms(GBF.baseUrl + '/ajax/SalesOrderCVSTrace/sendSMS', dt, 'uuid');
					}
				},
				DataTableConfig.actionButton({
					text: '設為已收貨',
					confirm: '將訂單設為已收貨，是否繼續？',
					url: '{{baseUrl}}/ajax/SalesOrderCVSTrace/markAsPicked'
				})
			]
		});
		table.column(5).visible(false); // 退件天數（逾期未取退回中頁籤才顯示）
		$('.filters').on('change', function () {
			table.clear().ajax.reload();
		});
	});
</script>

				<script>
					$(function () {
						// 頁籤：到店未取（ARRIVED）／逾期未取退回中（RETURNING）；依頁籤切換欄位與按鈕
						$('#orderTypeTabs a[data-toggle="tab"]').on('shown.bs.tab', function (e) {
							var status = $(e.target).attr('data-status') || 'ARRIVED';
							var arrived = status !== 'RETURNING';
							var t = window.salesOrderCVSTraceTable;
							$('#shippingStatus').val(status);
							t.column(4).visible(arrived);
							t.column(5).visible(!arrived);
							t.column(6).visible(arrived);
							$('#ignoreNotified-group').toggle(arrived);
							$(t.buttons().nodes()).toggle(arrived);
							t.clear().ajax.reload();
						});
						// 本月／上月 CVS 未取退貨率
						$.getJSON(GBF.baseUrl + '/ajax/SalesOrderCVSTrace/getCvsReturnStats', function (res) {
							if (!res || !res.data) return;
							$('#thisMonthRate').text(res.data.thisMonthRate);
							$('#lastMonthRate').text(res.data.lastMonthRate);
							$('#cvsReturnStats').show();
						});
					});
					</script>
