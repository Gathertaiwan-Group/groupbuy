var isTWExisted = function() {
	var countryList = $('#DTE_Field_flatRateShippingSettings-shippingCountry').val();
	if (countryList == undefined)
		return false;
	
	// workaround for older version
	if (countryList.length == 0)
		return true;
		
    for (var i = 0; i < countryList.length; i++) {
        if (countryList[i] == 'TW')
            return true;
    }
    return false;
}

var matchExtended = function(val) {
	for (var i=0 ; i<extendedAreas.length ; i++) {
		if (extendedAreas[i] == val)
			return true;
	}
	return false;	
}

var matchExtendedFromSelect = function(val) {
	var matched = false;
	$('input[name^="DTE_Field_flatRateShippingSettings-extendedAreas\\[\\]_"]').each(function(){
		if ($(this).prop('checked') == false)
			return;
		if ($(this).val() == val)
			matched  = true;
	});
	
	return matched;
}

var matchIsland = function(val) {
	for (var i=0 ; i<islandAreas.length ; i++) {
		if (islandAreas[i] == val)
			return true;
	}
	return false;	
}

var shippingCountryFunc = function(countryList) {
    var getAllCountries = function() {
        var countries = [];
        $('#DTE_Field_flatRateShippingSettings-shippingCountry').find('option').each(function() {
            countries.push($(this).val());
        });
        return countries;
    }

    var updateShippingType = function(keepNormalOnly) {
        $('#DTE_Field_flatRateShippingSettings-shippingType').find('option').each(function() {
            if (keepNormalOnly) {
                if ($(this).val() == 'NORMAL')
                    $(this).prop('hidden', false);
                else
                    $(this).prop('hidden', true);
            } else {
                $(this).prop('hidden', false);
            }
        });

        if (keepNormalOnly) {
            $('#DTE_Field_shippingType').val('NORMAL').change();
        }
        
        if (isTWExisted()) {
        	$('#customForm5').prop('hidden', false);
        	$('#customForm6').prop('hidden', false);
        }
        else {
        	$('#customForm5').prop('hidden', true);
        	$('#customForm6').prop('hidden', true);
        }
    }

	var keepNormalOnly = false;
    if (countryList != undefined && countryList.length > 0) {
        countryList.forEach(function(item) {
            if (item != 'TW')
                keepNormalOnly = true;
        });    	
    }

    updateShippingType(keepNormalOnly);
}

var shippingTypeFunc = function(type) {
	if (type == 'EXCLUSIVE' || type == 'INCLUSIVE') {
		$('.DTE_Field_Name_selectAllExtendedAreas').prop('hidden', false);
		$('.DTE_Field_Name_selectAllIslandAreas').prop('hidden', false);
		$('#flatRateShippingSettings-shippingAreas-cb').prop('hidden', false);
		$('#flatRateShippingSettings-shippingAreas-cb').prev().prop('hidden', false);
		return;
	}
	
	$('.DTE_Field_Name_selectAllExtendedAreas').prop('hidden', true);
	$('.DTE_Field_Name_selectAllIslandAreas').prop('hidden', true);
	$('#flatRateShippingSettings-shippingAreas-cb').prop('hidden', true);
	$('#flatRateShippingSettings-shippingAreas-cb').prev().prop('hidden', true);	
}

var initExtendAreas = function() {
	if (extendedAreas.length == 0) {
		$('#DTE_Field_extendedAreas\\[\\]').find('option').each(function(){
			extendedAreas.push($(this).val());
		});		
	}
	//console.log(extendedAreas);
	$('#DTE_Field_extendedAreas\\[\\]').prop('disabled', true);
	$('#DTE_Field_extendedAreas\\[\\]').val(extendedAreas).change();
	
	$('input[name^="DTE_Field_flatRateShippingSettings-extendedAreas\\[\\]_"]').each(function(){
		if (matchExtended($(this).val())) {
			$(this).prop('checked', true);
			$(this).prop('disabled', true);
		}
	}).promise().done(function(){
		updateParentLabel('DTE_Field_flatRateShippingSettings-extendedAreas');	
	});
}

var initShipping = function(isCreate, editor) {

	if (isTWExisted()) {
    	$('#customForm5').prop('hidden', false);
    	$('#customForm6').prop('hidden', false);
    	
    }
    else {
    	$('#customForm5').prop('hidden', true);
    	$('#customForm6').prop('hidden', true);
    }
	
	if (isCreate || $('input[name="flatRateShippingSettings.shippingType"]:checked').val() == undefined) {
		$('#DTE_Field_flatRateShippingSettings-shippingType_0').prop('checked', true)
		shippingTypeFunc('NOT_USED');
	}
	
	// init country areas
	updateParentLabel('DTE_Field_flatRateShippingSettings-shippingAreas');
	
	ignoreSelectAllExtendedAreas = true;
	ignoreSelectAllIslandAreas = true;

	var allChecked = true;
	$('input[name^="DTE_Field_flatRateShippingSettings-shippingAreas\\[\\]_"]').each(function(){
		if (matchExtended($(this).val())) {
			if (!$(this).prop('checked'))
				allChecked = false;
		}
	}).promise().done(function(){
		$('#DTE_Field_selectAllExtendedAreas_0').prop('checked', allChecked);	
	});

	// for island
 	allChecked = true;
	$('input[name^="DTE_Field_flatRateShippingSettings-shippingAreas\\[\\]_"]').each(function(){
		if (matchIsland($(this).val())) {

		}

	});
	
	if (!isCreate) {
		editor.disable('shippingType');
	} else {
		editor.enable('shippingType');
	}
}

var disableAllPostcode = function(prefix, data, checked) {
	if (prefix != 'DTE_Field_flatRateShippingSettings-shippingAreas')
		return;
	
	var nested = data.parent().next();
	if (nested == undefined)
		return;
	
	nested.find('input[name^="' + prefix + '\\[\\]_"]').each(function(){
		$(this).prop('disabled', checked);			
	});
}

var updateParentLabel = function(prefix) {
	$('input[name^="' + prefix + '\\[\\]_"]').each(function(){
		if ($(this).parent().attr('class') == 'node-with-childen') {
			var nested = $(this).parent().next();
			if (nested == undefined)
				return;
			
			var hint = '';
			var count = 0;
			var totalCount = 0;
			var num = 6;
			nested.find('input[name^="' + prefix + '\\[\\]_"]').each(function(){
				totalCount++;
				if ($(this).prop('checked')) {
					count++;
					if (count < num) {
						hint += $(this).val();
						if (count < num - 1)
							hint += ',';
						else
							hint += '...';
					}
				}
			});

			if (count == 0) {
				hint = '';
				$(this).prop('checked', false);
				disableAllPostcode(prefix, $(this), false);
			}
			else if (totalCount == count) {
				hint = 'All';
				$(this).prop('checked', true);
				disableAllPostcode(prefix, $(this), true);
			}
			else {
				hint = '(' + count + ') ' + hint;
				$(this).prop('checked', false);
				disableAllPostcode(prefix, $(this), false);
			}
			
			$(this).next().find('span').text(hint);
		}
	});
}

var detectAutoSelect = function(val, checked) {
	//
	// audo select all for extended
	//
	if (matchExtended(val) && checked == false) {
		$('#DTE_Field_selectAllExtendedAreas_0').prop('checked', false);
	}
	else {
		var allChecked = true;
		$('input[name^="DTE_Field_flatRateShippingSettings-shippingAreas\\[\\]_"]').each(function(){
			if (matchExtended($(this).val())) {
				if (!$(this).prop('checked'))
					allChecked = false;
			}
		}).promise().done(function(){
			$('#DTE_Field_selectAllExtendedAreas_0').prop('checked', allChecked);	
		});
	}
	
	//
	// audo select all for island
	//
	if (matchIsland(val) && checked == false) {
		$('#DTE_Field_selectAllIslandAreas_0').prop('checked', false);
	}
	else {
		var allChecked = true;
		$('input[name^="DTE_Field_flatRateShippingSettings-shippingAreas\\[\\]_"]').each(function(){
			if (matchIsland($(this).val())) {
				if (!$(this).prop('checked'))
					allChecked = false;
			}
		}).promise().done(function(){
			$('#DTE_Field_selectAllIslandAreas_0').prop('checked', allChecked);	
		});
	}
}

var shippingAreaCount = function() {
	var count = 0;
	$('input[name^="DTE_Field_flatRateShippingSettings-shippingAreas\\[\\]_"]').each(function(){
		if ($(this).parent().attr('class') == 'node-with-childen') {
			return;
		}
		if ($(this).prop('disabled')) {
			return;
		}
		if ($(this).prop('checked')) {
			count++;
		}
	})
	return count;
}

var changeFunc = function(prefix, data) {	
	//$('#' + prefix + '\\[\\]_0').prop('checked', false);
	if (data.parent().attr('class') == 'node-with-childen') {
		var children = data.parent().next();
		children.find('.form-check-input').each(function(){
			var checked = data.prop('checked');
			var val = $(this).val();
			if (prefix.indexOf('extendedAreas') > 0) {
				extendedAreas.forEach(function(item){
					if (val == item) {
						checked = true;
					}
				});
			}
			
			$(this).prop('checked', checked);
		}).promise().done(function(){
			detectAutoSelect(data.val(), data.prop('checked'));
			updateParentLabel(prefix);	
		});
	}
	else {
		detectAutoSelect(data.val(), data.prop('checked'));
		updateParentLabel(prefix);
	}
	
	console.log(shippingAreaCount());
	if (shippingAreaCount() > 60) {
		if ((data.parent().attr('class') != 'node-with-childen') && data.prop('checked')) {
			alert('單獨選取的鄉鎮市數目太多');
			data.prop('checked', false);
		}
	}
}

var checkSubmitData = function(action, data) {
	// strip submit data
	Object.keys(data).forEach(function(groupBuyId){
		var item = data[groupBuyId];
		if (item.flatRateShippingSettings == undefined) {
			return;
		}

		item.flatRateShippingSettings.shippingCountry = $('#DTE_Field_flatRateShippingSettings-shippingCountry').val();
		if (item.flatRateShippingSettings.shippingCountry != undefined)
			item.flatRateShippingSettings['shippingCountry-many-count'] = item.flatRateShippingSettings.shippingCountry.length;
		
		item.flatRateShippingSettings.shippingType = $('input[name="flatRateShippingSettings.shippingType"]:checked').val();
			
		// refill item.flatRateShippingSettings.shippingAreas
		item.flatRateShippingSettings.shippingAreas = [];
		var totalCount = 0;
		var checkedCount = 0;
		var city = undefined;
		var areas = [];
		var appendShippingAreas = function() {
			//
			// E.g. 金門(17: from cityMay_js.jsp) ＝[896,894,890,891,892,893]
			// if checkedCount == totalCount(17)
			//    shippingAreas.push(17)  --> for reducing transmission dasta
			// else
		    //    shippingAreas.push(all checked area)
		    //
			if (city != undefined) {
				if (totalCount == checkedCount) {
					// all postcode were selected.
					if (cityMap[city] == undefined)
						return;
					item.flatRateShippingSettings.shippingAreas.push(cityMap[city]);
				}	
				else {
					areas.forEach(function(postcode){
						item.flatRateShippingSettings.shippingAreas.push(postcode);
					});
				}
			}
		}
		$('input[name^="DTE_Field_flatRateShippingSettings-shippingAreas\\[\\]_"]').each(function(){
			if ($(this).parent().attr('class') == 'node-with-childen') {
				appendShippingAreas();
				city = $(this).next().text().replace('All','');
				totalCount = 0;
				checkedCount = 0;
				areas = [];
			}
			else {
				totalCount++;
				if ($(this).prop('checked')) {
					checkedCount++;
					areas.push($(this).val());
				}
			}
		})
		appendShippingAreas();
		
		if (item.flatRateShippingSettings.extendedAreas) {
			//
			// default extendedAreas = [943,901,...]
			// extendedAreas = [540,943,901,...]
			// extendedAreas will remove all default extended area
			//
			
			extendedAreas.forEach(function(code){
				for (var i=0 ; i<item.flatRateShippingSettings.extendedAreas.length ; i++) {
					if (item.flatRateShippingSettings.extendedAreas[i] == code) {
						item.flatRateShippingSettings.extendedAreas.splice(i, 1);
						break;
					}
				}
			});
			
			item.flatRateShippingSettings['extendedAreas-many-count'] = item.flatRateShippingSettings.extendedAreas.length;
		}
	});	
}

var selectAllExtendedAreas = function(checked) {
	if (ignoreSelectAllExtendedAreas) {
		ignoreSelectAllExtendedAreas = false;
		return;
	}
	$('input[name^="DTE_Field_flatRateShippingSettings-shippingAreas\\[\\]_"]').each(function(){
		if (matchExtendedFromSelect($(this).val())) {
			$(this).prop('checked', checked);
		}
	}).promise().done(function(){
		updateParentLabel('DTE_Field_flatRateShippingSettings-shippingAreas');	
	});
}

var selectAllIslandAreas = function(checked) {
	if (ignoreSelectAllIslandAreas) {
		ignoreSelectAllIslandAreas = false;
		return;
	}
	$('input[name^="DTE_Field_flatRateShippingSettings-shippingAreas\\[\\]_"]').each(function(){
		if (matchIsland($(this).val())) {
			$(this).prop('checked', checked);
		}
	}).promise().done(function(){
		updateParentLabel('DTE_Field_flatRateShippingSettings-shippingAreas');	
	});
}

(function ($, DataTable) {

	if (!DataTable.ext.editorFields) {
		DataTable.ext.editorFields = {};
	}

	var Editor = DataTable.Editor;
	var _fieldTypes = DataTable.ext.editorFields;

	_fieldTypes.checkbox_tree = {
		_buildTree: function (root, data, tags) {
			var node = _fieldTypes.checkbox_tree._searchTree(root, tags, 0);
			node.data = data;
			return root;
		},
		_searchTree: function (root, tags, depth) {

			var targetNode = null;
			if (depth < tags.length && root.nodes != null) {
				for (var i = 0; i < root.nodes.length; i++) {
					var node = root.nodes[i];
					if (node.tag == tags[depth]) {
						if (depth < tags.length - 1) {
							targetNode = _fieldTypes.checkbox_tree._searchTree(node, tags, depth + 1);
						} else {
							targetNode = node;
						}
						break;
					}
				}
			}
			if (targetNode == null) {
				targetNode = { tag: tags[depth] };
				if (root.nodes == null) {
					root.nodes = [];
				}
				root.nodes.push(targetNode);
			}
			return targetNode;
		},
		_optionHtml: function (conf, label, val, i, clazz) {
			var safeId = Editor.safeId(conf.id) + '_' + i;
			var disabled = (val == null || val.length == 0);
			var disabledTag = disabled ? ' disabled' : '';
			var tag = disabled ? '' : val;
			var tagBadge = '<span class="badge badge-default ml-1" id="tag_' + safeId + '">' + tag + '</span>';
			return ('<span class="' + clazz + '"><input id="' + safeId + '" name="' + safeId + '" type="checkbox" value="' + val + '" class="form-check-input" >' +
				'<label for="' + safeId + '">' + label + tagBadge + '</label>' +
				'</span>');
		},
		_optionHtmls: function (conf, root, currentNode) {
			var html = '';
			var isRoot = (currentNode == null);
			if (isRoot) {
				root.index = 0;
				currentNode = root;
				html += '<ul class="mb-1 pl-3 pb-2">';
			}

			for (var i = 0; currentNode.nodes != null && i < currentNode.nodes.length; i++) {
				var node = currentNode.nodes[i];
				var childrenCount = (node.nodes != null) ? node.nodes.length : 0;
				html += '<li>';
				if (childrenCount > 0) {
					html += '<i class="fas fa-angle-right rotate mr-3"></i>';
				}
				var option = node.data;
				var clazz = (childrenCount) ? 'node-with-childen' : 'node-no-children';
				html += _fieldTypes.checkbox_tree._optionHtml(conf, option.label, option.value, root.index++, clazz);
				if (childrenCount > 0) {
					html += '<ul class="nested">';
					html += _fieldTypes.checkbox_tree._optionHtmls(conf, root, node);
					html += '</ul>';
				}
				html += '</li>';
			}
			if (isRoot) {
				html += '</ul>';
			}
			return html;
		},
		_addOptions: function (conf, options) {
			//var elOpts = conf._input[0].options;
			//elOpts.length = 0;
			if (options) {
				var html = '<ul class="mb-1 pl-3 pb-2">';

				var root = [];
				for (var i = 0, ien = options.length; i < ien; i++) {
					var option = options[i];
					var tags = option.type.split(',');
					root = _fieldTypes.checkbox_tree._buildTree(root, option, tags);
				}

				html = _fieldTypes.checkbox_tree._optionHtmls(conf, root, null);
				conf._input.html(html);
				conf._input.mdbTreeview();
			}
		},
		create: function (conf) {
			var that = this;

			conf._enabled = true;

			// Create the elements to use for the input
			conf._input = $('<div class="treeview"></div>');
			_fieldTypes.checkbox_tree._addOptions(conf, conf.options || conf.ipOpts);
			return conf._input;
		},
		update: function (conf, options) {
			conf.options = options;
			_fieldTypes.checkbox_tree._addOptions(conf, options);
		},
		get: function (conf) {
			return conf._input.find('input:checked').map(function () { return $(this).val(); }).get();
		},
		set: function (conf, val) {
			_fieldTypes.checkbox_tree._addOptions(conf, conf.options || conf.ipOpts);

			// special case to shipping areas
			if (conf.data == 'flatRateShippingSettings.shippingAreas[]' && val != '') {
				val.forEach(function (code) {
					var foundCity = undefined;
					Object.keys(cityMap).forEach(function (city) {
						if (cityMap[city] == code)
							foundCity = city;
					});

					if (foundCity != undefined) {
						Object.keys(twzipcode[foundCity]).forEach(function (district) {
							val.push(parseInt(twzipcode[foundCity][district]));
						});
					}
				});

			}

			if (val.length) {
				var isSelected = function (opts, val) {
					if (val == '')
						return false;

					for (var i = 0; i < opts.length; i++) {
						if (parseInt(opts[i].value) == val)
							return true;
					}
					return false;
				}
				for (var i = 0; i < val.length; i++) {
					if (isSelected(conf.options, val[i])) {
						$(conf._input).find("input[value='" + val[i] + "']").prop('checked', true);
					}
				}
			}
		},

		enable: function (conf) {
			conf._enabled = true;
			$(conf._input).removeClass('disabled');
		},

		disable: function (conf) {
			conf._enabled = false;
			$(conf._input).addClass('disabled');
		}
	};
})(jQuery, jQuery.fn.dataTable);

				'z': '滿足條件後基本運費 z',
				'islandFeeX': '外島滿足條件 x',
				'islandFeeY': '外島費用 y',
				'islandFeeZ': '滿足條件後外島費用 z',
				'fieldInfo': '',
			}
		},
		_fieldInfo: function (editor, labelToData, prefix) {
			// get field info of fields x|y|z, islandFeeX|Y|Z
			let message = '';
			const x = this._fieldValueInt(editor, prefix, 'x', 0);
			if (x <= 0) return message;
			const y = this._fieldValueInt(editor, prefix, 'y', 0);
			const z = this._fieldValueInt(editor, prefix, 'z', 0);
			const template = labelToData.fieldInfo;
			message += '模擬運費計算結果：<br>';
			message += template.replace('{0}', x).replace('{1}', y);
			message += '<br>';
			message += template.replace('{0}', x + 1).replace('{1}', z);
			return message;
		},
		_fieldValueInt: function(editor, prefix, name, defVal) {
			// get int value of fields x|y|z, islandFeeX|Y|Z
			const editorFieldName = this._fieldNameFunc(prefix, name);
			const editorFieldVal = editor.field(editorFieldName).val();
			const intVal = parseInt(editorFieldVal);
			if (isNaN(intVal)) return defVal;
			return intVal;
		},
		_fieldNameFunc: function(prefix, name) {
			// get field name of fields x|y|z, islandFeeX|Y|Z
			return !!prefix ? prefix + '' + name.toUpperCase() : name;
		},
		_calculateShippingFee: function (editor, prefix='') {
			// calculate shipping fee
			const categoryVal = editor.field('category').val();
			const labelToData = this.categoryLabels[categoryVal];
			return this._fieldInfo(editor, labelToData, prefix);
		},
		_buildMessagesObj: function (msg, prefix='', obj={}) {
			// build messages object for fields x|y|z, islandFeeX|Y|Z
			if (!obj.messages) obj.messages = {};
			if (prefix === '') {
				obj.messages.z = msg;
			} else {
				obj.messages.islandFeeZ = msg;
			}
			return obj;
		},
		_labels: function (categoryVal) {
			const labelToData = this.categoryLabels[categoryVal];
			return {
				labels: {
					'x': labelToData.x,
					'y': labelToData.y,
					'z': labelToData.z,
					'islandFeeX': labelToData.islandFeeX,
					'islandFeeY': labelToData.islandFeeY,
					'islandFeeZ': labelToData.islandFeeZ,
				}
			};
		},
		xyzReturnedOptions: function (editor, prefix='', obj={}) {
			// return value of dependent for fields x|y|z, islandFeeX|Y|Z
			// prefix is empty string or 'islandFee'
			const threshold = this._fieldValueInt(editor, prefix, 'x', 0);
			if (isNaN(threshold) || threshold <= 0) return {};
			const zMsg = this._calculateShippingFee(editor, prefix);
			return this._buildMessagesObj(zMsg, prefix, obj);
		},
		categoryReturnedOptions: function (editor) {
			const categoryVal = editor.val('category');
			const obj = {};//this._labels(categoryVal);
			this.xyzReturnedOptions(editor, '', obj);
			this.xyzReturnedOptions(editor, 'islandFee', obj);
			return obj;
		},
	}
};
</script>
