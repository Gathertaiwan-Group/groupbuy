/* ───────── 縣市鄉鎮勾選欄位（本站撰寫的 Editor 自訂欄位 checkbox_tree） ─────────
   選項格式 {label, value, type}：縣市節點 value 為空字串、type「01_縣市序」；鄉鎮 value 為郵遞區號、type「01_縣市序,02_鄉鎮序」。
   值為郵遞區號陣列；舊資料若存整個縣市的序號（cityMap），設定時展開成該縣市全部鄉鎮。 */
(function () {
	var types = $.fn.dataTable.ext.editorFields;
	var esc = function (s) { return $('<div>').text(s == null ? '' : String(s)).html(); };
	var refreshCities = function (conf) {
		conf._input.find('li.frs-city').each(function () {
			var $city = $(this);
			var $leaves = $city.find('input.frs-leaf');
			var picked = $leaves.filter(':checked');
			$city.find('input.frs-city-box').prop('checked', $leaves.length > 0 && picked.length === $leaves.length)
				.prop('indeterminate', picked.length > 0 && picked.length < $leaves.length);
			var hint = picked.length === 0 ? '' : picked.length === $leaves.length ? '全部' : '(' + picked.length + ') ' + picked.map(function () { return this.value; }).get().slice(0, 5).join(',') + (picked.length > 5 ? '…' : '');
			$city.find('.frs-city-hint').first().text(hint);
		});
	};
	types.checkbox_tree = {
		create: function (conf) {
			conf._input = $('<div class="treeview frs-tree"></div>');
			conf._input.on('change', 'input.frs-city-box', function () {
				$(this).closest('li.frs-city').find('input.frs-leaf:not(:disabled)').prop('checked', this.checked);
				refreshCities(conf);
				conf._input.trigger('frs:change');
			});
			conf._input.on('change', 'input.frs-leaf', function () {
				refreshCities(conf);
				conf._input.trigger('frs:change');
			});
			conf._input.on('click', '.frs-toggle', function () {
				$(this).closest('li.frs-city').children('ul').toggle();
				$(this).toggleClass('fa-angle-right fa-angle-down');
			});
			if (conf.options) types.checkbox_tree.update(conf, conf.options);
			return conf._input[0];
		},
		update: function (conf, options) {
			var current = types.checkbox_tree.get(conf);
			var cities = [];
			var byCity = {};
			$.each(options || [], function (i, o) {
				var key = String(o.type || '').split(',')[0];
				if (o.value === '' || o.value === null || o.value === undefined) {
					cities.push({ key: key, label: o.label });
					byCity[key] = byCity[key] || [];
				} else {
					(byCity[key] = byCity[key] || []).push(o);
				}
			});
			var base = $.fn.dataTable.Editor.safeId(conf.id);
			var html = '<ul class="list-unstyled mb-1 pl-2">';
			$.each(cities, function (ci, c) {
				html += '<li class="frs-city" data-city="' + esc(c.label) + '">'
					+ '<i class="fa fa-angle-right mr-2 frs-toggle" role="button"></i>'
					+ '<input type="checkbox" class="form-check-input frs-city-box" id="' + base + '_c' + ci + '">'
					+ '<label class="form-check-label" for="' + base + '_c' + ci + '">' + esc(c.label) + ' <span class="text-muted small frs-city-hint"></span></label>'
					+ '<ul class="list-unstyled pl-4 mb-1" style="display:none">';
				$.each(byCity[c.key] || [], function (li, o) {
					var id = base + '_' + ci + '_' + li;
					html += '<li class="d-inline-block mr-3"><input type="checkbox" class="form-check-input frs-leaf" name="' + base + '[]_' + ci + '_' + li + '" id="' + id + '" value="' + esc(o.value) + '">'
						+ '<label class="form-check-label" for="' + id + '">' + esc(o.label) + '</label></li>';
				});
				html += '</ul></li>';
			});
			conf._input.html(html + '</ul>');
			types.checkbox_tree.set(conf, current);
		},
		get: function (conf) {
			if (!conf._input) return [];
			return conf._input.find('input.frs-leaf:checked').map(function () { return this.value; }).get();
		},
		set: function (conf, val) {
			var list = Array.isArray(val) ? val : (val === null || val === undefined || val === '' ? [] : String(val).split(','));
			conf._input.find('input.frs-leaf').prop('checked', false);
			$.each(list, function (i, v) {
				v = String(v);
				var cityName = null;
				if (/^\d{1,2}$/.test(v)) {
					$.each(cityMap, function (name, idx) { if (String(idx) === v) cityName = name; });
				}
				if (cityName) {
					conf._input.find('li.frs-city').filter(function () { return $(this).attr('data-city') === cityName; }).find('input.frs-leaf').prop('checked', true);
				} else {
					conf._input.find('input.frs-leaf').filter(function () { return this.value === v; }).prop('checked', true);
				}
			});
			refreshCities(conf);
		},
		enable: function (conf) { conf._input.find('input').prop('disabled', false); },
		disable: function (conf) { conf._input.find('input').prop('disabled', true); }
	};
	window.frsTreeCheck = function (fieldNode, postcodes, checked) {
		var $tree = $(fieldNode).find('.frs-tree');
		$tree.find('input.frs-leaf').filter(function () { return postcodes.indexOf(this.value) >= 0; }).prop('checked', checked);
		$tree.find('input.frs-leaf').first().trigger('change');
	};
}());

	explain: function (editor, island) {
		var c = this.categoryText[editor.field('category').val()];
		var names = island ? ['islandFeeX', 'islandFeeY', 'islandFeeZ'] : ['x', 'y', 'z'];
		var num = function (n) { var v = parseFloat(editor.field(n).val()); return isNaN(v) ? 0 : v; };
		var x = num(names[0]);
		if (!c || x <= 0) return '';
		var each = c.per ? '每件' : '';
		return '試算：' + c.base + ' ' + x + c.unit + '（含）以內，' + each + '運費 ' + num(names[1]) + ' 元；超過 ' + x + c.unit + '，' + each + '運費 ' + num(names[2]) + ' 元';
	},
	labelsFor: function (category) {
		var c = this.categoryText[category];
		if (!c) {
			return { x: '滿足條件x:', y: '基本運費 y:', z: '滿足條件後基本運費 z:', islandFeeX: '外島滿足條件 x', islandFeeY: '外島費用 y', islandFeeZ: '滿足條件後外島費用 z' };
		}
		var each = c.per ? '每件' : '';
		return {
			x: c.base + '門檻 x:', y: c.base + '在門檻以內' + each + '運費 y:', z: c.base + '超過門檻' + each + '運費 z:',
			islandFeeX: '外島' + c.base + '門檻 x', islandFeeY: '外島' + c.base + '在門檻以內' + each + '費用 y', islandFeeZ: '外島' + c.base + '超過門檻' + each + '費用 z'
		};
	},
	setupDependents: function (editor) {
		var mgr = this;
		var podShown = function (values) {
			var has = function (list) { return $.inArray('PAY_ON_DELIVERY', list || []) >= 0; };
			return has(values['paymentMethods[]']) || has(values['islandPaymentMethods[]']);
		};
		var podResult = function (values) {
			var visible = [];
			if (podShown(values)) {
				visible.push('payOnDeliveryFee');
				if (parseFloat(values.payOnDeliveryFee) > 0) visible.push('flatRateShippingSettings.payOnDeliveryFee.tieredPricesString');
			}
			var hidden = $.grep(['payOnDeliveryFee', 'flatRateShippingSettings.payOnDeliveryFee.tieredPricesString'], function (n) { return $.inArray(n, visible) < 0; });
			return { show: visible, hide: hidden };
		};
		editor
			.dependent('shippingType', function (val, data) {
				var blocked = mgr.paymentRules[val] || [];
				$.each(['paymentMethods[]', 'islandPaymentMethods[]'], function (i, name) {
					var $boxes = $(editor.field(name).node()).find('input:checkbox');
					$boxes.prop('disabled', false);
					$boxes.filter(function () { return $.inArray(this.value, blocked) >= 0; }).prop('checked', false).prop('disabled', true);
				});
				var domestic = val === 'NORMAL' || val === 'CVS';
				$('#customForm3, #customForm5, #customForm6').toggle(domestic);
				$('button[jumpto=customForm3], button[jumpto=customForm5], button[jumpto=customForm6]').toggle(domestic);
				var show = [], hide = [], values = {};
				(val === 'CVS' ? show : hide).push('flatRateShippingSettings.cvsType');
				(val === 'PICKUP' ? show : hide).push('flatRateShippingSettings.tenantId');
				(val === 'NORMAL' ? show : hide).push('overseaFee');
				$.each(mgr.countryFields, function (i, n) { ((val === 'INTL' || (val === 'HK_SF' && n !== 'quickCountry')) ? show : hide).push(n); });
				if (val !== 'CVS') values['flatRateShippingSettings.cvsType'] = '';
				if (val !== 'PICKUP') values['flatRateShippingSettings.tenantId'] = '';
				if (val === 'HK_SF') values['flatRateShippingSettings.shippingCountry'] = ['HK'];
				return { show: show, hide: hide, values: values };
			})
			.dependent('paymentMethods[]', function (val, data) { return podResult(data.values); })
			.dependent('islandPaymentMethods[]', function (val, data) { return podResult(data.values); })
			.dependent('payOnDeliveryFee', function (val, data) { return podResult(data.values); }, { event: 'change keyup' })
			.dependent('category', function (val) {
				var free = val === 'STANDARD_FREE';
				return {
					labels: mgr.labelsFor(val),
					show: free ? [] : ['x', 'y', 'z'],
					hide: free ? ['x', 'y', 'z'] : [],
					messages: { z: mgr.explain(editor, false), islandFeeZ: mgr.explain(editor, true) }
				};
			})
			.dependent(['x', 'y', 'z'], function () { return { messages: { z: mgr.explain(editor, false) } }; }, { event: 'change keyup' })
			.dependent(['islandFeeX', 'islandFeeY', 'islandFeeZ'], function () { return { messages: { islandFeeZ: mgr.explain(editor, true) } }; }, { event: 'change keyup' })
			.dependent('quickCountry', function (val) {
				if (val === 'removeAll') return { values: { 'flatRateShippingSettings.shippingCountry': [] } };
				if (countriesByRegion[val]) return { values: { 'flatRateShippingSettings.shippingCountry': countriesByRegion[val] } };
				return {};
			})
			.dependent('flatRateShippingSettings.shippingType', function (val) {
				var limited = val === 'INCLUSIVE' || val === 'EXCLUSIVE';
				$('#flatRateShippingSettings-shippingAreas-cb').prev().toggle(limited);
				if (!limited) $('#flatRateShippingSettings-shippingAreas-cb').collapse('hide');
				var names = ['selectAllExtendedAreas', 'selectAllIslandAreas'];
				return limited ? { show: names } : { hide: names };
			})
			.dependent('selectAllExtendedAreas', function (val) {
				if (!mgr._opening) frsTreeCheck(editor.field('flatRateShippingSettings.shippingAreas[]').node(), mgr.extendedPostcodes(editor), !!Number(val));
				return {};
			})
			.dependent('selectAllIslandAreas', function (val) {
				if (!mgr._opening) frsTreeCheck(editor.field('flatRateShippingSettings.shippingAreas[]').node(), frsIslandPostcodes, !!Number(val));
				return {};
			});
	},
	extendedPostcodes: function (editor) {
		var opts = $(editor.field('extendedAreas[]').node()).find('option').map(function () { return this.value; }).get();
		return opts;
	},
	buildDataTable: function (tableName) {
		var mgr = this;
		mgr.tableName = tableName;
		var hidden = tableName === '#hiddenFlatRateShippingTable';
		if (hidden && $(tableName).length === 0) {
			var heads = ['', '排序', '名稱', '運費類型', '運費滿足條件', '[滿足條件x]', '[基本運費 y]', '[滿足條件後基本運費 z]', '貨到付款', '國外運費'];
			$('body').append('<div class="d-none"><table id="hiddenFlatRateShippingTable"><thead><tr>' + $.map(heads, function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead></table></div>');
		}
		var editor = new $.fn.dataTable.Editor({
			ajax: {
				create: { type: 'POST', url: mgr.createUrl },
				edit: { type: 'POST', url: '{{baseUrl}}/ajax/FlatRateShipping/update.do?flatRateShippingId=_id_' },
				remove: { type: 'POST', url: '{{baseUrl}}/ajax/FlatRateShipping/delete.do?flatRateShippingId=_id_' }
			},
			table: tableName,
			template: '#customForm',
			idSrc: 'flatRateShippingId',
			fields: mgr.fields(),
			formOptions: DataTableConfig.formOptions,
			i18n: DataTableConfig.i18n
		});
		mgr.setupDependents(editor);
		editor.on('open', function (e, mode, action) {
			if (mode !== 'main') return;
			var creating = action === 'create';
			mgr._opening = true;
			if (creating) {
				$(editor.field('paymentMethods[]').node()).find('input:checkbox:not(:disabled)').prop('checked', true).first().trigger('change');
				if (!editor.field('flatRateShippingSettings.shippingType').val()) editor.field('flatRateShippingSettings.shippingType').val('NOT_USED');
			}
			setTimeout(function () { editor.field('shippingType')[creating ? 'enable' : 'disable'](); }, 0);
			editor.field('extendedAreas[]').disable();
			editor.field('extendedAreas[]').val(mgr.extendedPostcodes(editor));
			setTimeout(function () { mgr._opening = false; }, 0);
		}).on('close', function () {
			editor.s.ajax.create.url = mgr.createUrl;
		});
		var table = $(tableName).DataTable({
			dom: 'Bfrtip',
			scrollX: true,
			serverSide: true,
			ajax: {
				url: GBF.baseUrl + (hidden ? '/ajax/FlatRateShipping/dList.do' : '/ajax/FlatRateShipping/list.do'),
				type: 'POST',
				data: function (params) {
					params.filterMode = $('#filterModeSelect').val() || '';
					return params;
				}
			},
			language: DataTableConfig.i18n,
			columns: [
				DataTableConfig.data_select_checkbox,
				DataTableConfig.data_input('seq'),
				{
					data: 'title',
					render: function (data, type, row) {
						if (type !== 'display') return data;
						var badges = [];
						if (row.maxDateEnd) badges.push('<span class="badge badge-' + (new Date(row.maxDateEnd) > new Date() ? 'warning' : 'info') + '">最後結團日:' + row.maxDateEnd + '</span>');
						else if (!row.inUse) badges.push('<span class="badge badge-warning">未使用</span>');
						var s = row.flatRateShippingSettings || {};
						if (s.shippingTag) badges.push('<span class="badge badge-info">' + $('<div>').text(s.shippingTag).html() + '</span>');
						if (row.couponX) badges.push('<span class="badge badge-info mr-1 mt-1">滿足條件x需搭配折扣碼</span>');
						var name = data ? $('<div>').text(data).html() : '[未命名]';
						return badges.length ? name + '<br>' + badges.join(' ') : name;
					}
				},
				{ data: 'shippingType', render: function (data) { return renderOption(table, data, 'shippingType'); } },
				{ data: 'category', render: function (data, type, row) { return row.categoryMessage || row.categoryString || data; } },
				DataTableConfig.data_input('x'),
				DataTableConfig.data_input('y'),
				DataTableConfig.data_input('z'),
				{ data: 'payOnDeliveryFee' },
				{ data: 'overseaFee' }
			],
			keys: DataTableConfig.keysInlineTab,
			order: [[1, 'asc']],
			select: DataTableConfig.selectOptionsOS,
			buttons: [
				{ extend: 'create', editor: editor },
				{ extend: 'edit', editor: editor },
				{
					extend: 'selectedSingle',
					text: '複製',
					action: function (e, dt) {
						var copied = editor.edit(dt.row({ selected: true }).index(), false).val();
						editor.create({ title: '複製', buttons: { label: '複製', className: 'btn-primary', action: function () { this.submit(); } } }).set(copied);
					}
				},
				{ extend: 'remove', editor: editor },
				DataTableConfig.actionButton({
					className: 'btn-unlink-association',
					text: '解除表單關聯',
					confirm: '確定要解除所選 {0} 個運費規則與已結團團購的關聯？',
					url: '{{baseUrl}}/ajax/FlatRateShipping/unlinkAssociation.do'
				})
			],
			initComplete: function () {
				$('.dataTables_scrollBody').floatingScroll();
				DataTableConfig.initFooterSearch(this, [3], [0]);
			}
		});
		// 「（非）配送國家」與「配送國家」共用同一組國家選項
		table.on('xhr.dt', function (e, settings, json) {
			if (json && json.options) json.options['flatRateShippingSettings.shippingCountryExcluded'] = json.options['flatRateShippingSettings.shippingCountry'];
		});
		injectDetailsControl(tableName, table);
		DataTableHelper.initEditorOnCallback(table, editor);
		if (!hidden) {
			DataTableHelper.inlineModePlugin(table);
			DataTableHelper.injectInline(table, editor);
		}
		DataTableHelper.injectQuickMenu(editor, 'customForm');
		$('#filterModeSelect').on('change', function () { table.ajax.reload(); });
		mgr.table = table;
		mgr.editor = editor;
		return mgr;
	},
	/* 單一規則編輯（團購運費頁）：以 dList 讀出該規則後開啟編輯器 */
	showEditor: function (flatRateShippingId) {
		if (!flatRateShippingId) return;
		var mgr = this;
		mgr.table.ajax.url(GBF.baseUrl + '/ajax/FlatRateShipping/dList.do?flatRateShippingId=' + encodeURIComponent(flatRateShippingId));
		mgr.table.ajax.reload(function () {
			mgr.editor.edit(mgr.table.row(0), true, { title: '編輯運費規則', buttons: '儲存' });
		});
	},
	/* 新增規則並同時綁定（arg.query：bindMode=1 綁團購／bindMode=2 綁品項；arg.fields：預填值） */
	showCreateEditor: function (arg) {
		arg = arg || {};
		this.editor.s.ajax.create.url = this.bindCreateUrl + '&' + $.param(arg.query || {});
		this.editor.create({ title: '新增', buttons: '新增' }).set(arg.fields || {});
	}
};
</script>
