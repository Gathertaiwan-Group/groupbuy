	var groupBuyFlatRateShippingTable;

	$(document).ready(function() {
		var groupBuyId = {{groupBuyId}};
		var tableName = '#groupBuyFlatRateShippingTable';
		var editor = new $.fn.dataTable.Editor( {
			ajax: {
				create: {
					type: 'POST',
					url:  '{{baseUrl}}/ajax/GroupBuyFlatRateShipping/save.do?' + 'groupBuyId=' + groupBuyId
				},
				remove: {
					type: 'POST',
					url:  '{{baseUrl}}/ajax/GroupBuyFlatRateShipping/delete.do?groupBuyFlatRateShippingId=_id_'
				}
			},
			table: tableName,
			idSrc: 'groupBuyFlatRateShippingId',
			fields: [
				//DataTableConfig.field_select2('團購運費規則:','flatRateShippingId','','選擇(輸入關鍵字)', GBF.baseUrl + '/ajax/Lookup/flatRateShipping', false),
				DataTableConfig.field_input('免運門檻(元或件)', 'x'),
				DataTableConfig.field_input('基本運費', 'y'),
				{
					label:'團購運費規則',
					name:'flatRateShippingId_2',
					type:'select2',
					opts: {
						multiple:false,
						inputClass:'input-large',
						placeholder:'選擇(輸入關鍵字)',
						dropdownAuthWidth:true,
						language:GBF.language,
						allowClear:true,
						ajax:{
							delay:350,
							url:GBF.baseUrl + '/ajax/Lookup/flatRateShipping',
							dataType:'json',
							data:function(d) {
								return {
									q:d.term,
									x:groupBuyFlatRateShippingEditor.field('x').val(),
									y:groupBuyFlatRateShippingEditor.field('y').val()
								}
							}
						},
					}
				}
			],
			template:'#groupBuyFlatRateShippingForm',
			formOptions:DataTableConfig.formOptions,
			i18n:DataTableConfig.i18n,
		} );

		var table = $(tableName).DataTable( {
			dom: 'Bt',
			//serverSide:true,
			processing:true,
			pageLength:50,
			//"lengthMenu": [10, 25, 50, 100, 250],
			ajax: {
				url:'{{baseUrl}}/ajax/GroupBuyFlatRateShipping/list.do',
				type: "POST",
				data: {
					groupBuyId:groupBuyId
				}
			},
			language:DataTableConfig.i18n,
			columns:[
				{
					data:'title',
					orderable:false,
					render: function ( data, type, row ) {
						var f = row.flatRateShippingForJson;
						var html = '<i class="fa-light fa-shipping-fast mr-1"></i>' + data;
						if (f.flatRateShippingSettings.shippingTag) {
							html += '<span class="badge badge-info ml-1 mt-1">貨運標籤 '+f.flatRateShippingSettings.shippingTag +'</span>';
						}
						if (f.flatRateShippingTag) {
							html += '<span class="badge badge-info ml-1 mt-1">運費標籤 '+f.flatRateShippingTag +'</span>';
						}
						html += '<br>';
						//html += '<span class="badge badge-default mr-1 mt-1">'+f.categoryString+'</span>';
						html += '<span class="badge badge-default mr-1 mt-1">'+f.categoryMessage+'</span>';
						html += '<br>';
						// html += '<span class="badge badge-default mr-1 mt-1">滿足條件x '+f.x+'</span>';
						// html += '<span class="badge badge-default mr-1 mt-1">基本運費 y '+f.y+'</span>';
						// html += '<span class="badge badge-default mr-1 mt-1">滿足條件後基本運費 z '+f.z+'</span>';
						// html += '<br>';
						if (f.x !== 0 && f.y !== 0 && f.z !== 0) {
							html += '<span class="badge badge-default mr-1 mt-1">滿足條件x '+f.x+'</span>';

							html += '<br>';
						}
						if (f.islandFeeX !== 0 && f.islandFeeY !== 0 && f.islandFeeZ !== 0) {
							html += '<span class="badge badge-default mr-1 mt-1">外島滿足條件 x '+f.islandFeeX+'</span>';
							html += '<span class="badge badge-default mr-1 mt-1">外島費用 y '+f.islandFeeY+'</span>';
							html += '<span class="badge badge-default mr-1 mt-1">滿足條件後外島費用 z '+f.islandFeeZ+'</span>';
						}
						if (f.couponX) {
							html += '<span class="badge badge-info mr-1 mt-1">滿足條件x需搭配折扣碼</span>';
						}
						html += '<span class="badge badge-success mr-1 mt-1">運費類型 '+f.shippingTypeString+'</span>';
						return html;
					}
				},
				{
					data:null,
					class:'inline-disabled',
					orderable:false,
					render: function ( data, type, row ) {
						var html = '';
						html += '<button class="btn btn-flat" data-action="remove"><i class="fa-light fa-trash-can"></i></button>'

						return html;
					}

				style: 'single'
			},

					}
				}

				$(".dataTables_scrollBody").floatingScroll();
			}

		//DataTableHelper.injectInline(table,editor);

		groupBuyFlatRateShippingEditor = editor;

			groupBuyFlatRateShippingTable.ajax.reload();
			groupBuyItemSetFlatRateShippingTable.ajax.reload();
		} );
		
		flatRateShippingPickerManager.initEditor();
		
		$(tableName +' tbody').on('click', 'button', function () {
			var tr = $(this).closest('tr');
			var row = table.row( tr );
			var groupBuyFlatRateShippingId = row.data().groupBuyFlatRateShippingId;
			var action = $(this).attr('data-action');
			if (action == null) return;
			
			switch (action) {
			case 'add':
			case 'remove':
				editor
				.title('確定刪除')
				.message('確定刪除')
				.buttons({label:'確定操作?', className:'btn-danger', action: function () {this.submit();}})
				.remove(row);
				break;
			case 'edit':
				flatRateShippingManager.showEditor(row.data().flatRateShippingId);
				break;
			}
			
		} );

		editor.on( 'preSubmit', function ( e, data, action ) {
			$.each( data.data, function ( key, values ) {
				data.data[ key ][ 'flatRateShippingId' ] = values['flatRateShippingId_2'];
				data.data[ key ][ 'flatRateShippingId_2' ] = null;
			} );
		} );
	}); // end ready

	const flatRateShippingPickerManager = {
		initEditor: function () {
			const tableName = '#groupBuyFlatRateShippingTable';
			const editor = new $.fn.dataTable.Editor({
				ajax: {
					create: {
						type: 'POST',
						url: GBF.baseUrl + '/ajax/GroupBuyFlatRateShipping/save.do',
						data: function (d) {
							d.groupBuyId = {{groupBuyId}};
						}
					},
					remove: {
						type: 'POST',
						url:  '{{baseUrl}}/ajax/GroupBuyFlatRateShipping/delete.do?groupBuyFlatRateShippingId=_id_'
					}
				},
				table: tableName,
				template: '#groupBuyFlatRateShippingPickerForm',
				fields: [
					DataTableConfig.field_input('免運門檻(元或件)', 'x'),
					DataTableConfig.field_input('基本運費', 'y'),
					DataTableConfig.field_input('滿足條件後基本運費 z:', 'z'),
					DataTableConfig.field_input('貨到付款:', 'payOnDeliveryFee'),
					DataTableConfig.field_select('運費類型:', 'shippingType'),
					{
						label: '團購運費規則',
						name: 'flatRateShippingId_3',
						type: 'select2',
						opts: {
							multiple: true,
							closeOnSelect: false,
							inputClass: 'input-large',
							placeholder: '選擇(輸入關鍵字)',
							dropdownAuthWidth: true,
							language: {
								noResults: function () {
									return $('<span>找不到符合的項目，請新增運費規則</span>');
								}
							},
							allowClear: true,
							ajax: {
								delay: 350,
								url: GBF.baseUrl + '/ajax/Lookup/flatRateShipping',
								dataType: 'json',
								data: function (d) {
									return {
										q: d.term,
										x: editor.field('x').val(),
										y: editor.field('y').val(),
										z: editor.field('z').val(),
										payOnDeliveryFee: editor.field('payOnDeliveryFee').val(),
										shippingType: editor.field('shippingType').val()
									};
								},
								processResults: function (data, param) {
									if (!data.results || data.results.length === 0) {
										$('.btn-new-shipping').removeClass('d-none');
									} else {
										$('.btn-new-shipping').addClass('d-none');
									}
									return data;
								}
							}
						}
					}
				]
			});
			
			editor.on( 'preSubmit', function ( e, data, action ) {
				$.each( data.data, function ( key, values ) {
					data.data[ key ][ 'flatRateShippingId' ] = values['flatRateShippingId_3'];
					delete data.data[ key ][ 'flatRateShippingId_3' ];
				} );
			} );

			this.editor = editor;
		},
		showCreateEditor: function () {
			const _editor = this.editor;
			_editor.create( {
				title: '新增',
				buttons: [
					{
						text: '新增運費規則',
						className: 'btn-danger btn-new-shipping d-none',
						action: function () {
							_editor.close();
							// Prepare for opening a new editor
							const fields = {};
							const x = _editor.field('x').val();
							const y = _editor.field('y').val();
							const z = _editor.field('z').val();
							const payOnDeliveryFee = _editor.field('payOnDeliveryFee').val();
							if (!!x && x.trim().length > 0) {
								fields.x = x;
							}
							if (!!y && y.trim().length > 0) {
								fields.y = y;
							}
							if (!!z && z.trim().length > 0) {
								fields.z = z;
							}
							if (!!payOnDeliveryFee && payOnDeliveryFee.trim().length > 0) {
								fields.payOnDeliveryFee = payOnDeliveryFee;
							}
							flatRateShippingManager.showCreateEditor( {
								query: {
									bindMode: 1,
									bGroupBuyId: {{groupBuyId}}
								},
								fields: fields
							} );
						} // end action of 'add new shipping button'
					},
					{
						text: '套用',
						className: 'btn-primary',
						action: function () {
							_editor.submit();
						}
					}
				] // end buttons
			} );
		}
	}

	function selectShippingAndBind() {
		flatRateShippingPickerManager.showCreateEditor();
	}

	function createShippingAndBind() {
		flatRateShippingManager.showCreateEditor({
			query: {
				bindMode: 1,
				bGroupBuyId: {{groupBuyId}}
			}
		} );
	}

							'<td>'+
							'<button class="btn btn-outline-dark btn-sm" data-action="add" data-flat-rate-shipping-id="'+flatRateShippingId+'">增加品項</button>'+
							'<button class="btn btn-flat text-danger btn-gbisfrs" data-action="removeGBISFRS" type="button" title="刪除運費規則"><i class="fa-light fa-trash-can"></i></button>'+
							'<button class="btn btn-flat btn-gbisfrs" data-action="edit"  data-flat-rate-shipping-id="'+flatRateShippingId+'" type="button" title="編輯運費規則"><i class="fa-light fa-pen-to-square"></i></button>'+
							'</td>'+
							'</tr>'
						);
						last = group;
					}
				});
				$(".dataTables_scrollBody").floatingScroll();
			}
		} );
		
		DataTableHelper.initEditorOnCallback(table,editor);
		//DataTableHelper.inlineModePlugin(table);
		//DataTableHelper.injectInline(table,editor);
		
		editor.on('close', function(e) {

			editor.field( 'flatRateShippingId' ).enable();
			$('#groupBuyItemSetFlatRateShippingForm-filter').show();
			editor.field( 'x' ).show();
			editor.field( 'y' ).show();
		})
		.on('submitSuccess', function(e, json, data, action) {
			if ('create' === action) {
				table.ajax.reload();
			}
		})
		;
		groupBuyItemSetFlatRateShippingTable = table;
		groupBuyItemSetFlatRateShippingEditor = editor;
		
		$(tableName +' tbody').on('click', 'button', function () {
			//var tr = $(this).closest('tr');
			//var row = table.row( tr );
			//var groupBuyItemSetFlatRateShippingId = row.data().groupBuyItemSetFlatRateShippingId;
			var action = $(this).attr('data-action');
			if (action == null) return;
			
			switch (action) {
			case 'add':
				var flatRateShippingId = $(this).data('flatRateShippingId');
				editor
				.create({
					title: '編輯',
					buttons: '編輯'
				})
				.set('flatRateShippingId', flatRateShippingId);
				editor.field( 'flatRateShippingId' ).disable();
				$('#groupBuyItemSetFlatRateShippingForm-filter').hide();
				editor.field( 'x' ).hide();
				editor.field( 'y' ).hide();
				return;
			case 'remove':
				var tr = $(this).closest('tr');
				var row = table.row( tr );
				editor
				.title('確定刪除')
				.message('確定刪除')
				.buttons({label:'確定操作?', className:'btn-danger', action: function () {this.submit();}})
				.remove(row);
				break;
			case 'edit':
				const frsId = $(this).data('flatRateShippingId');
				flatRateShippingManager.showEditor(frsId);
				break;
			case 'removeGBISFRS':
				const group = $(this).closest('tr');
				const removeRows = [];
				let _tr = group.next('tr');
				while (_tr.length && !_tr.hasClass('group')) {
					removeRows.push( table.row( _tr ).index() ); // data will be removed
					_tr = _tr.next('tr');
				}
				editor
				.title('刪除品項運費關聯')
				.message('確定要刪除？刪除動作會解除以下' + removeRows.length + '個品項和此運費之間的關聯')
				.buttons({label: '刪除', className: 'btn-danger', action: function () {this.submit();}})
				.remove( removeRows );
				;
				break;
			}
		} );
	} ); // end ready
</script>
