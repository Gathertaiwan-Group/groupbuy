<!--#head-->
<style>
.dataTables_scrollBody{min-height:480px;}
</style>
{{> core/partials/dte-style.html}}<script type="text/javascript" class="init">
	// 匯出出貨紀錄（本站撰寫）：欄位／按鈕依 SPEC 與 runtime；檔案下載、列印、訂單清單走本站端點。
	var shippingRecordPage = {
		groupBuyId: {{json gbParam}},
		escape: function (s) { return $('<div>').text(s == null ? '' : String(s)).html(); },
		postDownload: function (action, ids) {
			var $f = $('<form method="POST" style="display:none"></form>').attr('action', '/backend/ShippingRecord/downloadFile');
			$f.append($('<input type="hidden" name="action">').val(action));
			$f.append($('<input type="hidden" name="shippingRecordId">').val(ids));
			$f.appendTo('body').submit();
			setTimeout(function () { $f.remove(); }, 1000);
		},
		openWindow: function (path, id) {
			window.open(path + '?shippingRecordId=' + encodeURIComponent(id), '_blank');
		},
		undo: function (id, table) {
			if (!confirm('將此紀錄中由匯出設為「已出貨」、且尚未完成的訂單還原為匯出前的狀態，是否繼續？＊請先確認貨品尚未寄出，避免重複出貨＊')) return;
			$.ajax({
				url: '{{baseUrl}}/ajax/ShippingRecord/undo',
				data: { shippingRecordId: id },
				dataType: 'json'
			}).done(function (res) {
				messagebox('還原訂單狀態', res.error || res.message || '完成', '關閉');
				table.ajax.reload(null, false);
			}).fail(function (xhr) {
				messagebox('還原訂單狀態', (xhr.responseJSON && xhr.responseJSON.error) || ('連線失敗 ' + xhr.status), '關閉');
			});
		}
	};
	var shippingRecordTable;
	$(document).ready(function() {
		var page = shippingRecordPage;
		var tableSelector = '#shippingRecordTable';
		var erpLabels = ['ERP報表1', 'ERP報表2', 'ERP報表3', 'ERP報表4', 'ERP報表5', 'ERP報表6'];
		editor = new $.fn.dataTable.Editor( {
			ajax: {
				create: { type: 'POST', url: '{{baseUrl}}/ajax/ShippingRecord/save.do' },
				edit: { type: 'POST', url: '{{baseUrl}}/ajax/ShippingRecord/update.do?shippingRecordId=_id_' },
				remove: { type: 'POST', url: '{{baseUrl}}/ajax/ShippingRecord/delete.do?shippingRecordId=_id_' }
			},
			table: tableSelector,
			idSrc: 'shippingRecordId',
			fields: [
				DataTableConfig.field_input('標籤','tag')
			],
			formOptions: DataTableConfig.formOptions,
			i18n: DataTableConfig.i18n
		} );
		var table = $(tableSelector).DataTable( {
			dom: 'lBrtip',
			serverSide: true,
			processing: true,
			scrollX: true,
			lengthMenu: [10, 25, 50, 100, 250],
			ajax: {
				type: 'POST',
				url: '{{baseUrl}}/ajax/ShippingRecord/list.do',
				data: function (params) {
					params.groupBuyId = page.groupBuyId;
					params.excludeStateCompleted = $('#excludeStateCompleted').is(':checked');
					return params;
				}
			},
			language: DataTableConfig.i18n,
			columns: [
				DataTableConfig.data_select_checkbox,
				{
					data: 'dateExportedString',
					render: function (data, type, row) {
						if (type !== 'display') return data;
						var badge = function (text, cls) { return '<span class="ml-1 mt-1 badge ' + (cls || 'badge-default') + '">' + page.escape(text) + '</span>'; };
						var html = page.escape(data);
						html += '<br><span style="min-width:320px;max-width:640px;" class="text-wrap text-left ml-1 mt-1 badge badge-light">' + page.escape(row.groupBuyTitle || '多團彙整') + '</span><br>';
						html += badge('訂單數:' + (row.orderTotal || 0));
						html += badge(row.purpose === 'EXPORT_ONLY' ? '回壓訂單' : '出貨', row.purpose === 'EXPORT_ONLY' ? 'badge-light' : 'badge-primary');
						if (row.orderTotalShipped) html += badge('已出貨:' + row.orderTotalShipped);
						if (row.shippingDone) html += badge('已完成出貨', 'badge-info');
						if (row.backOrder !== null && row.backOrder !== undefined && String(row.backOrder) !== '-1') html += badge(renderOption(table, row.backOrder, 'backOrder'));
						if (row.shippingType) html += badge(renderOption(table, row.shippingType, 'shippingType'));
						if (row.shippingTag) html += badge(row.shippingTag);
						return html;
					}
				},
				DataTableConfig.data_input('tag', true, ''),
				{
					sortable: false,
					render: function (data, type, row) {
						var items = [
							['downloadShippingCsv', '下載貨運清單'], ['exportItems', '下載出貨商品'], ['exportLabel', '下載地址單'],
							['printItems', '列印出貨商品'], ['EXPORT_CSV', '匯出csv']
						];
						$.each(erpLabels, function (i, label) { items.push([i ? 'EXPORT_ERP' + (i + 1) : 'EXPORT_ERP', label]); });
						var menu = $.map(items, function (it) { return '<button class="dropdown-item" data-action="' + it[0] + '">' + it[1] + '</button>'; }).join('');
						var html = '<div class="btn-group" role="group"><div class="btn-group" role="group">'
							+ '<button type="button" class="btn btn-info dropdown-toggle" data-toggle="dropdown">匯出</button>'
							+ '<div class="dropdown-menu">' + menu + '</div></div>'
							+ '<button class="btn btn-default text-nowrap mt-0" data-action="showSalesOrders">訂單</button>';
						if (row.canUndo) html += '<button class="btn btn-warning text-nowrap mt-0" data-action="undo">還原訂單狀態</button>';
						return html + '</div>';
					}
				}
			],
			keys: DataTableConfig.keysInlineTab,
			order: [[ 1, 'desc' ]],
			select: DataTableConfig.selectOptionsOS,
			buttons: [
				{
					className: 'btn-primary buttons-export',
					text: '匯出貨運清單',
					action: function () {
						openFormF('/backend/ShippingCSV/exportShippingCSV', 'groupBuyId=' + encodeURIComponent(page.groupBuyId || ''));
					}
				},
				{ extend: 'edit', editor: editor },
				{ extend: 'remove', editor: editor },
				{
					extend: 'selected',
					text: '下載出貨商品',
					action: function (e, dt) {
						var ids = $.map(dt.rows({ selected: true }).data().toArray(), function (r) { return r.shippingRecordId; });
						page.postDownload('exportItems', ids.join(','));
					}
				}
			],
			initComplete: function () {
				DataTableConfig.initFooterSearch(this, [2], [16]);
			},
			drawCallback: function () {
				$('.dataTables_scrollBody').floatingScroll();
			}
		} );
		DataTableHelper.injectInline(table, editor, true);
		injectDetailsControl(tableSelector, table);
		window.shippingRecordTable = table;
		$(tableSelector + ' tbody').on('click', 'button[data-action]', function () {
			var clicked = $(this);
			var row = table.row(clicked.closest('tr')).data();
			if (!row) return;
			clicked.addClass('disabled');
			setTimeout(function () { clicked.removeClass('disabled'); }, 2000);
			var action = clicked.attr('data-action');
			if (action === 'printItems') page.openWindow('/backend/ShippingRecord/printShippingItems', row.shippingRecordId);
			else if (action === 'showSalesOrders') page.openWindow('/backend/ShippingRecord/orders', row.shippingRecordId);
			else if (action === 'undo') page.undo(row.shippingRecordId, table);
			else page.postDownload(action, row.shippingRecordId);
		});
		$('.filters').on('change', function () {
			table.clear().ajax.reload();
		});
	} );
</script>
