{{> core/partials/dte-style.html}}{{> shipping/partials/cvs-trace-table.html}}<script type="text/javascript" class="init">
	$(document).ready(function () {
		cvsTracePage.build({
			url: '{{baseUrl}}/ajax/SalesOrderCVSTrace/listPickup.do',
			columns: [
				DataTableConfig.data_select_checkbox,
				DataTableConfig.data_input('dateCreatedString'),
				DataTableConfig.data_input('uuid')
			],
			columnDefs: [ { orderable: false, targets: [3] } ],
			buttons: [
				{
					extend: 'edit',
					text: '發送簡訊',
					action: function (e, dt) {
						smsManager.prepareSms(GBF.baseUrl + '/ajax/SalesOrderCVSTrace/sendSMS', dt, 'uuid');
					}
				},
				DataTableConfig.actionButton({
					text: '設為已收貨',
					confirm: '將訂單設為已收貨，是否繼續？',
					url: '{{baseUrl}}/ajax/SalesOrderCVSTrace/markAsPicked'
				})
			]
		});
	});
</script>
