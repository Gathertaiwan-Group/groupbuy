{{> core/partials/dte-style.html}}<script type="text/javascript" class="init">
	
	var shippingTagTable;
	var editor; // use a global for the submit and return data rendering in the examples
	$.extend( true, $.fn.dataTable.defaults, {
		"searching": true,
		"pageLength":20,
	} );
	$(document).ready(function() {
		
		var tableName = '#example';
		editor = new $.fn.dataTable.Editor( {
			ajax: {
				create: {
					type: 'POST',
					url:  '{{baseUrl}}/ajax/ShippingTag/save.do?groupBuyAccountId={{tenantCode}}'
				},
				edit: {
					type: 'POST',
					url:  '{{baseUrl}}/ajax/ShippingTag/update.do?shippingTagId=_id_'
				},
				remove: {
					type: 'POST',
					url:  '{{baseUrl}}/ajax/ShippingTag/delete.do?shippingTagId=_id_'
				}
			},
			table: tableName,
			idSrc: 'shippingTagId',
			template: '#customForm',
			fields: [
				DataTableConfig.field_input('名稱', 'title'),
				DataTableConfig.field_select2('標籤:','tag','','選擇(輸入關鍵字)', GBF.baseUrl + '/ajax/ShippingTag/lookupTag', false, '', ''),
				DataTableConfig.field_input('新標籤:','tagInput'),
				DataTableConfig.field_checkbox_bool('使用新標籤:','isNewTag'),
				DataTableConfig.field_select('貨運提供商:','shippingProvider'),
				DataTableConfig.field_input('匯入貨運表-訂單編號標頭名稱', 'salesOrderUuid'),
				DataTableConfig.field_input('匯入貨運表-貨運編號標頭名稱', 'salesOrderShippingReceiptNumber'),
				DataTableConfig.field_textarea('自定義匯出格式', 'shippingExportFormat','範例：\n訂單號碼,訂購人姓名\norder.uuid,billing.name', 6),
				DataTableConfig.field_checkbox_bool('大型商品','shippingTagSettings.largeItem','0','設定為大型商品時會獨立出貨單，每箱最大單位超過會再拆單出貨'),
				DataTableConfig.field_input_f('每箱最大單位', 'shippingTagSettings.spacePerBox','設1時，1個宅配單只能有1個單位商品，設3時最多有3個單位商品，超過會再拆單。1件商品預設單位為1，可透過商品明細內的;商品重量設定單位數。'),
			],
			formOptions:DataTableConfig.formOptions,
			i18n:DataTableConfig.i18n,
		} );
	
		var table = $(tableName).DataTable( {
			dom: 'Bfrtip',
			scrollX:true,
			ajax: '{{baseUrl}}/ajax/ShippingTag/list.do',
			language:DataTableConfig.i18n,
			columns:[
				DataTableConfig.data_select_checkbox,
				DataTableConfig.data_input('title'),
				DataTableConfig.data_input('tag'),
				{ 
					data: 'shippingProvider',
					render: function ( data, type, row ) {
						return row.shippingProviderString;
					}
				},
				{ data: 'salesOrderUuid' },
				{ data: 'salesOrderShippingReceiptNumber' },
			],
			"order": [[ 2, "asc" ]],
			keys: DataTableConfig.keysInlineTab,
			select: DataTableConfig.selectOptionsOS,
			buttons: [
				{ extend: 'create', editor: editor },
				{ extend: 'edit',	editor: editor },
				{
					extend: "selectedSingle",
					text: '複製',
					action: function ( e, dt, node, config ) {
						// Place the selected row into edit mode (but hidden),
						// then get the values for all fields in the form
						var values = editor.edit(
							table.row( { selected: true } ).index(),
							false
						)
						.val();
						resetSalesOrder(values);
						// Create a new entry (discarding the previous edit) and
						// set the values from the read values
						editor
						.create( {
							title: '複製',
							buttons: {label:'複製', className:'btn-primary', action: function () {this.submit();}}
						} )
						.set( values );
					}
				},
				{ extend: 'remove', editor: editor, className:'btn-danger' },
			],
			initComplete: function () {
				$(".dataTables_scrollBody").floatingScroll();
			},
		} );
				
		editor
			.on( 'initCreate', function () {
				// Enable order for create
			//	editor.field( 'seq' ).enable();
				editor.field('salesOrderShippingReceiptNumber').message($('#tag-export').html());
			} )
			.on( 'initEdit', function () {
				// Disable for edit (re-ordering is performed by click and drag)
			//	editor.field( 'seq' ).disable();
				editor.field('salesOrderShippingReceiptNumber').message($('#tag-export').html());
			} )
			.on( 'preSubmit', function ( e, data, action ) {
				const keys = Object.keys(data.data);
				keys.forEach(function(key) {
					var obj = data.data[key];
					const tagInput = obj.tagInput;
					const isNewTag = obj.isNewTag;
					if ( Boolean( Number(isNewTag) ) ) {
						if (tagInput && tagInput.length) {
							obj.tag = tagInput;
						}
					}
				});
				return true;
			})
			.dependent( 'isNewTag', function (val, data, callback) {
				const isNewTag = Boolean(Number(val));
				if (isNewTag) {
					return { show: 'tagInput', hide: 'tag' };
				} else {
					return { show: 'tag', hide: 'tagInput' };
				}
			})
			.dependent( 'shippingTagSettings.largeItem', function (val, data, callback) {
				const b = Boolean(Number(val));
				if (b) {
					return { show: 'shippingTagSettings.spacePerBox' };
				} else {
					return { hide: 'shippingTagSettings.spacePerBox' };
				}
			})

		injectDetailsControl(tableName, table);
		DataTableHelper.initEditorOnCallback(table,editor);
		DataTableHelper.inlineModePlugin(table);
		DataTableHelper.injectInline(table,editor);
		
		DataTableHelper.injectXhrForJsonDefault(table, {
			'tagInput':'','isNewTag':0,
		});
		
		shippingTagTable = table;

	} ); // end ready
</script>

<script type="text/javascript">
	$('.btn-tag-export').each(function(i, obj) {
		$(obj).on('click', function () {
			$('#DTE_Field_shippingExportFormat').insertAtCaret($(this).attr('id')+",");
			$('#DTE_Field_prefValue').insertAtCaret($(this).attr('id')+",");
		});
	});
	jQuery.fn.extend({
	insertAtCaret: function(myValue){
		return this.each(function(i) {
		if (document.selection) {
			//For browsers like Internet Explorer
			this.focus();
			sel = document.selection.createRange();
			sel.text = myValue;
			this.focus();
		}
		else if (this.selectionStart || this.selectionStart == '0') {
			//For browsers like Firefox and Webkit based
			var startPos = this.selectionStart;
			var endPos = this.selectionEnd;
			var scrollTop = this.scrollTop;
			this.value = this.value.substring(0, startPos)+myValue+this.value.substring(endPos,this.value.length);
			this.focus();
			this.selectionStart = startPos + myValue.length;
			this.selectionEnd = startPos + myValue.length;
			this.scrollTop = scrollTop;
		} else {
			this.value += myValue;
			this.focus();
		}
		})
	}
	});
</script></div>
