<form id="downloadForm" method="post" action="{{baseUrl}}/ajax/wms/WarehouseInventory/download">
<input type="hidden" name="uids">
</form>
<script type="text/javascript">
$(function () {
	{{!-- 推導：原站此處片段因擷取過濾不可得（.form-detail 顯示）；select2 與按鈕事件依可見片段補寫 --}}
	$('#ItemForm').on('shown.bs.collapse', function () {
		$('.form-detail').show();
	});

	{{!-- 推導：inventory.js 以 #ItemForm .modal-message 顯示錯誤，原站頁面無此節點（錯誤不會顯示）→ 執行期補上，靜態 HTML 維持與原站相同 --}}
	if (!$('#ItemForm .modal-message').length) {
		$('#ItemForm > .card-header').after('<div class="modal-message px-3 pt-3" style="display:none"><div class="alert alert-warning mb-0 modal-message-alert-text"></div></div>');
	}
	inventoryManager.init('');

	$.fn.extend({
		select2ForWarehouseItem:function(type, multiple) {
			$(this).select2({
				width: 'auto',
				allowClear:true,
				inputClass:'input-large',
				placeholder:GBFi18n.select,
				dropdownAuthWidth:true,
				language:GBF.language,
				multiple:multiple,
				closeOnSelect:false,
				ajax: {
					delay:350,
					url: function() {
						return GBF.baseUrl + '/ajax/wms/WarehouseInventory/lookup';
					},
					dataType: 'json',
					data: function(data) {
						data = {
							iColumns:1,
							mDataProp_0:type,
							sSearch_0:data.term,
						}
						return data;
					}
				}
			});
		}
	});
	$('#fromUid').select2ForWarehouseItem('uid', false);
	$('#fromTitle').select2ForWarehouseItem('title', true);

	$('#addItemUid').on('click', function () {
		var uid = $('#fromUid').val();
		if (!uid) return;
		inventoryManager.addToTable(uid);
		$('#fromUid').val(null).trigger('change');
	});
	$('#addItemTitle').on('click', function () {
		var uids = $('#fromTitle').val();
		if (!uids || !uids.length) return;
		inventoryManager.addToTable(uids);
		$('#fromTitle').val(null).trigger('change');
	});
	$('#cleanItem').on('click', function () {
		inventoryManager.clean();
	});
});
</script>
