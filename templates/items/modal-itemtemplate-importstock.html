<form name="ItemTemplateForm" method="post" action="/ajax/ItemTemplate/importItemStock.do" class="form-horizontal" enctype="multipart/form-data" id="ItemTemplateForm"><input type="hidden" name="groupBuyId" value="{{groupBuyId}}" id="groupBuyId"><div class="modal-header">
		 <h5 class="modal-title">團購 &raquo; 匯入商品庫存</h5>
		<button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
	</div>
	<div class="modal-body">
	<div class="modal-message"></div>
	<div class="form-group row">
		<label class="control-label col-sm-4" for="imageFile">XLS檔案</label>
		<div class="controls col-sm-8">
			<input type="file" name="imageFile" value="" id="imageFile"></div>
	</div>
	</div> <!-- modal-body -->
	<div class="progress">
		<div class="progress-bar" role="progressbar"></div>
	</div>
	<div class="modal-footer">
		<button class="btn btn-default" data-dismiss="modal">關閉</button>
		<input id="submitButton" name="submitButton" type="submit" class="btn btn-primary" value="上傳" />
	</div>
</form><script>

var archiveOrderItemSuccess = function(data) {
	body = '沒有庫存需要更新';
	var dataArr = [];
	dataArr = data.data;
	if (dataArr.length > 0) {
		body = '';
	}
	for (i = 0; i < dataArr.length; i++) {
		log = dataArr[i];
		body += '<div class="row small">'
			+ '<div class="col-6">' + log.title + '</div>'
			+ '<div class="col-3">' + log.fieldString + '</div>'
			+ '<div class="col-3">' + log.oriValue + '->' + log.newValue + '</div>'
			+ '</div>'
			;
	}

	$('#myModal').modal('hide');
	messagebox('匯入商品庫存', body, '關閉');
}

var onSuccess = function(json) {
	$('#submitButton').attr('disabled', true);
	archiveOrderItemSuccess( json );
}
initAjaxForm('ItemTemplateForm', onSuccess);
</script>
{{> items/partials/xlsx-reader.html}}
