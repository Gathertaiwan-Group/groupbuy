<style>
#import_gbis_table_wrapper .dt-buttons.btn-group {top:0px;}
#import_gbis_table_wrapper .buttons-remove span::before {content: '';}
</style>
<script type="text/javascript">
var import_gbis_editor;
var import_gbis_table;

var import_gbis_table_name = '#import_gbis_table';
var i18n = DataTableConfig.i18n;
i18n.remove = {
	button: "複製",
	title:  "複製",
	submit: "複製",
	confirm: {
		_: "確定要複製這%d個品項?",
		1: "確定要複製這1個品項?",
	}
};
var appendData = function(d) {
	d.sameNameExists = $('#sameNameExists').val();
	d.replaceOption = $('#replaceOption').val();
	d.replacePrice = $('#replacePrice').prop('checked')
	d.replaceStock = $('#replaceStock').prop('checked')
	d.replaceDisplayInfo = $('#replaceDisplayInfo').prop('checked')
	d.replaceOthers = $('#replaceOthers').prop('checked')
	return d;
}

import_gbis_editor = new $.fn.dataTable.Editor( {
	idSrc:'groupBuyItemSetId',
	ajax: {
		remove: {
			type: 'POST',
			url: '{{baseUrl}}/ajax/GroupBuyItemSet/cloneGroupBuyItemSets.do?groupBuyItemSetId=_id_&groupBuyId={{groupBuyId}}',
			data: appendData
		}
	},
	table: import_gbis_table_name,
	fields: [
		DataTableConfig.field_input('品項名稱', 'itemSet.title')
	],
	i18n: i18n
} );

import_gbis_table = $(import_gbis_table_name).DataTable( {
	dom: 'Brtip',
	serverSide: true,
	processing: true,
	pageLength: 10,
	ajax: {
		type: 'POST',
		url: '{{baseUrl}}/ajax/GroupBuyItemSet/uniqueList.do',
		data: function ( d ) {
			d.expand = $('#expand').length == 0 || $('#expand').prop('checked') ? 1 : 0;
			d.main = $('#main').prop('checked') ? 1 : 0;
			d.groupBuyId = $('#fromGroupBuyId').val() || '';
			d.month = $('#month').length ? $('#month').val() : 1;
			d.sSearch = $('#sSearch').val() || '';
			return d;
		}
	},
	language:DataTableConfig.i18n,
	columns: [
		DataTableConfig.data_select_checkbox,
		{
			data: 'itemSet.title',
			render: function ( data, type, row ) {
				if (!data.length) data = '(未命名品項)';
				var html = $.fn.dataTable.render.text().display(data);
				if (type == 'display' && row.groupBuyTitle) html += '<span class="small text-muted ml-2">' + $.fn.dataTable.render.text().display(row.groupBuyTitle) + '</span>';
				return html;
			}
		}
	],
	order: [[ 1, "desc" ]],
	select: DataTableConfig.selectOptionsMulti,
	buttons: [
		{ extend: 'remove', text: '複製', editor: import_gbis_editor },
		{
			extend: "selected",
			className:'btn-shareStock',
			text: '複製(共用庫存)',
			action: function (e, dt, node, config) {
				main = $('#main').prop("checked");
				if (!main) {
					alert('複製(共用庫存)只能用於主表單品項，請先勾選「主表單品項」再選擇要複製的品項');
					return;
				}
				var count = dt.rows({ selected: true }).count();
				if (!confirm('確定要以共用庫存方式複製這' + count + '個品項?（新品項與原品項共用同一批商品，庫存一起扣）')) return;
				btnStartLoading(node);
				$.ajax({
					type: 'POST',
					url: '{{baseUrl}}/ajax/GroupBuyItemSet/cloneGroupBuyItemSets.do?groupBuyId={{groupBuyId}}&shareStock=true',
					data: appendData({ groupBuyItemSetId: joinIds('groupBuyItemSetId', dt, false) }),
					success: function (json) {
						btnStopLoading(node);
						modalShowSuccess($('#myModalContent'), json.error || json.message || '複製完成');
						dt.ajax.reload( null, false );
						if (typeof table != 'undefined' && table && table.ajax) table.ajax.reload( null, false );
					},
					error: function (xhr) {
						btnStopLoading(node);
						modalShowDanger($('#myModalContent'), (xhr.responseJSON && xhr.responseJSON.error) || '複製失敗');
					}
				});
			}
		}
	]
} );

import_gbis_editor
	.on( 'postRemove', function () {
		// After create or edit, a number of other rows might have been effected -
		// so we need to reload the table, keeping the paging in the current position
		import_gbis_table.ajax.reload( null, false );
		if (typeof table != 'undefined' && table && table.ajax) table.ajax.reload( null, false );
	} )
	.on( 'postSubmit', function ( e, json, data, action ) {
		if (action == 'remove' && json && !json.error && json.message) modalShowSuccess($('#myModalContent'), json.message);
	} );

var import_gbis_filter_html = '<div class="mb-2" id="import_gbis_filters">'
	+ '<div>'
	+ '<input type="checkbox" id="expand" class="filters form-check-input" value="1" checked><label class="pl-4 mr-2" for="expand">分開顯示相同名稱品項</label>'
	+ '<input type="checkbox" id="main" class="filters form-check-input" value="1"><label class="pl-4 mr-2" for="main">主表單品項</label>'
	+ '</div>'
	+ '<div class="input-group mt-2" id="groupBuyId-group">'
	+ '<span class="input-group-text">篩選團購</span>'
	+ '<select id="fromGroupBuyId" class="form-control w-auto"></select>'
	+ '<select id="month" class="filters form-control w-auto"><option value="-1" disabled>不限制期限</option><<option value="1">近1個月內品項</option><option value="3">近3個月內品項</option><option value="6">近半年內品項</option><option value="12">近1年內品項</option></select>'
	+ '<input type="text" id="sSearch" placeholder="輸入品項名稱" size=20 class="form-control filters w-auto"><button class="input-group-addon btn btn-flat" id="btn-search"><i class="fa-light fa-search"></i></button>'
	+ '</div>'
	+ '<div class="card mt-2">'
	+ '<div class="card-body">'
	+ '<div class="input-group">'
	+ '<span class="input-group-text">當同名稱品項已存在時</span>'
	+ '<select id="sameNameExists" class="form-control w-auto"><option value="ignore">略過不處理</option><option value="replace">覆蓋原品項</option><option value="create">建立新品項</option></select>'
	+ '</div>'
	+ '<div class="input-group mt-2 d-none" id="replace-group">'
	+ '<span class="input-group-text">遇到相同商品代號</span>'
	+ '<select id="replaceOption" class="form-control w-auto"><option value="ignore">略過不處理</option><option value="replace">替換以下資訊</option></select>'
	+ '</div>'
	+ '<div class="input-group mt-2 d-none" id="replaceOption-group">'
	+ '<input type="checkbox" id="replaceDisplayInfo" class=" form-check-input" value="1"><label class="pl-4 mr-2" for="replaceDisplayInfo">商品顯示資訊(名稱/敘述/圖片)</label>'
	+ '<input type="checkbox" id="replacePrice" class=" form-check-input" value="1"><label class="pl-4 mr-2" for="replacePrice">商品金額</label>'
	+ '<input type="checkbox" id="replaceOthers" class=" form-check-input" value="1"><label class="pl-4 mr-2" for="replaceOthers">其餘所有商品設定</label>'
	+ '<input type="checkbox" id="replaceStock" class=" form-check-input" value="1"><label class="pl-4 mr-2" for="replaceStock">商品庫存</label>'
	+ '</div>'
	+ '</div>'
	+ '</div>'
	+ '</div>';
$(import_gbis_filter_html).insertBefore(import_gbis_table_name + '_wrapper');

$('#sameNameExists').on('change', function() {
	var v = $(this).val();
	if (v == 'replace') {
		$('#replace-group').removeClass('d-none');
	} else {
		$('#replace-group').addClass('d-none');
		$('#replaceOption').val('ignore').trigger('change');
	}
});
$('#replaceOption').on('change', function() {
	var v = $(this).val();
	switch(v) {
	case 'ignore':
		$('#replaceOption-group').addClass('d-none');
		$('#replaceOption-group').find('input').prop('checked', false);
		break;
	case 'replace':
		$('#replaceOption-group').removeClass('d-none');
		break;
	}
});

$('input:checkbox.filters').on('change', function() {
	import_gbis_table.clear().ajax.reload();
	import_gbis_table.columns.adjust();
});
$('select.filters').on('change', function() {
	import_gbis_table.clear().ajax.reload();
	import_gbis_table.columns.adjust();
});

$('#btn-search').on('click', function() {
	if ($('#btn-search i').hasClass('fa-refresh')) return;
	import_gbis_table.clear().ajax.reload();
});
$('#sSearch').on('keydown', function(e) {
	if (e.keyCode == 13) {
		e.preventDefault();
		$('#btn-search').click();
	}
});
import_gbis_table
	.on('preXhr.dt', function() {
		$('#btn-search i').removeClass('fa-search').addClass('fa-refresh fa-spin');
	})
	.on('xhr.dt', function() {
		$('#btn-search i').removeClass('fa-refresh fa-spin').addClass('fa-search');
	});
$('#fromGroupBuyId').select2({
	placeholder: '全部團購',
	allowClear: true,
	width: '260px',
	dropdownParent: $('#myModal'),
	language: GBF.language,
	ajax: {
		url: GBF.baseUrl + '/ajax/Lookup/groupBuy',
		dataType: 'json',
		delay: 250,
		data: function(params) {
			return { q: params.term || '', page: params.page || 1 };
		}
	}
}).on('change', function() {
	var selected = !!$(this).val();
	$('#month option[value=-1]').prop('disabled', !selected);
	if (selected) $('#month').val('-1');
	else if ($('#month').val() == '-1') $('#month').val('1');
	import_gbis_table.clear().ajax.reload();
});
</script>

	<h5 class="modal-title">複製其他團購品項</h5>
	<button type="button" class="close" data-dismiss="modal" aria-hidden="true"><i class="fa-light fa-xmark"></i></button>
</div>

				<th></th>
				<th>品項名稱</th>
			</tr>
		</thead>

			<tr>
				<th></th>
				<th>品項名稱</th>
