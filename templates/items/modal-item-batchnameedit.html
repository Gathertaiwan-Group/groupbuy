<form name="ItemForm" method="post" action="/ajax/Item/batchNameEdit.do" class="form-horizontal" id="ItemForm"><input type="hidden" name="itemId" value="{{itemIds}}">
    <div class="modal-header">
        <h5>商品 &raquo; 批次改名 &raquo; 已選擇{{count}}個商品</h5>
        <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
    </div>
    <div class="modal-body">
    <div class="modal-message"></div>

    <div class="form-group">
        <label class="control-label col-lg-3" for="column">修改欄位</label>
        <div class="controls col-lg-9">
			<div class="form-check"><input type="checkbox" name="column" value="title" id="bde-title" class="form-check-input" checked><label class="h-100" for="bde-title">名稱<span class="badge badge-default">{{first.title}}</span></label></div>
			<div class="form-check"><input type="checkbox" name="column" value="shortNameDisplay" id="bde-shortNameDisplay" class="form-check-input"><label class="h-100" for="bde-shortNameDisplay">短名稱(表單顯示)<span class="badge badge-default">{{first.shortNameDisplay}}</span></label></div>
			<div class="form-check"><input type="checkbox" name="column" value="shortName" id="bde-shortName" class="form-check-input"><label class="h-100" for="bde-shortName">短名稱(出貨用)<span class="badge badge-default">{{first.shortName}}</span></label></div>
			<div class="form-check"><input type="checkbox" name="column" value="uid" id="bde-uid" class="form-check-input"><label class="h-100" for="bde-uid">商品代碼<span class="badge badge-default">{{first.uid}}</span></label></div>
			<div class="form-check"><input type="checkbox" name="column" value="tag" id="bde-tag" class="form-check-input"><label class="h-100" for="bde-tag">名稱標籤(#區隔)</label> <span class="badge badge-default">{{first.tag}}</span></div>
			<div class="form-check"><input type="checkbox" name="column" value="cateTag" id="bde-cateTag" class="form-check-input"><label class="h-100" for="bde-cateTag">分類標籤(#區隔)<span class="badge badge-default">{{first.cateTag}}</span></label></div>
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-lg-3" for="column">編輯方式</label>
        <div class="controls col-lg-9">
			<div class="form-check"><input type="radio" name="editType" value="replace" checked id="bde-replace" class="form-check-input"><label for="bde-replace">文字取代/刪除</label></div>
			<div class="form-check"><input type="radio" name="editType" value="prepend" id="bde-prepend" class="form-check-input"><label for="bde-prepend">文字加在前面</label></div>
			<div class="form-check"><input type="radio" name="editType" value="append" id="bde-append" class="form-check-input"><label for="bde-append">文字加在後面</label></div>
        </div>
    </div>

    <div class="form-group" id="oriText">
        <label class="control-label col-lg-3" for="oriText">要被取代的文字</label>
        <div class="controls col-lg-9">
			<input type="text" name="oriText" class="form-control">
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-lg-3" for="newText">新增文字</label>
        <div class="controls col-lg-9">
			<input type="text" name="newText" class="form-control">
        </div>
    </div>

    </div> <!-- modal-body -->
    <div class="progress">
        <div class="progress-bar" role="progressbar"></div>
    </div>
    <div class="modal-footer">
        <button class="btn btn-default" data-dismiss="modal">關閉</button>
        <input id="submitButton" name="submitButton" type="submit" class="btn btn-primary" value="更新" />
    </div>
</form><script>
var onSuccess = function(json) {
	table.ajax.reload(null, false);
	$('#myModal').modal('hide');
}

$(document).ready(function() {
	initAjaxForm('ItemForm', onSuccess);
	$('input:radio[name=editType]').on('change', function(e) {
		if (($(this).val() == 'replace'))
			$('#oriText').show();
		else
			$('#oriText').hide();
	});
});
</script>
