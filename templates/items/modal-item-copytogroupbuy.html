    <!-- 引入團購複製模組 -->
    <script>
        // 避免重複載入模組
        if (!window.GroupBuyCopyModule) {
            const script = document.createElement('script');
            script.src = '/modules/items/itemCopy.js?v=20250630';
            script.onload = function() {
                initializeGroupBuyCopyModal();
            };
            document.head.appendChild(script);
        } else {
            // 如果模組已經載入，直接初始化
            $(document).ready(function() {
                initializeGroupBuyCopyModal();
            });
        }

        /**
         * 初始化 Modal 中的團購複製功能
         */
        function initializeGroupBuyCopyModal() {
            const modalId = 'groupBuyCopyModal_' + Date.now(); // 使用時間戳創建唯一ID

            /**
             * 初始化團購複製功能
             * @param {string} tableName - DataTable的選擇器，例如 '#myTable'
             */
            window.initGroupBuyCopy = function(tableName = '#dataTable') {
                // 銷毀舊的模組實例（如果存在）
                if (window.groupBuyCopyModule) {
                    try {
                        window.groupBuyCopyModule.destroy();
                    } catch (e) {
                        console.warn('Error destroying previous module:', e);
                    }
                }

                // 創建新的模組實例
                window.groupBuyCopyModule = new GroupBuyCopyModule({
                    tableName: tableName,
                    modalId: modalId
                });

                // 初始化模組
                window.groupBuyCopyModule.init();

                console.log('GroupBuyCopyModule initialized with table:', tableName);
            };

            // 頁面載入完成後自動初始化
            $(document).ready(function() {
                // 如果有全局的 tableName 變數，使用它；否則使用預設值
                window.initGroupBuyCopy('#itemDataTable');
            });

            // 暴露獲取模組實例的函數
            window.getGroupBuyCopyModule = function() {
                return window.groupBuyCopyModule;
            };
        }
    </script>
