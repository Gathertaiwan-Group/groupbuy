<link rel="stylesheet" href="/modules/items/createWizard.css">

<div class="modal-header">
    <h5 class="modal-title" id="createWizardModalTitle">新增商品</h5>
    <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
</div>
<div class="modal-body">
    <div id="createWizardItemSetWrap" class="cw-itemset-wrap mb-3" style="display:none">
    <label for="createWizardItemSetSelect" class="cw-itemset-label">
        品項<span class="text-danger">*</span>
    </label>
    <select id="createWizardItemSetSelect" class="form-control" style="width: 100%;">
        <option value=""></option>
    </select>
    <div id="createWizardItemSetError" class="cw-itemset-error text-danger small mt-1" style="display:none"></div>
</div>

<div id="createWizardStep0">
    <p class="text-muted small">請選擇新增商品的方式</p>
    <div class="cw-choice-row">
        <button type="button" class="cw-choice-card" id="createWizardChoiceManual">
            <span class="cw-choice-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            </span>
            <span class="cw-choice-title">自行新增商品</span>
            <span class="cw-choice-descr">自行填寫商品名稱、售價、庫存等資訊</span>
        </button>
        <button type="button" class="cw-choice-card" id="createWizardChoiceUrl">
            <span class="cw-choice-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07L11.5 4.5"/><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.42-1.42"/></svg>
            </span>
            <span class="cw-choice-title">從網站新增</span>
            <span class="cw-choice-descr">貼上商品網頁網址，自動解析商品資訊</span>
        </button>
    </div>
</div>

<div class="row no-gutters" id="createWizardSteps" style="display:none">
    <div class="col-12 col-md-6 col-xl-4">
        <div class="cw-steps">
            <div class="cw-step is-active" data-cw-step="1">
                <span class="cw-step-node">1</span>
                <span class="cw-step-label">步驟一：輸入商品網頁網址</span>
            </div>
            <div class="cw-step-line" data-cw-step-line="1"></div>
            <div class="cw-step" data-cw-step="2">
                <span class="cw-step-node">2</span>
                <span class="cw-step-label">步驟二：確認即將建立的商品資料</span>
            </div>
        </div>
    </div>
</div>

<div id="createWizardStep1" style="display:none">
    <button type="button" class="cw-back-link" id="createWizardBackBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        返回</button>
    <p class="text-muted small">請輸入要解析的商品頁面網址，系統會自動讀取頁面中的商品資訊</p>
    <div class="cw-url-row">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07L11.5 4.5"/><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.42-1.42"/></svg>
        <input type="text" id="createWizardInput" placeholder="https://" aria-label="步驟一：輸入商品網頁網址" />
        <button id="createWizardUploadBtn" type="button" class="btn btn-primary">
            <span class="cw-btn-label">上傳</span>
        </button>
    </div>
    <div class="cw-skeleton" id="createWizardSkeleton">
        <div class="cw-skel-row"><div class="cw-skel-thumb"></div><div class="cw-skel-lines"><div class="cw-skel-line"></div><div class="cw-skel-line short"></div></div></div>
    </div>
    <div id="createWizardError"></div>
</div>

<div id="createWizardStep2" style="display:none">
    <p class="text-muted small">以下是解析出來的商品資訊，確認無誤後即可建立商品</p>

    <div class="cw-result-summary d-flex align-items-baseline justify-content-between mb-3">
        <span id="createWizardResultLabel">解析結果</span>
        <span class="cw-count" id="createWizardResultCount">共 0 件商品，可繼續新增或刪除</span>
    </div>

    <div class="cw-product-list" id="createWizardProductList"></div>

    <div class="cw-add-product-zone mt-3">
        <div id="createWizardAddOptions" class="cw-add-options" style="display:none">
            <div class="cw-add-options-header d-flex align-items-center justify-content-between mb-2">
                <span>新增商品</span>
                <button type="button" class="close cw-add-options-close" id="cwStep2OptionsClose" aria-label="Close">&times;</button>
            </div>
            <div class="cw-add-options-body">
                <div class="cw-url-row mb-2">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07L11.5 4.5"/><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.42-1.42"/></svg>
                    <input type="text" id="cwStep2UrlInput" placeholder="https://" aria-label="從網站新增" />
                    <button id="cwStep2UrlBtn" type="button" class="btn btn-primary btn-sm">
                        <span class="cw-btn-label">上傳</span>
                    </button>
                </div>
                <div id="cwStep2Error" class="cw-error my-2" style="display:none"></div>
                <div class="text-center text-muted small my-2">— or —</div>
                <button type="button" id="cwStep2ManualBtn" class="btn btn-outline-secondary btn-block btn-sm">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                    自行新增商品</button>
            </div>
        </div>

        <button type="button" id="createWizardAddProductBtn" class="cw-btn-add-product w-100">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            新增商品</button>
    </div>

    <div class="cw-create-bar">
        <div class="cw-progress-track"><div class="cw-progress-fill" id="createWizardProgressFill"></div></div>
        <span class="cw-progress-num" id="createWizardProgressNum">0 / 0</span>
        <button id="createWizardCreateBtn" type="button" class="btn btn-warning">
            <span class="cw-btn-label">建立商品</span>
        </button>
    </div>
</div>

<template id="createWizardProductTpl">
    <div class="cw-product-card">
        <button class="cw-icon-btn cw-delete-toggle cw-card-delete" title="刪除商品" type="button">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16Z"/></svg>
        </button>
        <div class="cw-product-thumb">
            <svg class="cw-thumb-placeholder" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
            <span class="cw-thumb-upload-label">上傳</span>
            <img alt="">
            <span class="cw-check">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
            </span>
            <span class="cw-fail-mark">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </span>
            <button type="button" class="cw-thumb-edit-badge" title="編輯商品圖片">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7l1.5-3h5L16 7"/><circle cx="12" cy="13.5" r="3"/></svg>
            </button>
        </div>
        <div class="cw-product-body">
            <div class="cw-product-top">
                <span class="cw-product-title"></span>
                <span class="cw-product-price"></span>
            </div>
            <div class="cw-product-subline">
                <span class="cw-product-meta"></span>
                <span class="cw-product-stock"></span>
            </div>
            <div class="cw-product-actions">
                <button class="cw-btn-edit-toggle cw-edit-toggle" title="編輯商品細項" type="button">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
                    <span class="cw-edit-toggle-label">編輯商品細項</span>
                </button>
                <span class="cw-status-pill pending">待建立</span>
            </div>
            <div class="cw-edit-row">
                <div class="cw-mini-field">
                    <label>圖片網址</label>
                    <input class="cw-image-input" type="text" placeholder="貼上圖片網址，或拖曳圖片至此" />
                </div>
                <div class="cw-mini-field">
                    <label>商品名稱</label>
                    <input class="cw-title-input" type="text" />
                </div>
                <div class="cw-field-row">
                    <div class="cw-mini-field">
                        <label>售價</label>
                        <div class="cw-mini-field-prefix"><span>NT$</span><input class="cw-price-input" type="text" inputmode="numeric" /></div>
                    </div>
                    <div class="cw-mini-field">
                        <label>現貨庫存</label>
                        <input class="cw-stock-input" type="text" inputmode="numeric" />
                    </div>
                    <div class="cw-mini-field">
                        <label>預購庫存</label>
                        <input class="cw-backorder-input" type="text" inputmode="numeric" />
                    </div>
                </div>
                <div class="cw-descr-zone">
                    <div class="cw-mini-field">
                        <label>商品說明圖 (可移除要發布的圖片)</label>
                        <div class="cw-descr-image-wall"></div>
                        <div class="cw-paste-zone" tabindex="0">
                            <span>找不到圖片？ 請在原商品頁選取包含圖片的區域複製後，點此處貼上 (Ctrl+V)，系統將自動擷取所有圖片。</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="cw-spec-zone"></div>
        </div>
    </div>
</template>

<!-- Full Image Lightbox Modal for Product Description Images -->
<div id="cwImageLightbox" class="cw-lightbox-overlay" aria-hidden="true">
    <div class="cw-lightbox-backdrop"></div>
    <div class="cw-lightbox-content">
        <button type="button" class="cw-lightbox-close" title="關閉">&times;</button>
        <div class="cw-lightbox-header">
            <span class="cw-lightbox-title">商品說明圖 (可移除要發布的圖片)</span>
            <span class="cw-lightbox-hint">（支援長圖垂直滾動）</span>
        </div>
        <div class="cw-lightbox-scroll">
            <img id="cwLightboxImg" src="" alt="原圖預覽">
        </div>
    </div>
</div>

<!-- Hover Floating Preview Popover -->
<div id="cwHoverPreview" class="cw-hover-preview-popover">
    <div class="cw-hover-preview-header">快速圖檔預覽</div>
    <div class="cw-hover-preview-body">
        <img id="cwHoverPreviewImg" src="" alt="預覽">
    </div>
    <div class="cw-hover-preview-footer">點擊可開啟全螢幕長圖檢視</div>
</div>
</div>
