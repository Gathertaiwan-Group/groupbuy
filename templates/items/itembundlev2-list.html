<!--#head-->
{{> core/partials/dte-style.html}}<script type="text/javascript" class="init">

			$(document).ready(function () {

				var tableName = '#rpTable';

				// We use Editor only for Delete (Remove) in this scenario, 
                // Create and Edit will be handled by custom pages.
                editor = new $.fn.dataTable.Editor({
                    ajax: {
                        remove: {
                            type: 'POST',
                            url: '/ajax/ItemBundleV2/delete.do?itemBundleId=_id_'
                        }
                    },
                    table: tableName,
                    idSrc: 'itemBundleId',
                    fields: [
                        // Fields are required for inline editing or editor modal, 
                        // but we are using custom pages for main editing.
                    ],
                    formOptions: DataTableConfig.formOptions,
                    i18n: DataTableConfig.i18n,
                });

                var table = $(tableName).DataTable({
                    dom: 'lBrtip',
                    serverSide: true,
                    processing: true,
                    scrollX: true,
                    "lengthMenu": [10, 25, 50, 100, 250],
                    ajax: {
                        url: '/ajax/ItemBundleV2/list?groupBuyId={{groupBuyId}}',
                        type: "POST",
                    },
                    language: DataTableConfig.i18n,
                    columns: [
                        DataTableConfig.data_select_checkbox,
                        {
                            data: 'title',
                            orderable: false,
                            render: function (data, type, row) {
                                data = $('<div>').text(data == null ? '' : data).html();
                                return '<div style="font-weight:500;min-width:180px;max-width:320px;text-wrap: auto;display: block;">' + data + '</div>';
                            }
                        },
                        {
                            data: null,
                            orderable: false,
                            render: function (data, type, row) {
                                var modeText = { ROOT: '僅顯示主商品', CHILD: '僅顯示子商品', BOTH: '顯示主商品 + 子商品' };
                                var allocText = { ROOT: '價格歸屬主商品', DISTRIBUTED: '價格均攤至子商品' };
                                var yesNo = function (v) {
                                    return v ? '<span class="badge badge-success">是</span>' : '<span class="badge badge-secondary">否</span>';
                                };
                                var html = '<div class="small" style="min-width:240px;line-height:1.8;">';
                                html += '<div>電子發票（列出子商品明細）：' + yesNo(row.invoiceShowDetail) + '</div>';
                                html += '<div>顧客訂單明細（顯示子商品明細）：' + yesNo(row.showBreakdown) + '</div>';
                                html += '<div>ERP 報表：' + (modeText[row.erpDisplayMode] || row.erpDisplayMode || '-') + '／' + (allocText[row.erpPriceAllocation] || row.erpPriceAllocation || '-') + '</div>';
                                html += '<div>出貨報表：' + (modeText[row.pickingDisplayMode] || row.pickingDisplayMode || '-') + '／' + (allocText[row.pickingPriceAllocation] || row.pickingPriceAllocation || '-') + '</div>';
                                html += '</div>';
                                return html;
                            }
                        },
                        {
                            data: null,
                            orderable: false,
                            render: function (data, type, row) {
                                var typeNames = { BUNDLE_FIXED: '成套組合', BUNDLE_PICK: '任選組合', BUNDLE_CONFIG: '配件組合', BUNDLE_BLIND: '盲盒/隨機', BUNDLE_CASCADE: '遞補/贈品', BUNDLE_ROUTER: '分流/路由' };
                                var esc = function (s) { return $('<div>').text(s == null ? '' : s).html(); };
                                var groups = (row.bundleConfig && row.bundleConfig.optionGroups) || [];
                                var html = '<div class="small" style="min-width:260px;max-width:460px;white-space:normal;">';
                                html += '<span class="badge badge-info mr-1">' + esc(typeNames[row.bundleType] || row.bundleType) + '</span>';
                                html += '<span class="badge badge-light border">售價 $' + esc(row.price) + '</span>';
                                groups.forEach(function (g) {
                                    var cands = (g.candidates || []).map(function (c) {
                                        return esc(c.name || c.originalTitle || ('#' + c.itemId)) + (c.defaultQty > 1 ? ' x' + c.defaultQty : '');
                                    });
                                    html += '<div class="mt-1"><strong>' + esc(g.groupTitle || '群組') + '</strong>（' + cands.length + ' 項）：' + (cands.length ? cands.join('、') : '<span class="text-muted">暫無商品</span>') + '</div>';
                                });
                                html += '</div>';
                                return html;
                            }
                        }
                    ],
                    keys: DataTableConfig.keysInlineTab,
                    "order": [[1, "desc"]],
                    select: DataTableConfig.selectOptionsOS,
                    buttons: [
                        {
                            text: '新增組合商品',
                            className: 'btn-primary',
                            action: function (e, dt, node, config) {
                                // Redirect to Create Page
                                window.location.href = '/backend/ItemBundleV2/create?groupBuyId={{groupBuyId}}';
                            }
                        },
                        {
                            extend: 'edit',
                            editor: editor,
                            text: '編輯',
                            action: function (e, dt, node, config) {
                                var row = dt.row({ selected: true }).data();
                                if (!row) {
                                    return;
                                }
                                // Redirect to Edit Page
                                window.location.href = '/backend/ItemBundleV2/edit?groupBuyId={{groupBuyId}}&itemBundleV2Id=' + row.itemBundleId;
                            }
                        },
                        // { extend: 'remove', editor: editor, className: 'btn-danger' },
                    ],
                    initComplete: function () {
                        //DataTableConfig.initFooterSearch(this, [1, 2, 3], [10, 20, 10]);
                    },
                    drawCallback: function (settings) {
                        $(".dataTables_scrollBody").floatingScroll();
                    }
                });

                DataTableHelper.initEditorOnCallback(table, editor);
                // DataTableHelper.inlineModePlugin(table); // Disable inline for now as we use full page
            }); // end ready
        </script>
