function syncStock(groupBuyId) {
	if (!confirm('確定操作?'))
		return;
	$.ajax({
		url: GBF.baseUrl + '/ajax/GroupBuy/syncStock.do',
		type: 'post',
		data: {groupBuyId: groupBuyId},
		dataType: 'json',
	})
	.done(function (json) {
		displayAlertSuccess(json.error);
	})
	.fail(function (xhr) {
		if (xhr.responseJSON != null)
			displayAlertWarning(xhr.responseJSON.error);
	});
}

	.dependent('paymentMethod[]', function(val, data, callback) {
		var cc_a = [
			'paymentValidDaysCc', 
			'groupBuySettings.paymentValidHoursCc',
			'groupBuySettings.checkoutFlow',
			'groupBuySettings.installments[]',
		];
		var cc = $.inArray('ALLPAY_CREDITCARD', val) != -1 || $.inArray('PERIOD', val) != -1;
		var show = [], hide = [];
		(cc ? show : hide).push.apply(cc ? show : hide, cc_a);
		($.inArray('CUSTOM', val) != -1 ? show : hide).push('groupBuySettings.customPaymentMethod');
		($.inArray('PAY_ON_DELIVERY', val) != -1 ? show : hide).push('groupBuySettings.backOrderCodDisabled');
		if (!cc) {
			hide.push('groupBuySettings.installmentMinAmount', 'groupBuySettings.installmentFee3', 'groupBuySettings.installmentFee6', 'groupBuySettings.installmentFee12');
		}
		return {show: show, hide: hide};
	})
	.dependent('groupBuySettings.installments[]', function(val, data, callback) {
		var periods = {'THREE':'groupBuySettings.installmentFee3', 'SIX':'groupBuySettings.installmentFee6', 'TWELVE':'groupBuySettings.installmentFee12'};
		var cc = $.inArray('ALLPAY_CREDITCARD', editor.field('paymentMethod[]').val()) != -1 || $.inArray('PERIOD', editor.field('paymentMethod[]').val()) != -1;
		var show = [], hide = [];
		$.each(periods, function(k, name) {
			(cc && $.inArray(k, val) != -1 ? show : hide).push(name);
		});
		(cc && val != null && val.length > 0 ? show : hide).push('groupBuySettings.installmentMinAmount');
		return {show: show, hide: hide};
	});

function registerStatistics() {
	$('#example tbody').on('click', 'button.btn-statistics', function (e) {
		e.stopPropagation();
		var $btn = $(this);
		var tr = $btn.closest('tr').prev('tr');
		var row = $('#example').DataTable().row(tr).data();
		if (row == null) return;
		btnStartLoading($btn);
		fetchStatistics(row.groupBuyId, function (groupBuyStatistics) {
			$btn.closest('.card-body-statistics').html(renderStatistics(groupBuyStatistics));
		});
	});
}

function fetchStatistics(groupBuyId, callback) {
	return $.ajax({
		url: GBF.baseUrl + '/ajax/GroupBuy/statistics.do?groupBuyId=' + groupBuyId,
		dataType: 'json',
	})
	.done(function (json) {
		if (typeof callback == 'function') callback(json.data);
	});
}

function renderStatistics(groupBuyStatistics) {
	if (groupBuyStatistics == null)
		return '';
	var a = ''
	if (groupBuyStatistics.revenue != null) {
		a = '<div class="row mb-4">'
		+ '<div class="col-4 col-lg-3"><span class="span-digit">'+groupBuyStatistics.revenue+'</span><span class="span-label">銷售金額</span></div>'
		+ '<div class="col-4 col-lg-3"><span class="span-digit">'+groupBuyStatistics.paidTotal+'</span><span class="span-label">已收付款金額</span></div>'
		+ '<div class="col-4 col-lg-3"><span class="span-digit">'+groupBuyStatistics.paidTotalWithoutShipping+'</span><span class="span-label">已收付款金額(扣除運費)</span></div>'
		+ '</div>'
	}

	var b = '<div class="row">'
		+ '<div class="col-3"><span class="span-digit">'+groupBuyStatistics.orders+'</span><span class="span-label">訂單數量</span></div>'
		+ '<div class="col-3"><span class="span-digit">'+groupBuyStatistics.unprocessedOrders+'</span><span class="span-label">未處理數量</span></div>'
		+ '<div class="col-3"><span class="span-digit">'+groupBuyStatistics.unshippedOrders+'</span><span class="span-label">未出貨數量</span></div>'
		+ '<div class="col-3"><span class="span-digit">'+groupBuyStatistics.unshippedBackOrders+'</span><span class="span-label">預購未出貨數量</span></div>'
		+ '</div>'
	return a + b;
}

$.fn.paginationJump = function (table) {
	var $pagejump = $(this).closest('.dataTables_wrapper').find('.pagejump');
	var html = '<div class="card-footer"><div class="row"><div class="col-md-6 col-lg-8"></div><div class="col-md-6 col-lg-4"><div class="input-group"><div class="input-group-prepend"><span class="input-group-text">總頁數<span class="jump_page_total"></span></span></div><input name="jump_page_number" class="jump_page_number form-control" placeholder="輸入頁數" type="text"><div class="input-group-append"><button class="m-0 btn btn-default btn_jump_page">確認</button></div></div></div></div></div>';
	$pagejump.html(html);
	var update = function () {
		var info = table.page.info();
		$pagejump.find('.jump_page_total').text(info.pages);
	};
	var jump = function () {
		var info = table.page.info();
		var n = parseInt($pagejump.find('.jump_page_number').val(), 10);
		if (isNaN(n)) return;
		n = Math.max(1, Math.min(info.pages, n));
		table.page(n - 1).draw('page');
	};
	table.on('draw', update);
	update();
	$pagejump.on('click', '.btn_jump_page', jump);
	$pagejump.on('keypress', '.jump_page_number', function (e) {
		if (e.which == 13) jump();
	});
	return this;
};
